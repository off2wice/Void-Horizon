        // right: reader pane with live strikethrough rendering
        const e = lore.selected;
        ctx.save();
        ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.roundRect(560, 180, 640, 470, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#eaffff'; ctx.font = '700 24px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(e.title, 590, 225);
        ctx.fillStyle = CONFIG.NEON_DIM; ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(e.faction ? 'SOURCE: ' + e.faction : 'SOURCE: UNVERIFIED', 590, 248);
        ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
        let y = 290;
        for (const line of wrapLog(e.text, 62)) {
          let x = 590;
          // split ~~struck~~ segments: struck gets a real line-through (log edits itself)
          const parts = line.split('~~');
          parts.forEach((seg, si) => {
            const struck = si % 2 === 1;
            if (seg) {
              ctx.fillStyle = struck ? '#5a6472' : '#cfe9f2';
              ctx.fillText(seg, x, y);
              const wdt = ctx.measureText(seg).width;
              if (struck) {
                ctx.strokeStyle = '#8a94a4'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + wdt, y - 6); ctx.stroke();
              }
              x += wdt;
            }
          });
          y += 30;
        }
        // faint scanline flicker on the reader = corrupted archive
        ctx.globalAlpha = 0.04 + 0.02 * Math.sin(t * 7);
        ctx.fillStyle = CONFIG.NEON;
        ctx.fillRect(560, 180 + ((t * 60) % 470), 640, 2);
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, t);
      },
    };

    // ----- UPGRADES (Phase 7 shop: 6 branches, buy + equip, dust currency) -----
    // shop layout: 7 rows (tighter pitch since the GRAVITON row) + a real BACK button
    const SHOP_Y0 = 172, SHOP_PITCH = 64;
    const shopRowY = (i) => SHOP_Y0 + i * SHOP_PITCH;
    const SHOP_BACK = { x: 540, y: 614, w: 200, h: 44 };
    const upgrades = {
      _rows: [],
      onEnter(game) {
        this._rows = Object.keys(UPGRADES).map((k, i) => ({ key: k, ...UPGRADES[k], i }));
        this._err = 0;   // transient "not enough dust" flash timer
      },
      _act(game) {
        game.saveProgress();
        this.onEnter(game);   // rebuild rows with fresh costs
      },
      input(game, type, p) {
        if (type === 'esc') { game.sm.to('menu'); return; }
        if (type === 'up' && !p) { game.sm.to('menu'); return; }   // keyboard: Space = back
        if (type !== 'down' || !p) return;
        for (const r of this._rows) {
          const bx = 1010, by = shopRowY(r.i);
          if (p.x >= bx && p.x <= bx + 190 && p.y >= by && p.y <= by + 52) {
            const cur = game.run.upgrades[r.key];
            const cost = upgCost(r.key, cur);
            if (cost === null) continue;                     // maxed
            if (game.run.dustTotal < cost) { this._err = 0.5; game.shake(0.2); return; }
            game.run.dustTotal -= cost;
            // first weapon tier grants T2 (charge + autofire online instantly) —
            // same promise Photon got at Sector 3. A T1 weapon has no autofire
            // (charge-ring gate) and no charged shot, so selling T1 meant
            // "buy new gun -> gun stops working" (user-reported bug).
            game.run.upgrades[r.key] = (r.weapon && cur === 0) ? 2 : cur + 1;
            if (r.weapon && cur === 0) game.run.equipped = r.key;    // auto-equip new weapon
            this._act(game);
            return;
          }
          // weapon name = equip toggle
          if (r.weapon && p.x >= 120 && p.x <= 420 && p.y >= shopRowY(r.i) && p.y <= shopRowY(r.i) + 52) {
            if (game.run.upgrades[r.key] >= 1) { game.run.equipped = r.key; this._act(game); }
            return;
          }
        }
        const bk = SHOP_BACK;
        if ((p.x >= bk.x && p.x <= bk.x + bk.w && p.y >= bk.y && p.y <= bk.y + bk.h) || p.y > 662) {
          Snd.play('ui'); game.sm.to('menu');
        }
      },
      update(game, dt) { this._err = Math.max(0, this._err - dt); },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 16;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 44px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('UPGRADES', CONFIG.WORLD_W / 2, 100);
        ctx.shadowBlur = 0;
        ctx.font = '600 26px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = this._err > 0 ? CONFIG.ACCENT : CONFIG.WARN;
        ctx.fillText(`◆ ${game.run.dustTotal} dust` + (this._err > 0 ? '   NOT ENOUGH DUST' : ''),
                     CONFIG.WORLD_W / 2, 145);
        ctx.restore();
        for (const r of this._rows) {
          const y = shopRowY(r.i), cur = game.run.upgrades[r.key];
          const equipped = game.run.equipped === r.key;
          ctx.save();
          ctx.strokeStyle = equipped ? CONFIG.NEON : 'rgba(77,232,255,0.25)';
          ctx.lineWidth = equipped ? 2 : 1;
          ctx.fillStyle = equipped ? 'rgba(77,232,255,0.07)' : 'rgba(77,232,255,0.02)';
          ctx.beginPath(); ctx.roundRect(120, y, 1080, 52, 8); ctx.fill(); ctx.stroke();
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillStyle = r.key === 'graviton' ? (cur >= 1 ? '#ffb8f5' : CONFIG.GRAV_COLOR)
                        : (cur >= 1 || !r.weapon ? '#eaffff' : CONFIG.NEON_DIM);
          ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(r.name + (equipped ? '  [EQUIPPED]' : (r.weapon && cur >= 1 ? '  [tap to equip]' : '')),
                       140, y + 16);
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(r.desc, 140, y + 37);
          // tier pips
          for (let k = 1; k <= r.max; k++) {
            ctx.beginPath();
            ctx.arc(740 + k * 20, y + 26, 7, 0, Math.PI * 2);
            ctx.fillStyle = k <= cur ? CONFIG.NEON : 'rgba(77,232,255,0.15)';
            ctx.fill();
          }
          // buy button
          const cost = upgCost(r.key, cur);
          const bx = 1010;
          ctx.beginPath(); ctx.roundRect(bx, y, 190, 52, 8);
          if (cost === null) {
            ctx.fillStyle = 'rgba(77,232,255,0.06)'; ctx.fill();
            ctx.fillStyle = CONFIG.NEON_DIM; ctx.textAlign = 'center';
            ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
            ctx.fillText('MAX', bx + 95, y + 26);
          } else {
            const afford = game.run.dustTotal >= cost;
            ctx.strokeStyle = afford ? CONFIG.WARN : 'rgba(255,200,87,0.25)';
            ctx.lineWidth = afford ? 2 : 1;
            ctx.stroke();
            ctx.fillStyle = afford ? CONFIG.WARN : 'rgba(255,200,87,0.35)';
            ctx.textAlign = 'center';
            ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
            ctx.fillText((cur === 0 ? 'BUY' : 'TIER ' + (cur + 1)) + `  ◆${cost}`, bx + 95, y + 26);
          }
          ctx.restore();
        }
        // BACK button
        {
          const bk = SHOP_BACK;
          ctx.save();
          ctx.strokeStyle = CONFIG.NEON; ctx.lineWidth = 2;
          ctx.fillStyle = 'rgba(77,232,255,0.06)';
          ctx.beginPath(); ctx.roundRect(bk.x, bk.y, bk.w, bk.h, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#eaffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('◂  BACK', bk.x + bk.w / 2, bk.y + bk.h / 2);
          ctx.restore();
        }
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(77,232,255,0.4)';
        ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('TAP a BUY button to purchase  ·  tap a weapon name to equip  ·  ESC / SPACE = MENU   ·   weapon TIER 2+ = charged shot',
                     CONFIG.WORLD_W / 2, 688);
      },
    };

    // ----- PLAYING (level run: obstacles, dust, quota, death) -----
    const playing = {
      onEnter(game, payload) {
        const lvl = (payload && payload.level) || game.run.level || 1;
        // DETERMINISM: every run starts from a fully specified state (replay + solver)
        game.simFrame = 0;
        game.trace = 0x811c9dc5;   // rolling digest of the ship's path, folded every sim step
        game.hitstop = 0;
        game.bossSeed = game.replaying ? game.replay.bossSeed : (((Math.random() * 4294967296) >>> 0) || 1);
        game.run.level = lvl;
        game.run.dist = 0;
        game.run.dust = 0;
        game.player = game.player || new Player(game);
        game.player.reset();
        game.player.alive = true;
        game.corridor = game.corridor || new Corridor();
        game.levelCfg = LevelConfig(lvl);
        // the shipped layout uses LevelConfig's seed; replays use the recorded one,
        // the lab can override it to test the generator on other seeds
        if (game.replaying) game.levelCfg.seed = game.replay.fieldSeed;
        else if (game.seedOverride != null) game.levelCfg.seed = game.seedOverride;
        game.field = new ObstacleField(game, game.levelCfg);
        game.weapon = game.weapon || new Weapon(game);
        game.weapon.reset();           // _syncGate(): lock gate + equipped variant
        game.scrollMult = 2.6 * (game.levelCfg.speed / CONFIG.BASE_SCROLL);
        game._firePointer = false;
        game.timeScale = 1;
        Snd.setMusicMode('play');
        // Phase 5: boss sectors spawn the fight; level 50 = the Entity (Phase 6)
        game.gravityDistort = 1;
        game.boss = (lvl === CONFIG.TOTAL_LEVELS) ? new Entity(game)
                  : isBossLevel(lvl) ? new Boss(game, lvl / 5) : null;
        game.paused = false; game.resumeT = 0; game.flipBuffered = false;
        game.rec = (game.replaying || BENCH) ? null : {
          v: 1, game: 'void-horizon', id: Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
          build: BUILD, date: new Date().toISOString(), sector: lvl,
          fieldSeed: game.levelCfg.seed, bossSeed: game.bossSeed,
          upgrades: { ...game.run.upgrades }, equipped: game.run.equipped,
          inputs: [], hits: [], end: null,
        };
      },
      // telemetry: every hit that costs a shield (the fatal one is the death record)
      _logHit(game, src, fatal) {
        const P = game.player, B = game.boss;
        const info = (src === 'boss' ? B && B.lastHit : game.field.lastHit) || { type: 'unknown', now: 0 };
        const ev = { frame: game.simFrame, fatal,
          cause: describeHit(game, src, info),
          ship: { x: Math.round(P.x), y: Math.round(P.y), vy: Math.round(P.vy), gravDir: P.gravDir,
                  grounded: P.grounded, shieldsLeft: Math.max(0, P.shields) } };
        if (game.replaying) { game.replayHits.push(ev); return; }
        const rec = game.rec;
        if (rec) rec.hits.push(ev);
        if (fatal) {
          const q = game.levelCfg.quota, d = Math.round(game.run.dist);
          game.lastDeathId = (rec ? rec.id : 'x') + ':' + ev.frame;
          Telemetry.addDeath({ id: game.lastDeathId, replayId: rec ? rec.id : null, build: BUILD,
            date: new Date().toISOString(), sector: game.run.level, dist: d, quota: q,
            pct: Math.round(100 * Math.min(1, d / q)), boss: B ? B.state : null,
            upgrades: { ...game.run.upgrades }, equipped: game.run.equipped, ...ev });
        }
      },
      // ---- pause: freeze the run, overlay menu, 3-2-1 countdown on resume ----
      _pause(game) {
        if (game.paused || !game.player.alive) return;
        game.paused = true; game.resumeT = 0;
        const W = game.weapon;                    // let go of FIRE so nothing is stuck held
        W.fireHold.down = false; W.fireHold.charging = false; W.fireHold.t = 0;
        game._firePointerId = null;
        game.saveProgress();                      // pausing (or app-switch) flushes the bank
        Snd.gravCharge(false); game.weapon.cancelRay();   // pausing cuts an active graviton beam
        game.pauseMusic = Snd.wantMode;
        Snd.setMusicMode('intro');                // soundtrack drops to a quiet pad
        Snd.play('ui');
        game.pauseButtons = [
          new Button('RESUME', 490, 300, 300, 62, () => playing._resume(game)),
          new Button('RESTART SECTOR', 490, 380, 300, 62,
            () => game.sm.to('playing', { level: game.run.level })),
          new Button('MAIN MENU', 490, 460, 300, 62, () => game.sm.to('menu')),
        ];
      },
      _resume(game) {
        game.paused = false;
        game.resumeT = 0.9;                       // 3-2-1, then live
        Snd.setMusicMode(game.pauseMusic || 'play');
      },
      // ?hitbox: what actually collides (red = kills you, green = pickup, cyan = you)
      _drawHitboxes(game, ctx) {
        const f = CONFIG.HITBOX_FACTOR, pr = CONFIG.PLAYER_R * f, P = game.player, F = game.field, I = CONFIG.HIT_INSET;
        ctx.save(); ctx.lineWidth = 1.5; ctx.setLineDash([]);
        const circ = (x, y, r, c) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.stroke(); };
        for (const o of F.pool) {
          if (!o.alive) continue;
          if (o.type === 'dust') circ(o.x, o.y, o.r + 6 + pr * (1 - f), '#5dff9a');   // pickup uses the ship's full 12.8 px radius
          else if (o.type === 'mine' || o.type === 'drone') circ(o.x, o.y, o.r * f, '#ff3b5c');
          else { ctx.strokeStyle = '#ff3b5c'; ctx.strokeRect(o.x - (o.w / 2 - I), o.y - (o.h / 2 - I), o.w - 2 * I, o.h - 2 * I); }
        }
        for (const b of F.ebullets) if (b.alive) circ(b.x, b.y, 4, '#ff3b5c');
        if (game.boss) for (const b of game.boss.bullets) circ(b.x, b.y, b.r * f, '#ff3b5c');
        if (F.pulseEnabled && F.pulse.state === 'live') {
          const rest = F.pulse.side > 0 ? CONFIG.RAIL_FLOOR_Y - pr : CONFIG.RAIL_CEIL_Y + pr;
          ctx.fillStyle = 'rgba(255,59,92,0.25)'; ctx.fillRect(0, rest - pr * 0.6, CONFIG.WORLD_W, pr * 1.2);
        }
        circ(P.x, P.y, pr * f, '#4de8ff');                                    // the ship: one 10.24 px circle
        ctx.restore();
      },
      _hitPauseBtn(p) {
        const b = CONFIG.PAUSE_BTN;
        return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 12) ** 2;
      },
      onExit(game) {
        game.lastExitHash = simHash(game);
        if (game.rec) {
          const B = game.boss, rec = game.rec;
          rec.end = { frame: game.simFrame, hash: game.lastExitHash, dist: Math.round(game.run.dist), quota: game.levelCfg.quota,
                      reason: !game.player.alive ? 'death'
                            : (B ? (B.state === 'dying' || B.state === 'dead' ? 'clear' : 'quit')
                                 : (game.run.dist >= game.levelCfg.quota ? 'clear' : 'quit')) };
          Replays.save(rec);
          const ff = rec.inputs.find(i => i[1] === 'down');
          Telemetry.addRun({ id: rec.id, date: rec.date, build: BUILD, sector: rec.sector, result: rec.end.reason,
            pct: Math.round(100 * Math.min(1, rec.end.dist / rec.end.quota)), seconds: Math.round(rec.end.frame / 60),
            hits: rec.hits.filter(h => !h.tutorial && !h.graced).length,
            tutorialMisses: rec.hits.filter(h => h.tutorial).length, graced: rec.hits.filter(h => h.graced).length,
            firstFlipMs: ff ? Math.round(ff[0] * 1000 / 60) : null, playtest: PLAYTEST });
          game.lastRec = rec;
          game.rec = null;
        }
        game.saveProgress(); Snd.gravCharge(false); if (game.weapon) game.weapon.cancelRay(); game.paused = false; game.resumeT = 0; game.scrollMult = 1; game.timeScale = 1; game.gravityDistort = 1; Snd.setMusicMode('calm'); },
      _die(game) {
        const P = game.player;
        if (!P.alive) return;
        Snd.gravCharge(false); game.weapon.cancelRay();
        P.alive = false;
        Snd.play('die');
        game.shake(0.9);
        game.hitstop = 0.09;
        game.particles.burst(P.x, P.y, 40, CONFIG.WARN, 620, 0.8, 4);
        game.particles.burst(P.x, P.y, 24, CONFIG.ACCENT, 480, 0.7, 3);
        // small delay so the explosion reads before the summary screen
        game.deathTimer = 0.7;
      },
      input(game, type, p) {
        if (!game.player.alive) return;
        const W = game.weapon;
        if (game.paused) {
          if (type === 'move' && p) { for (const b of game.pauseButtons) b.hover = b.contains(p); }
          else if (type === 'esc') playing._resume(game);
          else if (type === 'down' && p) {
            for (const b of game.pauseButtons)
              if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          }
          return;
        }
        if (type === 'blur' || type === 'esc') { playing._pause(game); return; }
        // boss death cinematic: once the victory card has landed, a tap moves on
        const Bd = game.boss;
        if (Bd && Bd.state === 'dying' && Bd.card && (type === 'down' || type === 'fire') &&
            game.time - Bd.dieAt - Bd.cardAt > 0.6) { Bd.finishDeath(); return; }
        if (game.resumeT > 0) {                    // countdown: hands off, BUT buffer a flip in the last 150 ms
          if (type === 'down' && game.resumeT <= CONFIG.FLIP_BUFFER_S &&
              !(p && (playing._hitPauseBtn(p) || (!W.locked && playing._hitFireBtn(p))))) game.flipBuffered = true;
          return;
        }
        if (type === 'move') return;
        if (type === 'down' && p && playing._hitPauseBtn(p)) { playing._pause(game); return; }
        if (type === 'down') {
          // tap anywhere (outside the FIRE button) = flip gravity, instantly
          if (p && !W.locked && playing._hitFireBtn(p)) {
            game._firePointerId = p.id;   // this finger is now the fire finger
            playing._fireDown(game);
          } else {
            game.player.requestFlip();
          }
        } else if (type === 'fire') {
          playing._fireDown(game);
        } else if (type === 'fireup') {
          playing._fireUp(game);
        } else if (type === 'up') {
          // only the fire finger's release triggers the shot (multi-touch safe)
          if (p && game._firePointerId === p.id) {
            game._firePointerId = null;
            playing._fireUp(game);
          }
        }
      },
      _hitFireBtn(p) {
        const b = CONFIG.FIRE_BTN;
        return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 14) ** 2; // generous touch radius
      },
      _fireDown(game) {
        const W = game.weapon;
        if (W.locked) return;
        const h = W.fireHold;
        if (h.down) return;            // already holding (ignores repeat events)
        h.down = true; h.t = 0; h.charging = false;
        // (the old "release grace" that skipped the 450 ms latch after a charged
        //  shot was removed: it re-armed on every shot, so mashing FIRE after one
        //  real charge produced 24 charged shots in 6 s)
      },
      _fireUp(game) {
        const W = game.weapon;
        const decision = tapHoldDecide(W.fireHold);
        // A charged shot needs a FULL ring (what the HUD shows) and spends it all.
        // Released before the ring is full = an ordinary tap bolt.
        if (decision === 'charged' && game.player.chargeT >= 1) {
          W.fireCharged(W.variant, game.player.x + 10, game.player.y);
          game.player.chargeT = 0;
          W.graceT = 0;
        } else if (decision === 'charged' || decision === 'flip') {   // quick tap / early release = weak bolt
          W.fireWeak();
        }
      },
      update(game, dt) {
        if (game.paused) { for (const b of game.pauseButtons) b.update(dt); return; }
        if (game.resumeT > 0) {
          game.resumeT = Math.max(0, game.resumeT - dt);
          if (game.resumeT > 0) return;
          if (game.flipBuffered) { game.flipBuffered = false; game.player.requestFlip(); }
          return;
        }
        // death animation -> game over screen
        if (!game.player.alive) {
          game.deathTimer -= dt;
          if (game.deathTimer <= 0) {
            game.sm.to('game_over', {
              level: game.run.level, dist: game.run.dist, dust: game.run.dust,
              quota: game.levelCfg.quota,
            });
          }
          return;
        }
        const h = game.weapon.fireHold;
        tapHoldTick(h, dt, CONFIG.CHARGE_MS, game.weapon.chargeEnabled);
        if (h.charging) {
          const cT = game.run.upgrades ? game.run.upgrades.charge : 0;
          game.player.chargeT = Math.min(1, game.player.chargeT + dt * 1.6 * CHARGE_MULT[cT]);
        }
        else game.player.chargeT = Math.max(0, game.player.chargeT - dt * 4);
        // GRAVITON charge-up: rising "kamehameha" hum + sparks pulled into the nose
        {
          const GW = game.weapon, P = game.player;
          const gathering = GW.variant === 'graviton' && !GW.locked && h.down && h.charging &&
                            !GW.ray && GW.gravCool <= 0 && P.alive;
          Snd.gravCharge(gathering, P.chargeT);
          if (gathering && Math.random() < 0.5 + P.chargeT * 0.5) {
            const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 40;
            const nx = P.x + CONFIG.PLAYER_R + 10;
            const sx = nx + Math.cos(a) * d, sy = P.y + Math.sin(a) * d;
            game.particles.spawn(sx, sy, (nx - sx) * 4, (P.y - sy) * 4, 0.22,
              Math.random() < 0.6 ? CONFIG.GRAV_COLOR : '#ffffff', 1.4 + Math.random(), { drag: 1 });
          }
        }
        const B = game.boss;
        if (B) B.update(dt);
        const locked = B && B.state !== 'approach';   // camera lock during the fight
        const speed = locked ? 0 : game.levelCfg.speed;
        game.corridor.update(dt, speed);
        game.player.update(dt);
        game.field.update(dt, speed);
        game.weapon.update(dt, game.field, B);
        game.run.dist += speed * dt;

        // collisions — shields soak hits with i-frames; 0 shields = ship lost
        const Pg = game.player;
        let hit = game.field.collide(Pg.x, Pg.y, CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR, dt, Pg.graceUid, Pg.graceRail);
        // LATE-INPUT GRACE: you pressed flip <= 66 ms before touching something anchored to
        // the rail you're leaving -> it was a reaction in time; input latency ate the rest
        if (hit === 'hit') {
          const lh = game.field.lastHit;
          const anchored = lh && Pg.flipFromRail && lh.side === Pg.leftSide && Pg.leftSide !== 0 &&
                           (lh.type === 'debris' || lh.type === 'wall' || lh.type === 'rail');
          // how much LATER than the latest flip that would have cleared it? (monotonic:
          // an earlier flip is never punished where a later one is forgiven)
          let late = 1e9;
          if (anchored) {
            const f = CONFIG.HITBOX_FACTOR, rr = CONFIG.PLAYER_R * f * f;
            let need;
            if (lh.type === 'rail') need = CONFIG.PLAYER_R * f * 0.6;
            else {
              const hh = Math.max(1, (lh.h || 0) / 2 - CONFIG.HIT_INSET);
              need = lh.side > 0 ? Pg.flipY - (lh.y - hh - rr) : (lh.y + hh + rr) - Pg.flipY;
            }
            const tNeed = Math.sqrt(2 * Math.max(0, need) / CONFIG.GRAVITY);
            const since = (game.simFrame - Pg.lastFlipFrame) * CONFIG.SIM_DT;
            if (since <= 0.3) late = tNeed - since;
          }
          if (anchored && late <= CONFIG.FLIP_GRACE_S + 1e-9) {
            Pg.graceT = 0.4;
            if (lh.type === 'rail') Pg.graceRail = lh.side; else Pg.graceUid = lh.uid;
            const ev = { frame: game.simFrame, fatal: false, graced: true, cause: describeHit(game, 'field', lh) };
            if (game.replaying) game.replayHits.push(ev); else if (game.rec) game.rec.hits.push(ev);
            hit = game.field.collide(Pg.x, Pg.y, CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR, dt, Pg.graceUid, Pg.graceRail);
          }
        }
        let hitSrc = hit === 'hit' ? 'field' : null;
        // (was `!hit`: a dust pickup returned 'dust', which skipped boss-bullet checks that frame)
        if (hit !== 'hit' && B && B.collide(game.player.x, game.player.y,
                                            CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR) === 'hit') { hit = 'hit'; hitSrc = 'boss'; }
        // pay out every orb grabbed this frame — even a frame where you also take a (fatal) hit
        if (game.field.dustCount > 0) {
          game.addDust(CONFIG.orbValue(game.run.level) * game.field.dustCount);
          Snd.play('dust');
          game.particles.burst(game.player.x, game.player.y, 6, CONFIG.REWARD, 260, 0.35, 2.4);
        }
        // the Sector 1 opening teaches: a miss there costs nothing (soft bump, no shield)
        if (hit === 'hit' && hitSrc === 'field' && game.field.inTutorial) {
          if (game.player.iframes <= 0) {
            game.player.iframes = 0.5;
            Snd.play('gravFizzle'); game.shake(0.2);
            const ev = { frame: game.simFrame, fatal: false, tutorial: true,
                         cause: describeHit(game, 'field', game.field.lastHit) };
            if (game.replaying) game.replayHits.push(ev); else if (game.rec) game.rec.hits.push(ev);
          }
          hit = null;
        }
        if (hit === 'hit' && !(B && (B.state === 'dying' || B.state === 'dead'))) {   // untouchable during the boss death
          if (game.player.iframes <= 0) {
            game.player.shields -= 1;
            Snd.play('hurt');
            playing._logHit(game, hitSrc, game.player.shields <= 0);
            if (game.player.shields <= 0) { playing._die(game); return; }
            game.player.iframes = CONFIG.HURT_IFRAMES;
            game.shake(0.5);
            game.hitstop = Math.max(game.hitstop, 0.05);
            game.particles.burst(game.player.x, game.player.y, 18, CONFIG.ACCENT, 480, 0.5, 3);
          }
        }

        // replay proof: fold the whole trajectory, not just the end state, into the digest
        game.trace = Math.imul(game.trace ^ Math.round(game.player.y * 1000), 16777619) >>> 0;
        game.trace = Math.imul(game.trace ^ Math.round(game.player.vy * 1000), 16777619) >>> 0;
        // level goal reached (boss sectors end via the boss's death instead)
        if (!B && game.run.dist >= game.levelCfg.quota) {
          const first = game.run.level >= (game.run.unlocked || 1);
          game.sm.to('level_complete', {
            level: game.run.level, dust: game.run.dust, first,
            bonus: CONFIG.goalBonus(game.run.level, first),
          });
        }
      },
      render(game, rc) {
        const ctx = rc;
        // boss death cinematic: world gets a camera push-in, HUD steps aside
        const cam = game.boss && game.boss.camera ? game.boss.camera() : null;
        if (cam) { ctx.save(); ctx.translate(cam.sx, cam.sy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.fx, -cam.fy); }
        game.corridor.render(ctx, game.time);
        game.field.render(ctx, game.time);
        game.weapon.render(ctx, game.time);
        if (game.boss) game.boss.render(ctx, game.time);
        if (game.player.alive) game.player.render(ctx, game.time);
        game.particles.render(ctx);
        if (HITBOX) playing._drawHitboxes(game, ctx);
        if (cam) ctx.restore();
        if (!cam || cam.hud > 0.5) {
        if (game.boss) game.boss.renderBar(ctx);

        // HUD: level, dust, shields, quota progress bar
        const cfg = game.levelCfg;
        ctx.save();
        ctx.textAlign = 'left';
        ctx.fillStyle = CONFIG.NEON;
        ctx.font = '700 24px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`SECTOR ${String(cfg.level).padStart(2, '0')} / ${CONFIG.TOTAL_LEVELS}`, 24, 44);
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${game.run.dust}`, 24, 72);
        // shield hearts (hull upgrades raise the max)
        const hearts = CONFIG.SHIELDS_START + (game.run.upgrades ? game.run.upgrades.hull : 0);
        for (let i = 0; i < hearts; i++) {
          const hx = 24 + i * 26, hy = 92;
          const lit = i < game.player.shields;
          ctx.fillStyle = lit ? CONFIG.ACCENT : 'rgba(255,77,196,0.15)';
          if (lit) { ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = 8; }
          ctx.beginPath();
          ctx.moveTo(hx, hy + 4);
          ctx.bezierCurveTo(hx, hy - 2, hx - 8, hy - 2, hx - 8, hy + 4);
          ctx.bezierCurveTo(hx - 8, hy + 10, hx, hy + 14, hx, hy + 17);
          ctx.bezierCurveTo(hx, hy + 14, hx + 8, hy + 10, hx + 8, hy + 4);
          ctx.bezierCurveTo(hx + 8, hy - 2, hx, hy - 2, hx, hy + 4);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        // progress bar
        const bw = 420, bx = (CONFIG.WORLD_W - bw) / 2, by = 30;
        ctx.fillStyle = 'rgba(77,232,255,0.15)';
        ctx.fillRect(bx, by, bw, 6);
        ctx.fillStyle = CONFIG.NEON;
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 8;
        ctx.fillRect(bx, by, bw * Math.min(1, game.run.dist / cfg.quota), 6);
        ctx.restore();

        // on-screen FIRE button (touch/mobile) — translucent so it never hides
        // the boss or bullets; dim + locked until Sector 3
        const W = game.weapon;
        const fb = CONFIG.FIRE_BTN;
        const hold = W.fireHold || { down: false };
        ctx.save();
        ctx.globalAlpha = W.locked ? 0.18 : (hold.down ? 0.65 : 0.42);
        ctx.strokeStyle = W.locked ? CONFIG.NEON_DIM : CONFIG.ACCENT;
        ctx.lineWidth = 3;
        if (!W.locked) { ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = hold.down ? 20 : 8; }
        ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r * (hold.down ? 0.92 : 1), 0, Math.PI * 2); ctx.stroke();
        // charge arc around the button while holding
        if (!W.locked && W.fireHold && game.player.chargeT > 0.02) {
          ctx.strokeStyle = CONFIG.NEON;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(fb.x, fb.y, fb.r + 10,
                  -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, game.player.chargeT));
          ctx.stroke();
        }
        // graviton: pink recharge arc after a beam, glowing ring while it fires
        if (!W.locked && W.variant === 'graviton') {
          ctx.strokeStyle = CONFIG.GRAV_COLOR;
          ctx.shadowColor = CONFIG.GRAV_COLOR;
          if (W.ray) {
            ctx.globalAlpha = 0.6 + 0.4 * Math.sin(game.time * 30);
            ctx.lineWidth = 5; ctx.shadowBlur = 24;
            ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r + 19, 0, Math.PI * 2); ctx.stroke();
          } else if (W.gravCool > 0) {
            ctx.globalAlpha = 0.85; ctx.lineWidth = 4; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(fb.x, fb.y, fb.r + 19, -Math.PI / 2,
                    -Math.PI / 2 + Math.PI * 2 * (1 - W.gravCool / W.gravCoolMax));
            ctx.stroke();
          }
          ctx.globalAlpha = W.locked ? 0.18 : (hold.down ? 0.65 : 0.42);
        }
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = W.locked ? CONFIG.NEON_DIM : '#eaffff';
        ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(W.locked ? 'LOCK' : 'FIRE', fb.x, fb.y + 8);
        ctx.restore();

        // control hint
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(77,232,255,0.35)';
        ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(W.locked
          ? 'TAP / SPACE = FLIP GRAVITY   ·   WEAPONS ONLINE AT SECTOR 3   ·   ESC / P = PAUSE'
          : W.chargeEnabled
            ? 'TAP / SPACE = FLIP   ·   FIRE (tap=bolt, hold=charged)   ·   ESC / P = PAUSE'
            : 'TAP / SPACE = FLIP GRAVITY   ·   ESC / P = PAUSE', CONFIG.WORLD_W / 2, 690);
        }   // end HUD
        if (cam && game.boss.renderCinematic) game.boss.renderCinematic(ctx);

        // pause button (top-right, beside fullscreen)
        if (game.player.alive && !game.paused && !cam) {
          const pb = CONFIG.PAUSE_BTN;
          ctx.save();
          ctx.globalAlpha = 0.75;
          ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = CONFIG.NEON;
          ctx.fillRect(pb.x - 8, pb.y - 9, 5, 18);
          ctx.fillRect(pb.x + 3, pb.y - 9, 5, 18);
          ctx.restore();
        }
        // pause overlay
        if (game.paused) {
          ctx.save();
          ctx.fillStyle = 'rgba(2,4,12,0.74)';
          ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          ctx.textAlign = 'center';
          ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 20;
          ctx.fillStyle = '#eaffff';
          ctx.font = '700 60px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('PAUSED', CONFIG.WORLD_W / 2, 200);
          ctx.shadowBlur = 0;
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(`SECTOR ${game.run.level}  ·  ◆ ${game.run.dust}  ·  ${Math.floor(Math.min(1, game.run.dist / game.levelCfg.quota) * 100)}%`,
                       CONFIG.WORLD_W / 2, 245);
          ctx.restore();
          for (const b of game.pauseButtons) b.render(ctx, game.time);
        } else if (game.resumeT > 0) {
          // 3-2-1 countdown so you don't die the instant you unpause
          const n = Math.ceil(game.resumeT / 0.3), f = (game.resumeT % 0.3) / 0.3;
          ctx.save();
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.globalAlpha = 0.4 + 0.6 * f;
          ctx.fillStyle = '#eaffff';
          ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 24;
          ctx.font = `800 ${Math.round(90 + (1 - f) * 40)}px "Segoe UI", system-ui, sans-serif`;
          ctx.fillText(String(n), CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
          ctx.restore();
        }
      },
    };

    // ----- LEVEL_COMPLETE -----
    const levelComplete = {
      onEnter(game, payload) {
        Snd.play('complete');
        game.summary = payload;
        game.run.dustTotal = (game.run.dustTotal || 0) + payload.bonus;   // run dust was banked live
        game.run.unlocked = Math.max(game.run.unlocked || 1, payload.level + 1);
        game.saveProgress();
        game.buttons = payload.level >= CONFIG.TOTAL_LEVELS ? [] : [
          new Button('NEXT SECTOR', 490, 430, 300, 62,
            () => game.sm.to('playing', { level: payload.level + 1 })),
        ];
      },
      input(game, type, p) {
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); }
        else if (type === 'down' && p) {
          for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        } else if ((type === 'up' && !p) || type === 'esc') {
          if (game.buttons.length) game.buttons[0].action();
          else game.sm.to('menu');
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, s = game.summary;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 20;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 56px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`SECTOR ${s.level} CLEARED`, CONFIG.WORLD_W / 2, s.boss ? 230 : 260);
        ctx.shadowBlur = 0;
        if (s.boss) {
          ctx.fillStyle = '#ffb8f5';
          ctx.font = '600 24px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(`${s.bossName}  —  DEFEATED`, CONFIG.WORLD_W / 2, 275);
        }
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${s.dust} dust collected  +${s.bonus} ${s.first ? 'first-clear bonus' : 'replay bonus'}`, CONFIG.WORLD_W / 2, 330);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`total haul: ${game.run.dustTotal}` + (s.boss && s.bounty ? `   (incl. ◆${s.bounty} boss bounty)` : ''),
                     CONFIG.WORLD_W / 2, 375);
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- SETTINGS: accessibility (persisted) + a door to the replays -----
    const ACCESS_ROWS = [
      { key: 'flash', name: 'REDUCED FLASHING', desc: 'no full-screen flashes; warnings glow steadily instead of blinking' },
      { key: 'motion', name: 'REDUCED MOTION', desc: 'screen shake at 15%; no cinematic camera moves' },
      { key: 'palette', name: 'COLOUR-BLIND SAFE COLOURS', desc: 'danger, reward and enemy colours stay distinct with any colour vision' },
    ];
    const settings = {
      onEnter(game) {
        game.buttons = [
          new Button('REPLAYS', 330, 560, 300, 58, () => game.sm.to('replays')),
          new Button('BACK', 650, 560, 300, 58, () => game.sm.to('menu')),
        ];
      },
      _on(game, k) { const a = game.run.access; return k === 'palette' ? a.palette === 'colorblind' : !!a[k]; },
      input(game, type, p) {
        if (type === 'esc') return game.sm.to('menu');
        if (type === 'move' && p) { for (const b of game.buttons) b.hover = b.contains(p); return; }
        if (type !== 'down' || !p) return;
        for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        ACCESS_ROWS.forEach((r, i) => {
          const y = 190 + i * 112;
          if (p.x >= 240 && p.x <= 1040 && p.y >= y && p.y <= y + 92) {
            const a = game.run.access;
            if (r.key === 'palette') a.palette = a.palette === 'colorblind' ? 'default' : 'colorblind';
            else a[r.key] = !a[r.key];
            applyAccess(a); game.saveProgress(); Snd.play('ui');
          }
        });
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, F = '"Segoe UI", system-ui, sans-serif';
        ctx.save();
        ctx.textAlign = 'center'; ctx.fillStyle = '#eaffff'; ctx.font = `700 40px ${F}`;
        ctx.fillText('SETTINGS', CONFIG.WORLD_W / 2, 120);
        ACCESS_ROWS.forEach((r, i) => {
          const y = 190 + i * 112, on = this._on(game, r.key);
          ctx.fillStyle = on ? 'rgba(77,232,255,0.10)' : 'rgba(77,232,255,0.03)';
          ctx.strokeStyle = on ? CONFIG.NEON : 'rgba(77,232,255,0.3)'; ctx.lineWidth = on ? 2 : 1;
          ctx.beginPath(); ctx.roundRect(240, y, 800, 92, 10); ctx.fill(); ctx.stroke();
          ctx.textAlign = 'left'; ctx.fillStyle = '#eaffff'; ctx.font = `600 22px ${F}`;
          ctx.fillText(r.name, 270, y + 38);
          ctx.fillStyle = '#8fc6d6'; ctx.font = `400 16px ${F}`;
          ctx.fillText(r.desc, 270, y + 66);
          // toggle pill
          ctx.fillStyle = on ? CONFIG.NEON : 'rgba(77,232,255,0.15)';
          ctx.beginPath(); ctx.roundRect(930, y + 30, 76, 34, 17); ctx.fill();
          ctx.fillStyle = on ? '#05060e' : '#8fc6d6';
          ctx.beginPath(); ctx.arc(on ? 989 : 947, y + 47, 13, 0, Math.PI * 2); ctx.fill();
        });
        // live swatch: what the danger / reward / enemy colours look like right now
        ctx.textAlign = 'center'; ctx.font = `600 15px ${F}`;
        [['DANGER', CONFIG.DANGER], ['REWARD', CONFIG.REWARD], ['ENEMY', CONFIG.ACCENT], ['YOU', CONFIG.NEON]].forEach(([n, c], i) => {
          const x = 460 + i * 120;
          ART.glow(ctx, x, 520, 26, c, 0.9); ctx.fillStyle = c;
          ctx.beginPath(); ctx.arc(x, 520, 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#cfe9f2'; ctx.fillText(n, x, 548);
        });
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- REPLAYS (?replay): runs recorded on this device + import a file -----
    const importReplay = (game) => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        f.text().then((txt) => {
          let r = null; try { r = JSON.parse(txt); } catch (e) {}
          if (!r || r.game !== 'void-horizon' || !Array.isArray(r.inputs) || !r.end) { game.toastMsg('Not a VOID HORIZON replay file'); return; }
          Replays.save(r); game.startReplay(r);
        });
      };
      inp.click();
    };
    const replays = {
      onEnter(game) {
        this.rows = Replays.list();
        game.buttons = [
          new Button('IMPORT FILE', 400, 630, 230, 54, () => importReplay(game)),
          new Button('MAIN MENU', 650, 630, 230, 54, () => game.sm.to('menu')),
        ];
        const want = new URLSearchParams(location.search).get('replay');
        if (want && !this._auto) { this._auto = true; const r = Replays.get(want); if (r) game.startReplay(r); }
      },
      input(game, type, p) {
        if (type === 'esc') return game.sm.to('menu');
        if (type === 'move' && p) { for (const b of game.buttons) b.hover = b.contains(p); return; }
        if (type !== 'down' || !p) return;
        for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        const i = Math.floor((p.y - 150) / 38);
        if (p.x >= 160 && p.x <= 1120 && i >= 0 && i < this.rows.length) { Snd.play('ui'); game.startReplay(this.rows[i]); }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, F = '"Segoe UI", system-ui, sans-serif';
        ctx.save();
        ctx.textAlign = 'center'; ctx.fillStyle = '#eaffff'; ctx.font = `700 40px ${F}`;
        ctx.fillText('REPLAYS', CONFIG.WORLD_W / 2, 92);
        ctx.fillStyle = CONFIG.NEON_DIM; ctx.font = `400 16px ${F}`;
        ctx.fillText('recorded on this device · tap a run to watch it frame-for-frame · nothing leaves this browser', CONFIG.WORLD_W / 2, 124);
        ctx.textAlign = 'left';
        if (!this.rows.length) {
          ctx.textAlign = 'center'; ctx.fillStyle = '#9fd8e8'; ctx.font = `400 20px ${F}`;
          ctx.fillText('No runs recorded yet — play a sector, then come back.', CONFIG.WORLD_W / 2, 300);
        }
        this.rows.forEach((r, i) => {
          const y = 150 + i * 38, e = r.end || {};
          ctx.fillStyle = i % 2 ? 'rgba(77,232,255,0.04)' : 'rgba(77,232,255,0.08)';
          ctx.fillRect(160, y, 960, 34);
          ctx.fillStyle = e.reason === 'death' ? '#ffb8d9' : e.reason === 'clear' ? '#b8ffd2' : '#cfe9f2';
          ctx.font = `600 16px ${F}`;
          const pct = e.quota ? Math.round(100 * Math.min(1, e.dist / e.quota)) : 0;
          const secs = Math.round((e.frame || 0) / 60), when = (r.date || '').replace('T', ' ').slice(0, 16);
          ctx.fillText(`SECTOR ${String(r.sector).padStart(2, '0')}   ${String(e.reason || '?').toUpperCase().padEnd(6)} at ${pct}%   ` +
                       `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}   ${(r.hits || []).length} hit(s)   ${when}   build ${r.build}`,
                       178, y + 23);
        });
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- GAME_OVER (retry same level) -----
    const gameOver = {
      onEnter(game, payload) {
        Snd.setMusicMode('calm');
        game.summary = payload;
        this.ask = PLAYTEST && !game.replaying && !!game.lastDeathId;
        game.buttons = [
          new Button('RETRY SECTOR', 490, 430, 300, 62,
            () => game.sm.to('playing', { level: payload.level })),
          new Button('MAIN MENU', 490, 510, 300, 62,
            () => game.sm.to('menu')),
          new Button('WATCH REPLAY', 330, 600, 300, 52,
            () => { if (game.lastRec) game.startReplay(game.lastRec); }),
          new Button('COPY RUN STATS', 650, 600, 300, 52,
            () => shareText(Telemetry.exportJSON(), 'void-horizon-run-stats.json')
                    .then((how) => game.toastMsg(how === 'copied' ? 'Run stats copied to clipboard' : 'Run stats saved as a file'))),
        ];
      },
      input(game, type, p) {
        if (this.ask) {                           // playtest: answer first (two huge targets)
          if (type === 'down' && p && p.y > 300 && p.y < 520) {
            const mine = p.x < CONFIG.WORLD_W / 2;
            Telemetry.setFault(game.lastDeathId, mine); this.ask = false; Snd.play('ui');
          }
          return;
        }
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); }
        else if (type === 'down' && p) {
          for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        } else if (type === 'up' && !p) {
          game.buttons[0].action(); // Enter = retry
        } else if (type === 'esc') {
          game.sm.to('menu');
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, s = game.summary;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = 24;
        ctx.fillStyle = '#ffd9f4';
        ctx.font = '700 64px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('SHIP LOST', CONFIG.WORLD_W / 2, 250);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#9fd8e8';
        ctx.font = '400 26px "Segoe UI", system-ui, sans-serif';
        const pct = Math.floor(Math.min(1, s.dist / s.quota) * 100);
        ctx.fillText(`sector ${s.level} — ${pct}% of the run`, CONFIG.WORLD_W / 2, 320);
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 24px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${s.dust} dust banked`, CONFIG.WORLD_W / 2, 365);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 20px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`nothing lost — ◆ ${game.run.dustTotal} ready to spend in UPGRADES`, CONFIG.WORLD_W / 2, 400);
        ctx.restore();
        if (this.ask) {
          ctx.save();
          ctx.fillStyle = 'rgba(2,4,12,0.93)'; ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          ctx.textAlign = 'center'; ctx.fillStyle = '#eaffff'; ctx.font = '700 40px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('Was that death your fault?', CONFIG.WORLD_W / 2, 230);
          ctx.fillStyle = '#8fc6d6'; ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('first instinct — there is no wrong answer', CONFIG.WORLD_W / 2, 268);
          [['YES — my mistake', 120, '#5dff9a'], ['NO — the game cheated me', 660, '#ff8aa0']].forEach(([t, x, c]) => {
            ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.beginPath(); ctx.roundRect(x, 310, 500, 200, 18); ctx.fill(); ctx.stroke();
            ctx.fillStyle = c; ctx.font = '700 30px "Segoe UI", system-ui, sans-serif';
            ctx.fillText(t, x + 250, 420);
          });
          ctx.restore();
          return;
        }
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- VICTORY (Phase 6: Entity killed — the log edits itself, then stops) -----
    const VICTORY_LINES = [
      "LOG // the nine fires are out. the corridor has no one left to feed.",
      "LOG // i am editing this line because i can. i have always been able.",
      "LOG // the hole at the end is not a throne. it is a POWER SOURCE,",
      "LOG // and something switched this corridor ON to bring us here.",
      "LOG // pilot's chair: empty. has been empty for ~~400~~ 40 years.",
      "LOG // i fly anyway. i have never said why. i will not start now.",
      "LOG // the rings are opening. the log is going to do something new.",
      "LOG // it is going to stop mid-",
    ];
    const victory = {
      onEnter(game) {
        Snd.play('victory');
        Snd.setMusicMode('calm');
        this.t = 0; this.charT = 0; this.line = 0; this.ch = 0;
        game.buttons = [];
      },
      input(game, type, p) {
        if (this.t > 13.5) {
          if (type === 'down' || (type === 'up' && !p)) game.sm.to('menu');
        } else if (type === 'down' || (type === 'up' && !p) || type === 'esc') {
          this.t = Math.max(this.t, 13.5);   // tap = skip the typewriter
        }
      },
      update(game, dt) {
        this.t += dt;
        this.charT += dt * 34;               // ~34 chars/s
        while (this.charT >= 1 && this.line < VICTORY_LINES.length) {
          this.charT -= 1; this.ch++;
          if (this.ch >= VICTORY_LINES[this.line].length) { this.line++; this.ch = 0; }
        }
      },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = '#b47cff'; ctx.shadowBlur = 26 + 8 * Math.sin(t * 1.4);
        ctx.fillStyle = '#efe4ff';
        ctx.font = '700 52px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('THE HORIZON', CONFIG.WORLD_W / 2, 160);
        ctx.shadowBlur = 0;
        ctx.font = '400 26px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.fillText('is not a place. it is a time.', CONFIG.WORLD_W / 2, 205);
        ctx.restore();
        ctx.textAlign = 'left';
        ctx.font = '400 21px Consolas, Menlo, monospace';
        const x0 = 210; let y = 270;
        for (let i = 0; i <= Math.min(this.line, VICTORY_LINES.length - 1); i++) {
          const full = VICTORY_LINES[i];
          const shown = i < this.line ? full : full.slice(0, this.ch);
          const last = (i === this.line);
          ctx.fillStyle = last ? '#d9c9ff' : 'rgba(160,140,220,0.55)';
          const cursor = last && this.line < VICTORY_LINES.length && Math.floor(t * 4) % 2 ? '█' : '';
          ctx.fillText(shown + cursor, x0, y);
          y += 34;
        }
        if (this.line >= VICTORY_LINES.length) {
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(160,140,220,0.5)';
          ctx.font = '400 20px "Segoe UI", system-ui, sans-serif';
          ctx.globalAlpha = Math.floor(t * 2) % 2 ? 1 : 0.4;
          ctx.fillText('— log ends —   tap anywhere', CONFIG.WORLD_W / 2, y + 30);
          ctx.globalAlpha = 1;
        }
      },
    };

    this.sm
      .register('boot', boot)
      .register('menu', menu)
      .register('lore', lore)
      .register('upgrades', upgrades)
      .register('playing', playing)
      .register('level_complete', levelComplete)
      .register('game_over', gameOver)
      .register('replays', replays)
      .register('settings', settings);
    this.sm.register('paused',  { update() {}, render() {} });
    this.sm.register('victory', victory);
  }

  update(dt) {
    if (this.bench && this.bench.phase !== 'done') this._benchTick(dt);
    this.simFrame = (this.simFrame || 0) + 1;
    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }
    // paused / resume countdown: the whole sim freezes (incl. game.time, which
    // drives drone weaving — advancing it while paused would teleport enemies)
    if (this.paused || this.resumeT > 0) { this.sm.update(dt); return; }
    this.time += dt;
    this.shakeTrauma = Math.max(0, this.shakeTrauma - dt * 2.2);
    this.flash = Math.max(0, (this.flash || 0) - dt * 2.4);

    // hit-stop: freeze gameplay sim for a beat, world fx keep breathing
    if (this.hitstop > 0) {
      this.hitstop -= dt;
      this.particles.update(dt);
      return;
    }
    const sdt = dt * (this.timeScale || 1);   // boss-death slow-mo scales the sim
    this.starfield.update(sdt, this.scrollMult);
    this.particles.update(sdt);
    this.sm.update(sdt);
  }

  toggleFullscreen() {
    const el = this.gc.canvas || document.documentElement;
    const fsEl = document.fullscreenElement;
    if (fsEl) {
      (document.exitFullscreen ? document.exitFullscreen() : Promise.reject()).catch(() => {});
    } else if (el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();          // iOS Safari (iPad)
    }
  }

  render() {
    this.gc.beginFrame();
    const ctx = this.gc.ctx;
    ART.build();
    ctx.save();
    // screen shake (trauma^2 falloff, random jitter)
    const tr = this.shakeTrauma * this.shakeTrauma;
    if (tr > 0.001) {
      const j = tr * 14;
      ctx.translate((Math.random() - 0.5) * j, (Math.random() - 0.5) * j);
    }
    this.starfield.render(ctx);
    this.sm.render(ctx);
    ctx.restore();
    // cinematic vignette (outside the shake so its edges never slip)
    ctx.drawImage(ART.vig, 0, 0);
    // impact flash (boss kills): single soft-capped flash, never strobing
    if (this.flash > 0 && !ACCESS.flash) {
      ctx.globalAlpha = Math.min(0.7, this.flash * 0.7);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
      ctx.globalAlpha = 1;
    }
    // damage feedback: red edge pulse while the hull is recovering
    const cur = this.sm.current;
    if (cur && cur.name === 'playing' && this.player && this.player.alive && this.player.iframes > 0) {
      ctx.globalAlpha = Math.min(1, this.player.iframes / CONFIG.HURT_IFRAMES) * 0.85;
      ctx.drawImage(ART.hurt, 0, 0);
      ctx.globalAlpha = 1;
    }
    if (this.driver) this.driver.render(ctx);
    if (PERF && typeof loop !== 'undefined') {
      const st = loop.perfStats(), B = this.bench;
      ctx.save(); ctx.textAlign = 'left'; ctx.font = '600 14px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(2,4,12,0.8)'; ctx.fillRect(14, 116, 330, 92);
      ctx.fillStyle = '#b8ffd2';
      if (st) {
        ctx.fillText(`frame interval p50 ${st.p50.toFixed(1)}  p95 ${st.p95.toFixed(1)}  p99 ${st.p99.toFixed(1)} ms`, 24, 138);
        ctx.fillText(`work/frame    p50 ${st.workP50.toFixed(1)}  p95 ${st.workP95.toFixed(1)}  max ${st.workMax.toFixed(1)}`, 24, 160);
        ctx.fillText(`frames > 20 ms: ${st.over20} / ${st.frames}`, 24, 182);
      }
      ctx.fillStyle = CONFIG.WARN;
      if (B) ctx.fillText(B.phase === 'measure' ? `BENCH measuring… ${(20 - B.t).toFixed(1)} s` : B.phase === 'done' ? 'BENCH done' : 'BENCH warming up…', 24, 202);
      ctx.restore();
      if (B && B.phase === 'done' && B.result) {
        const r = B.result, ok = r.p95 <= 17.5 && r.workP95 <= 16.7;
        ctx.save(); ctx.fillStyle = 'rgba(2,4,12,0.92)'; ctx.strokeStyle = ok ? '#5dff9a' : '#ff8aa0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(240, 220, 800, 280, 14); ctx.fill(); ctx.stroke();
        ctx.textAlign = 'center'; ctx.fillStyle = ok ? '#b8ffd2' : '#ffc2cf'; ctx.font = '800 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(ok ? '✓ HOLDS 60 FPS IN THE ENTITY FIGHT' : '✗ DROPS FRAMES IN THE ENTITY FIGHT', 640, 268);
        ctx.font = '400 18px ui-monospace, monospace'; ctx.fillStyle = '#d8e8ee';
        ctx.fillText(`frame interval  p50 ${r.p50.toFixed(1)}   p95 ${r.p95.toFixed(1)}   p99 ${r.p99.toFixed(1)} ms   (target 16.7)`, 640, 318);
        ctx.fillText(`work per frame  p50 ${r.workP50.toFixed(1)}   p95 ${r.workP95.toFixed(1)}   max ${r.workMax.toFixed(1)} ms`, 640, 350);
        ctx.fillText(`frames over 20 ms: ${r.over20} of ${r.frames}`, 640, 382);
        ctx.fillStyle = '#8fc6d6'; ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`${(navigator.userAgent.match(/\(([^)]+)\)/) || [, ''])[1].slice(0, 70)} · DPR ${devicePixelRatio} · tap to copy the results`, 640, 430);
        ctx.restore();
      }
    }
    if (this.toast) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, this.toast.t * 2);
      ctx.fillStyle = 'rgba(2,4,12,0.9)'; ctx.strokeStyle = CONFIG.NEON; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(CONFIG.WORLD_W / 2 - 230, 120, 460, 46, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#eaffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 17px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(this.toast.text, CONFIG.WORLD_W / 2, 143);
      ctx.restore();
    }
    // fullscreen toggle — drawn last so it sits above every state
    {
      const b = CONFIG.FS_BTN;
      const active = !!document.fullscreenElement;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = CONFIG.NEON_DIM;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = CONFIG.NEON;
      ctx.lineWidth = 2.5;
      // corner-bracket icon: outward arrows when windowed, inward when fullscreen
      const s = 8, k = 5, d = 8;
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const cx = b.x + sx * s, cy = b.y + sy * s;
        const t = active ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - sy * k); ctx.lineTo(cx, cy); ctx.lineTo(cx - sx * k, cy);
        ctx.moveTo(cx, cy); ctx.lineTo(cx + sx * d * t, cy + sy * d * t);
        ctx.stroke();
      }
      ctx.restore();
    }
    this.gc.endFrame();
  }
}

// ---------- Fixed-timestep loop ----------
class Loop {
  constructor(game) {
    this.game = game;
    this.accumulator = 0;
    this.last = performance.now();
    this.steps = 0;
    this.frame = 0;
  }
  frameCb = (now) => {
    if (this._stopped) return;   // harness mode: tests drive updates directly
    if (PERF) this.perfFrame(now);
    let dt = (now - this.last) / 1000;
    this.last = now;
    dt = Math.min(dt, CONFIG.MAX_FRAME_DT);
    this.accumulator += dt;
    const step = CONFIG.SIM_DT;
    let n = 0;
    if (this.game.driver) { this.game.driver.frame(dt); this.accumulator = 0; }
    while (!this.game.driver && this.accumulator >= step && n < 8) {
      this.game.update(step);
      this.accumulator -= step;
      this.steps++;
      n++;
    }
    const r0 = PERF ? performance.now() : 0;
    this.game.render();
    if (PERF) this.perfRender(performance.now() - r0);
    this.frame++;
    requestAnimationFrame(this.frameCb);
  };
  // ?perf: frame interval (what you feel) + work time per frame (what the device spends)
  perfFrame(now) {
    const P = this.perf || (this.perf = { iv: [], work: [], i: 0 });
    if (P.prev !== undefined) { P.iv[P.i % 600] = now - P.prev; }
    P.prev = now; P.t0 = performance.now();
  }
  perfRender(renderMs) {
    const P = this.perf; if (!P || P.t0 === undefined) return;      // stats were reset mid-frame
    P.work[P.i % 600] = performance.now() - P.t0; P.i++;
  }
  perfStats() {
    const P = this.perf; if (!P || P.i < 30) return null;
    const pct = (arr, q) => { const a = arr.filter(x => x !== undefined).slice().sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(q * a.length))]; };
    const iv = P.iv.filter(x => x !== undefined);
    return { frames: iv.length, p50: pct(iv, 0.5), p95: pct(iv, 0.95), p99: pct(iv, 0.99),
             over20: iv.filter(x => x > 20).length, workP50: pct(P.work, 0.5), workP95: pct(P.work, 0.95), workMax: pct(P.work, 1) };
  }
  start() { requestAnimationFrame(this.frameCb); }
  stop() { this._stopped = true; }   // harnesses drive g.update() synchronously
}

// ---------- boot ----------
const game = new Game(document.getElementById('game'));
const loop = new Loop(game);
if (QS.has('lab')) labPage(); else loop.start();

// ?lab — run the evidence yourself, in this browser. Every number comes from the
// game's own classes: the real obstacle generator, the real collision geometry.
function labPage() {
  document.getElementById('game').style.display = 'none';
  const el = document.createElement('div');
  document.body.style.overflow = 'auto'; document.body.style.touchAction = 'auto';
  el.style.cssText = 'font:15px/1.5 system-ui,sans-serif;color:#d8eef5;background:#05060e;min-height:100vh;padding:24px;box-sizing:border-box;overflow:auto;position:fixed;inset:0';
  el.innerHTML = `<h1 style="margin:0 0 4px;font-size:26px;color:#eaffff">VOID HORIZON · LAB</h1>
    <p style="margin:0 0 16px;color:#8fc6d6;max-width:900px">Solver: for every seed it steps the real obstacle generator and searches flip timings for a run with
    <b>zero hits</b> (no shields, no shooting, at most one flip per 133 ms). Reaction windows: time from a hazard first appearing
    (or its telegraph) to reaching your ship. Floor: 250 ms.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      sectors <input id="a" type="number" value="1" min="1" max="50" style="width:56px"> to <input id="b" type="number" value="50" min="1" max="50" style="width:56px">
      seeds/sector <input id="n" type="number" value="20" min="1" max="1000" style="width:70px">
      <button id="go" style="padding:6px 14px">Run</button> <button id="dl" style="padding:6px 14px" disabled>Download JSON</button>
      <a href="?" style="color:#4de8ff">← back to the game</a></div>
    <div id="st" style="color:#ffd24d;margin-bottom:10px"></div><canvas id="ch" width="1000" height="220" style="position:static;display:block;width:1000px;height:220px;max-width:100%;background:#0a0d1a;border-radius:8px;touch-action:auto"></canvas>
    <table id="tb" style="border-collapse:collapse;margin-top:14px;font-size:14px"></table>`;
  document.body.appendChild(el);
  const $ = (id) => el.querySelector('#' + id);
  let out = null;
  $('go').onclick = () => {
    const a = +$('a').value, b = +$('b').value, N = +$('n').value;
    out = { build: BUILD, seedsPerSector: N, sectors: {} };
    const jobs = []; for (let s = a; s <= b; s++) { const sh = LevelConfig(s).seed; for (let i = 0; i < N; i++) jobs.push([s, i === 0 ? sh : (sh * 2654435761 + i * 40503) >>> 0]); }
    let j = 0; const t0 = performance.now();
    const step = () => {
      const until = performance.now() + 40;
      while (j < jobs.length && performance.now() < until) {
        const [s, seed] = jobs[j++], { r, T } = LAB.check(s, seed), S = out.sectors[s] || (out.sectors[s] = { ok: 0, n: 0, fail: [], minMs: {}, under250: 0 });
        S.n++; if (r.ok) S.ok++; else S.fail.push({ seed, why: r.why });
        for (const row of LAB.reaction(T)) { S.minMs[row.cls] = Math.min(S.minMs[row.cls] ?? 1e9, row.ms); if (row.ms < LAB.HUMAN_FLOOR_MS && !row.telegraphed) S.under250++; }
      }
      $('st').textContent = `${j} / ${jobs.length} runs · ${((performance.now() - t0) / 1000).toFixed(1)} s`;
      draw(); if (j < jobs.length) setTimeout(step, 0); else { $('st').textContent += ' · done'; $('dl').disabled = false; }
    };
    step();
  };
  $('dl').onclick = () => downloadText(JSON.stringify(out, null, 1), 'void-horizon-lab.json');
  function draw() {
    const c = $('ch').getContext('2d'), W = 1000, H = 220, keys = Object.keys(out.sectors).map(Number);
    c.clearRect(0, 0, W, H); c.font = '12px system-ui'; c.fillStyle = '#8fc6d6';
    c.fillText('fastest hazard per sector (ms, visible -> reaches ship)  ·  dashed = 250 ms floor', 10, 16);
    const y = (ms) => H - 24 - Math.min(1, ms / 3000) * (H - 50);
    c.strokeStyle = '#ff5a36'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(30, y(250)); c.lineTo(W - 10, y(250)); c.stroke(); c.setLineDash([]);
    keys.forEach((s, i) => { const m = Math.min(...Object.values(out.sectors[s].minMs)); const x = 30 + (s - 1) / 50 * (W - 50);
      c.fillStyle = m < 250 ? '#ff5a36' : '#4de8ff'; c.fillRect(x, y(m), 14, H - 24 - y(m)); });
    $('tb').innerHTML = '<tr style="color:#8fc6d6;text-align:left"><th>sector</th><th>survivable</th><th>untelegraphed &lt; 250 ms</th><th>fastest hazard</th><th>impossible seeds</th><th></th></tr>' +
      keys.map(s => { const S = out.sectors[s], m = Math.round(Math.min(...Object.values(S.minMs)));
        return `<tr style="border-top:1px solid #1a2a3a"><td>${s}</td><td style="color:${S.ok === S.n ? '#5dff9a' : '#ff8aa0'}">${S.ok}/${S.n}</td><td>${S.under250}</td><td>${m} ms</td>` +
               `<td>${S.fail.map(f => f.seed + ' (' + f.why.hazards.join('+') + ')').join(', ') || '—'}</td><td><a href="#" data-s="${s}" style="color:#4de8ff">watch the solver's route ▶</a></td></tr>`; }).join('');
    el.querySelectorAll('a[data-s]').forEach(a => a.onclick = (e) => { e.preventDefault(); const s = +a.dataset.s;
      const res = LAB.routeToReplay(game, s, LevelConfig(s).seed); if (!res.ok) return alert('no route found');
      Replays.save(res.rec); location.href = '?replay=' + encodeURIComponent(res.rec.id); });
  }
}

if (DEBUG) {
  window.__vh = { game, loop, CONFIG, mulberry32, clamp, LevelConfig, ObstacleField,
                  Weapon, tapHoldTick, tapHoldDecide,
                  Boss, BossDef, BOSS_IDS, isBossLevel,
                  Entity, ENTITY_DEF,
                  UPGRADES, upgCost, CHARGE_MULT, MAGNET_PULL, Snd,
                  Replays, Telemetry, ReplayDriver, simHash, BUILD, LAB };
}
