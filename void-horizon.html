        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        for (let x = (t * 1400) % 200; x < W; x += 200) ART.glow(ctx, x, y, 60, CONFIG.DANGER, 0.5);
      } else {
        ctx.strokeStyle = d.color; ctx.lineWidth = 2;
        ctx.globalAlpha = Math.floor(t * 12) % 2 ? 0.75 : 0.2;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CONFIG.WORLD_W, y); ctx.stroke();
        ctx.setLineDash([10, 12]); ctx.globalAlpha = 0.3; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, L.y1); ctx.lineTo(CONFIG.WORLD_W, L.y1); ctx.stroke();
      }
      ctx.restore();
    }
    // bullets: additive orbs (cheap enough for 240 on screen)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.bullets) {
      const col = b.homing ? '#ff7ad9' : d.color;
      const rr = b.homing ? b.r + Math.sin(t * 14 + b.life * 9) * 1.5 : b.r;
      ART.glow(ctx, b.x - b.vx * 0.02, b.y - b.vy * 0.02, rr * 2.4, col, 0.35);
      ART.glow(ctx, b.x, b.y, rr * 3, col, 0.85);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, rr * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    const dying = this.state === 'dying' || this.state === 'dead';
    if (dying) this._renderDeathFx(ctx, t, false);
    const col = (this.flash > 0 || (dying && !ACCESS.flash && Math.floor(t * 30) % 2 === 0)) ? '#ffffff' : d.color;
    if (!this.gone) {
    // body: aura, orbiting halo rings, gradient core, tracking eye
    const sw = dying ? this._swell() : 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    if (dying) {                                   // death throes: violent shake + swelling core
      const j = 4 + sw * 10;
      ctx.translate((Math.random() - 0.5) * j, (Math.random() - 0.5) * j);
      ctx.scale(1 + 0.25 * sw, 1 + 0.25 * sw);
    }
    ART.glow(ctx, 0, 0, R * 3.4, d.color, 0.4 + 0.15 * Math.sin(t * 2));
    ctx.save();
    ctx.rotate(t * 0.5);
    ctx.strokeStyle = ART._alpha(d.color, 0.55); ctx.lineWidth = 3;
    for (let k = 0; k < 6; k++) {
      ctx.beginPath(); ctx.arc(0, 0, R * 1.6, k * Math.PI / 3, k * Math.PI / 3 + 0.6); ctx.stroke();
    }
    ctx.rotate(-t * 1.3);
    ctx.strokeStyle = ART._alpha(d.color, 0.3); ctx.lineWidth = 1.5;
    for (let k = 0; k < 12; k++) {
      ctx.beginPath(); ctx.arc(0, 0, R * 1.85, k * Math.PI / 6, k * Math.PI / 6 + 0.22); ctx.stroke();
    }
    ctx.restore();
    const body = ctx.createRadialGradient(0, 0, R * 0.1, 0, 0, R * 1.25);
    body.addColorStop(0, ART._alpha(d.color, 0.4));
    body.addColorStop(0.45, 'rgba(16,20,38,0.96)');
    body.addColorStop(1, 'rgba(4,6,14,0.98)');
    ctx.strokeStyle = col; ctx.fillStyle = body; ctx.lineWidth = 3;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    this._shape(ctx, d.shape, t);
    ctx.shadowBlur = 0;
    // battle damage: cracks spread as HP drops
    const dmg = 1 - this.hp / this.maxHp;
    if (dmg > 0.4) {
      ctx.strokeStyle = ART._alpha('#ffb347', 0.35 + 0.4 * dmg); ctx.lineWidth = 1.5;
      const rnd = mulberry32(d.sector * 101);
      ctx.beginPath();
      for (let k = 0; k < Math.floor(dmg * 7); k++) {
        let a = rnd() * Math.PI * 2, rr = R * 0.25;
        ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        for (let s = 0; s < 3; s++) {
          a += (rnd() - 0.5) * 0.8; rr += R * 0.22;
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
      }
      ctx.stroke();
    }
    if (d.key !== 'entity') {
      const P = this.game.player;
      const ea = Math.atan2(P.y - this.y, P.x - this.x);
      const ex = Math.cos(ea) * R * 0.22, ey = Math.sin(ea) * R * 0.22;
      ART.glow(ctx, ex, ey, R * 0.75, col, 0.95);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, R * 0.09, 0, Math.PI * 2); ctx.fill();
    }
    if (dying) {                                   // the core goes white-hot before it blows
      ART.glow(ctx, 0, 0, R * (1.4 + 2.6 * sw), '#ffffff', 0.3 + 0.7 * sw);
      ART.glow(ctx, 0, 0, R * (2 + 2 * sw), d.color, 0.6);
    }
    ctx.restore();
    }
    if (dying) this._renderDeathFx(ctx, t, true);
    // entrance name card
    if (this.state === 'entrance') {
      const a = Math.min(1, this.cardT * 2) * Math.min(1, (1.6 - this.cardT) * 3);
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 24;
      ctx.font = '700 54px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(d.name, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 - 40);
      ctx.shadowBlur = 0; ctx.fillStyle = CONFIG.NEON_DIM;
      ctx.font = '600 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(`${d.faction.toUpperCase()} — SECTOR BOSS`, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 + 4);
      ctx.restore();
    }
  }
  _shape(ctx, s, t) {
    const R = CONFIG.BOSS_R;
    const spin = t * 0.6;
    const poly = (n, r, rot) => {
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        const a = rot + k / n * Math.PI * 2;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    };
    if (s === 0) { poly(6, R, spin); poly(3, R * 0.45, -spin * 2); }                    // hive hex
    else if (s === 1) { poly(4, R, 0); poly(4, R * 0.55, Math.PI / 4); ctx.strokeRect(-R*0.2,-R*0.2,R*0.4,R*0.4); } // legion diamond
    else if (s === 2) {                                                          // choir ring
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let k = 0; k < 5; k++) { const a = spin * 2 + k / 5 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62, 5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, 0, R * 0.3 + Math.sin(t * 4) * 3, 0, Math.PI * 2); ctx.stroke();
    }
    else if (s === 3) { poly(6, R, spin); for (let k = 0; k < 6; k++) { const a = spin + k / 6 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(Math.cos(a) * R * 1.35, Math.sin(a) * R * 1.35, 6, 0, Math.PI * 2); ctx.stroke(); } } // mother + brood
    else if (s === 4) { ctx.fillRect(-R, -R, R * 2, R * 2); ctx.strokeRect(-R, -R, R * 2, R * 2);
      ctx.strokeRect(-R * 0.5, -R * 0.5, R, R);
      ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke(); } // bastion cross
    else if (s === 5) { poly(3, R * 1.15, 0); poly(3, R * 0.7, Math.PI); }             // warlord star
    else if (s === 6) { poly(8, R, spin); poly(4, R * 0.5, spin + Math.PI / 4); }      // resonant octagon
    else if (s === 7) {                                                                // siege
      ctx.strokeRect(-R, -R * 0.7, R * 2, R * 1.4); ctx.fillRect(-R, -R * 0.7, R * 2, R * 1.4);
      ctx.beginPath(); ctx.moveTo(-R * 1.4, 0); ctx.lineTo(-R * 0.6, -R * 0.35); ctx.lineTo(-R * 0.6, R * 0.35);
      ctx.closePath(); ctx.stroke(); }
    else { poly(5, R, spin); poly(5, R * 0.72, -spin * 1.6);                            // umbral herald
      ctx.beginPath(); ctx.arc(0, 0, R * 1.3 + Math.sin(t * 3) * 4, 0, Math.PI * 2); ctx.stroke(); }
  }
  renderBar(ctx) {
    if (this.state === 'approach') return;
    const d = this.def, w = 520, x = (CONFIG.WORLD_W - w) / 2, y = 66;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = d.color;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(d.name + ' — ' + d.faction.toUpperCase(), CONFIG.WORLD_W / 2, y - 8);
    ctx.fillStyle = 'rgba(10,14,28,0.8)';
    ctx.fillRect(x, y, w, 12);
    ctx.fillStyle = d.color;
    ctx.shadowColor = d.color; ctx.shadowBlur = 10;
    ctx.fillRect(x, y, w * clamp(this.hp / this.maxHp, 0, 1), 12);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, 12);
    ctx.restore();
  }
}

// ---------- Phase 6: THE BLACK HOLE ENTITY (level 50) ----------
// Subclasses Boss: same lifecycle (approach -> entrance -> fight -> dying) and
// bullet/laser plumbing, plus:
//  - a gravity-distortion field (game.gravityDistort) that sinusoidally scales
//    and periodically INVERTS the corridor's pull — you must re-time flips
//  - phase shifts at 66% and 33% HP: pattern pool deepens, tempo tightens
//  - screen-wide events: GRAVITY INVERSION and CORE BURST (radial from center)
//  - horizon warp rings rendered behind it; victory routes to the VICTORY state
const ENTITY_DEF = {
  key: 'entity', name: 'THE BLACK HOLE ENTITY', faction: 'IT',
  color: '#b47cff', shape: 9, sector: 10, level: 50,
  hp: 380, bulletSpeed: 1.55, pause: 0.42, dustReward: 400,
  patterns: ['radial', 'fan', 'spiral', 'laser', 'swarm'],
  lore: ''  // filled by LORE_ENTRIES
};

class Entity extends Boss {
  constructor(game) {
    super(game, 9);
    this.def = { ...ENTITY_DEF };
    this.maxHp = ENTITY_DEF.hp; this.hp = ENTITY_DEF.hp;
    this.quota = Math.round(game.levelCfg.quota * 0.4);
    this.winState = 'victory';
    this.fightMusicMode = 'entity';
    this.phase = 1;               // 1 -> 2 (66%) -> 3 (33%)
    this.eventT = 7;              // s until next screen-wide event
    this.event = null;            // { kind:'invert'|'burst', warnT }
    this.distortT = this.rnd() * 10;
    game.gravityDistort = 1;
    this.onDeathCleanup = (g) => { g.gravityDistort = 1; };
  }
  _phaseFor(hpFrac) { return hpFrac <= 0.33 ? 3 : (hpFrac <= 0.66 ? 2 : 1); }
  _startPattern() {
    // deeper pool + rarer breaths as phases progress
    const roll = this.rnd();
    const pool = this.phase === 1 ? ['radial', 'fan', 'spiral', 'laser']
               : this.phase === 2 ? ['fan', 'spiral', 'swarm', 'laser', 'radial']
               : ['spiral', 'swarm', 'laser', 'radial', 'fan', 'burst-spiral'];
    const p = pool[Math.floor(roll * pool.length)];
    this.pat = (p === 'burst-spiral') ? 'spiral' : p;
    this.patT = 0; this.spiralA = this.rnd() * Math.PI * 2; this.fanN = 0;
    this.radial2 = false;
    const fast = this.phase === 3 ? 0.7 : (this.phase === 2 ? 0.85 : 1);
    if (this.pat === 'radial') { this.patDur = 0.9 * fast; this._radial(); }
    else if (this.pat === 'fan') { this.patDur = 1.1 * fast; this._fan(); this.fanN = 1; }
    else if (this.pat === 'spiral') { this.patDur = 1.5 * fast; }
    else if (this.pat === 'laser') { this.patDur = 0.1; this._laser(); }
    else if (this.pat === 'swarm') { this.patDur = 0.7 * fast; this._swarm(); }
  }
  // one bullet volley wider than the sector-9 baseline
  _radial() {
    const d = this.def, n = 14 + this.phase * 4, sp = 150 * d.bulletSpeed;
    const off = this.rnd() * Math.PI;
    for (let k = 0; k < n; k++) this._shoot(this.x, this.y, off + k / n * Math.PI * 2, sp);
    this.game.shake(0.3);
  }
  update(dt) {
    super.update(dt);
    if (this.state !== 'fight' || !this.game.player.alive) {
      // outside the fight: distortion idles at normal (also covers dying)
      this.game.gravityDistort = 1;
      return;
    }
    const g = this.game;
    // phase shift check
    const ph = this._phaseFor(this.hp / this.maxHp);
    if (ph !== this.phase) {
      this.phase = ph;
      g.shake(1); g.hitstop = 0.07;
      this.pat = null; this.pauseT = 0.9;   // clear mid-pattern = fair
      this.eventT = Math.min(this.eventT, 2.2);
      g.particles.burst(this.x, this.y, 36, ENTITY_DEF.color, 560, 0.8, 3.5);
      Snd.play('phase');
    }
    // ---- gravity distortion field: base sine + periodic inversion event ----
    this.distortT += dt;
    const base = 0.82 + 0.28 * Math.sin(this.distortT * (0.35 + this.phase * 0.12));
    if (this.event) {
      const E = this.event;
      E.t += dt;
      if (E.kind === 'invert') {
        if (E.t < E.warnT) { g.gravityDistort = base; }         // warning: field wobbles
        else if (E.t < E.warnT + E.dur) {
          g.gravityDistort = -base;                              // wrong-way pull
          if (!E.tick) { E.tick = true; g.shake(0.55); Snd.play('invert'); }
        } else { this.event = null; g.gravityDistort = base; }
      } else if (E.kind === 'burst') {
        if (E.t >= E.warnT && !E.fired) { E.fired = true; this._coreBurst(); g.shake(0.8); Snd.play('bossIn'); }
        if (E.t > E.warnT + 0.4) this.event = null;
        g.gravityDistort = base;
      }
    } else {
      g.gravityDistort = base;
      this.eventT -= dt;
      if (this.eventT <= 0) {
        this.eventT = this.phase === 3 ? 6.5 : (this.phase === 2 ? 8 : 10);
        const invert = this.rnd() < 0.62;   // inversion is the signature mechanic
        this.event = invert
          ? { kind: 'invert', t: 0, warnT: 1.05, dur: 1.3 + this.phase * 0.25, tick: false }
          : { kind: 'burst',  t: 0, warnT: 1.0, fired: false };
      }
    }
  }
  _coreBurst() {
    // radial from the CORE of the corridor, not from the body
    const cx = CONFIG.WORLD_W * 0.62, cy = CONFIG.WORLD_H / 2;
    const n = 16 + this.phase * 6, sp = 190 * this.def.bulletSpeed;
    const off = this.rnd() * Math.PI * 2;
    for (let k = 0; k < n; k++) this._shoot(cx, cy, off + k / n * Math.PI * 2, sp, { r: 6 });
  }
  render(ctx, t) {
    if (this.gone) { super.render(ctx, t); return; }   // nothing left but the afterglow
    // horizon warp: concentric distorted arcs behind everything (also during
    // approach — the hole is what the corridor has been running toward)
    const cx = CONFIG.WORLD_W * 0.62, cy = CONFIG.WORLD_H / 2;
    ctx.save();
    const distorting = Math.abs((this.game.gravityDistort || 1)) < 0.95 || (this.game.gravityDistort || 1) < 0;
    for (let ring = 0; ring < 5; ring++) {
      const rr = 70 + ring * 46 + Math.sin(t * 1.3 + ring * 1.7) * (6 + ring * 3);
      ctx.globalAlpha = (0.16 - ring * 0.022) * (this.state === 'fight' ? 1 : 0.55);
      ctx.strokeStyle = ENTITY_DEF.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let a = 0; a <= 64; a++) {
        const ang = a / 64 * Math.PI * 2;
        const wob = Math.sin(ang * 3 + t * 2.2 + ring) * (5 + ring * 2) * (distorting ? 2.2 : 1);
        const x = cx + Math.cos(ang) * (rr + wob), y = cy + Math.sin(ang) * (rr + wob) * 0.9;
        a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#020208';
    ctx.shadowColor = ENTITY_DEF.color; ctx.shadowBlur = 46;
    ctx.beginPath(); ctx.arc(cx, cy, 42 + Math.sin(t * 2) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // event warning banner (invert = screen tint + text; burst = flash ring)
    if (this.event && this.state === 'fight') {
      const E = this.event;
      if (E.t < E.warnT) {
        const blink = Math.floor(t * 10) % 2 ? 0.85 : 0.3;
        ctx.save();
        ctx.globalAlpha = blink;
        ctx.textAlign = 'center';
        ctx.fillStyle = E.kind === 'invert' ? '#b47cff' : CONFIG.WARN;
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
        ctx.font = '700 40px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(E.kind === 'invert' ? '⟲ GRAVITY INVERSION' : '◉ CORE BURST',
                     CONFIG.WORLD_W / 2, 150);
        ctx.restore();
      }
    }
    // inversion field tint while gravity is wrong-way
    if ((this.game.gravityDistort || 1) < 0 && this.state === 'fight') {
      ctx.save();
      ctx.globalAlpha = 0.08 + 0.03 * Math.sin(t * 9);
      ctx.fillStyle = ENTITY_DEF.color;
      ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
      ctx.restore();
    }
    super.render(ctx, t);
  }
  _shape(ctx, s, t) {
    // event-horizon body: black disc + accretion ring + lensing arc
    const R = CONFIG.BOSS_R + 6;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.45, R * (0.5 + 0.14 * Math.sin(t * 1.8)),
                                t * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R * 0.55 + Math.sin(t * 5) * 2, t, t + Math.PI * 1.35); ctx.stroke();
  }
}

// ---------- Phase 8: AUDIO (pure Web Audio synth, zero assets) ----------
// Sfx: tiny one-shot oscillator/noise recipes. Music: an ambient drone whose
// intensity follows the game (menu calm -> patrol -> boss -> entity). Audio
// cannot start before a user gesture (Chrome autoplay policy): everything is
// lazy-created on the first pointerdown/keydown, and every call degrades to
// a silent no-op if Web Audio is unavailable.
const Snd = {
  ac: null, master: null, sfxGain: null, musGain: null,
  sfxVol: 0.8, musVol: 0.6, muted: false,
  last: {},                       // rate-limit map: name -> ac time
  mus: null,                      // { nodes..., mode, step, timer }
  ensure() {
    if (this.ac) return this.ac;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      const ac = new AC();
      this.master = ac.createGain();
      this.sfxGain = ac.createGain();
      this.musGain = ac.createGain();
      this.sfxGain.connect(this.master);
      this.musGain.connect(this.master);
      this.master.connect(ac.destination);
      this.ac = ac;
      this._applyGains();
      this._startMusic();
    } catch (e) { this.ac = null; }
    return this.ac;
  },
  // called from the first real user gesture
  unlock() {
    const ac = this.ensure();
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  },
  _applyGains() {
    if (!this.ac) return;
    const m = this.muted ? 0 : 1;
    this.master.gain.setTargetAtTime(0.9 * m, this.ac.currentTime, 0.05);
    this.sfxGain.gain.setTargetAtTime(this.sfxVol, this.ac.currentTime, 0.05);
    this.musGain.gain.setTargetAtTime(this.musVol * 0.5, this.ac.currentTime, 0.2);
  },
  setVolumes(sfx, mus) {
    this.sfxVol = clamp(sfx, 0, 1); this.musVol = clamp(mus, 0, 1);
    this._applyGains();
  },
  toggleMute() { this.muted = !this.muted; this._applyGains(); return this.muted; },
  // generic one-shot helper: freq sweep env, type, dur, gain, optional noise
  _blip(type, f0, f1, dur, gain, opts = {}) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
    if (opts.detune) {
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = type; o2.detune.value = opts.detune;
      o2.frequency.setValueAtTime(f0 * 1.01, t);
      o2.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * 0.99), t + dur);
      g2.gain.setValueAtTime(gain * 0.6, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o2.connect(g2); g2.connect(this.sfxGain);
      o2.start(t); o2.stop(t + dur + 0.02);
    }
  },
  _noise(dur, gain, freq = 800, q = 0.8) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const flt = ac.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = freq; flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(this.sfxGain);
    src.start(t);
  },
  // rate-limits stop an autofire stream from machine-gunning the mixer
  _GATES: { pew: 0.06, boom: 0.05, dust: 0.07, hurt: 0.2, die: 0.5,
            flip: 0.04, beam: 0.1, ui: 0.05, bossIn: 0.4, bigBoom: 0.3,
            phase: 0.4, invert: 0.4, complete: 0.5, victory: 1, riser: 1, impact: 1, zap: 0.3, gravFizzle: 0.15, bossInhale: 1, fanfare: 2, chainBoom: 0.04 },
  play(name) {
    const ac = this.ac; if (!ac || this.muted) return;
    const gate = this._GATES[name] || 0.03;
    const now = ac.currentTime;

  // Epic synthwave in D minor, generated live (still zero assets).
  // 16th-note grid, one chord per bar, 4-bar loop. Layers: kick / snare / hats,
  // filtered saw bass, detuned saw pads, square arp, brass stabs, vibrato lead.

    // [bass root, chord triad] as MIDI notes — one chord per bar
    prog: {
      main:   [[38, [62, 65, 69]], [34, [58, 62, 65]], [41, [60, 65, 69]], [36, [60, 64, 67]]], // Dm Bb F C
      boss:   [[38, [62, 65, 69]], [36, [60, 64, 67]], [34, [58, 62, 65]], [33, [57, 61, 64]]], // Dm C Bb A
      entity: [[38, [62, 65, 69]], [34, [58, 62, 65]], [31, [55, 58, 62]], [33, [57, 61, 64]]], // Dm Bb Gm A

    drums: {
      calm:   { k: 'x.......x.......', s: '........x.......', h: '..x...x...x...x.' },
      play:   { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.' },
      boss:   { k: 'x..x..x.x..x..x.', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx' },
      entity: { k: 'x.x.x..xx.x.x..x', s: '....x..x....x.xx', h: 'xxxxxxxxxxxxxxxx' },

  _startMusic() {

  _schedule() {

    if (m.nextT < now - 0.1) m.nextT = now + 0.05;   // woke late (background tab): resync, no burst
    while (m.nextT < now + 0.12) {

  _step(mode, step, t) {

    const [root, triad] = prog[bar];

    if (s === 0) {
      this._pad(t, triad, spb * 4, mode === 'calm' ? 0.9 : 0.7);
      if (bar === 0 && fight) this._crash(t);

    const d = M.drums[mode];
    if (d) {

      if (d.s[s] === 'x') this._snare(t, mode === 'calm' ? 0.35 : 0.6);
      if (d.h[s] === 'x') this._hat(t, s % 4 === 2 ? 0.16 : 0.08, s % 8 === 6 && mode !== 'calm');

    const bp = M.bass[mode];
    if (bp && bp[s] === 'x') {

      this._bass(t, root + oct, mode === 'calm' ? spb * 1.8 : six * 1.6);

      const k = seq[(mode === 'calm' ? s / 2 : s) % 8];

  },
  _hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); },
  _env(g, t, peak, a, d) {

  _kick(t, v) {

  _snare(t, v) {

  _hat(t, v, open) { this._noiseHit(t, 'highpass', 7500, 0.7, v, open ? 0.14 : 0.035, false); },

    f.frequency.exponentialRampToValueAtTime(220, t + Math.min(dur, 0.25));

    g.gain.exponentialRampToValueAtTime(0.32, t + 0.005);
    g.gain.setValueAtTime(0.32, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.mus.bus);

    f.frequency.linearRampToValueAtTime(900, t + dur);

    g.gain.exponentialRampToValueAtTime(0.06 * v, t + 0.35);
    g.gain.setValueAtTime(0.06 * v, t + dur * 0.8);

    this._env(g, t, v, 0.003, 0.16);

    o.start(t); o.stop(t + 0.22);
  },
  _stab(t, triad, dur) {

    f.type = 'lowpass'; f.Q.value = 3;

    this._env(g, t, 0.13, 0.004, dur);

    g.gain.exponentialRampToValueAtTime(0.07, t + 0.12);
    g.gain.setValueAtTime(0.07, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.mus.bus); g.connect(this.mus.send);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  },
  setMusicMode(mode) {
    this.wantMode = mode;
    if (!this.ac || !this.mus) return;   // applied on unlock via _startMusic
    const m = this.mus;
    if (m.mode === mode) return;
    m.mode = mode;
    // every change lands on a fresh downbeat, so a boss entrance HITS
    m.step = 0;
    m.nextT = Math.max(m.nextT, this.ac.currentTime + 0.04);
    m.delay.delayTime.setTargetAtTime((60 / (this.MUSIC.bpm[mode] || 120)) * 0.75,
                                      this.ac.currentTime, 0.05);
  },
};

// ---------- Title-screen black hole (Interstellar-style, GOLD disk) ----------
// Event horizon + photon ring + edge-on accretion band + lensed light arcing
// over the top and mirrored below — the gif recreated procedurally so it
// matches the game palette, costs zero KB, and animates at 60fps.
// clipHalfW (optional): hard-clips ALL glow to the reserved letter slot so the
// accretion disk never washes out the neighbouring letters (readability fix).
function drawTitleBlackHole(ctx, cx, cy, r, t, clipHalfW) {
  ctx.save();
  ctx.translate(cx, cy);
  if (clipHalfW) {
    ctx.beginPath();
    ctx.rect(-clipHalfW, -cy, clipHalfW * 2, 720 - cy);
    ctx.clip();
  }
  ctx.rotate(-0.32 + Math.sin(t * 0.3) * 0.05);  // fixed dramatic tilt + lazy wobble
  // ghost of the letter, so the title still reads
  ctx.strokeStyle = 'rgba(255,214,140,0.14)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2); ctx.stroke();
  const band = (alpha) => {
    const g = ctx.createLinearGradient(-r * 1.3, 0, r * 1.3, 0);
    g.addColorStop(0,    'rgba(255,190,80,0)');
    g.addColorStop(0.28, `rgba(255,196,90,${0.75 * alpha})`);
    g.addColorStop(0.5,  `rgba(255,244,214,${0.95 * alpha})`);
    g.addColorStop(0.72, `rgba(255,184,72,${0.75 * alpha})`);
    g.addColorStop(1,    'rgba(255,170,60,0)');
    return g;
  };
  // lensed far side of the disk: arcs OVER the top (bright, classic shot)
  ctx.strokeStyle = band(1);
  ctx.lineWidth = r * 0.13;
  ctx.shadowColor = '#ffc85a'; ctx.shadowBlur = 7;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 1.08, r * 0.6, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  // mirrored arc below (dimmer — the "upside-down reflection")
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(0, r * 0.1, r * 1.08, r * 0.6, 0, Math.PI * 1.08, Math.PI * 1.92, true); ctx.stroke();
  ctx.globalAlpha = 1;
  // edge-on accretion band across the middle
  ctx.lineWidth = r * 0.17;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.2, r * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
  // MAGENTA SWIRL: spiral streaks orbiting the disk — matter being dragged in.
  // Drawn in the disk's squashed plane (y *= 0.28/1.2) so they read as edge-on,
  // and modulated so streaks behind the hole fade out.
  {
    const sq = 0.28 / 1.2;                          // disk squash ratio
    const swirl = (phase, rr, alpha) => {
      ctx.strokeStyle = `rgba(255,77,210,${alpha})`;
      ctx.shadowColor = '#ff4dd2'; ctx.shadowBlur = 6;
      ctx.lineWidth = Math.max(1.2, r * 0.05);
      ctx.beginPath();
      for (let k = 0; k <= 14; k++) {
        const f = k / 14;                            // along the streak
        const ang = phase + f * 1.9;                 // spiral sweep
        const rad = rr * (1 - f * 0.34);             // spirals inward
        const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad * sq;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    for (let s = 0; s < 3; s++) {
      const ph = t * 1.9 + s * (Math.PI * 2 / 3);    // orbit speed
      const front = Math.sin(ph) > 0;                // in front of the hole?
      swirl(ph, r * (1.24 - s * 0.06), front ? 0.75 : 0.22);
    }
    ctx.shadowBlur = 0;
  }
  // orbiting flare pip riding the band
  const a = t * 1.4;
  const fx = Math.cos(a) * r * 1.2, fy = Math.sin(a) * r * 0.28;
  ctx.globalAlpha = fy > 0 ? 1 : 0.35;           // behind the hole when up
  ctx.fillStyle = '#fff6e0';
  ctx.shadowColor = '#ffdf9a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(fx, fy, r * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // event horizon (the dark itself)
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000104';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.fill();
  // photon ring — the one absolutely sharp thing
  ctx.strokeStyle = 'rgba(255,250,235,0.95)';
  ctx.lineWidth = Math.max(1.5, r * 0.045);
  ctx.shadowColor = '#ffd98a'; ctx.shadowBlur = 6 + 3 * Math.sin(t * 2);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ---------- EVIDENCE: deterministic replay + on-device death telemetry ----------
// Everything here stays in this browser (localStorage). Nothing is ever sent anywhere.
// A run = the seeds + every input stamped with the sim frame it arrived before.
// The sim is fixed-step and fully seeded, so feeding the same inputs on the same
// frames reproduces the run bit-for-bit; simHash() proves it.
const BUILD = 'depth-1';
const STORE = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');

  const P = g.player, F = g.field, B = g.boss;
  const parts = [g.trace >>> 0, P.y.toFixed(3), P.vy.toFixed(3), P.gravDir, P.shields, g.run.dist.toFixed(2)];
  if (F) {
    parts.push(F.simT.toFixed(4), F.pulse.state, F.pulse.side);
    for (const o of F.pool) if (o.alive) parts.push(o.type[0] + o.x.toFixed(2) + ',' + o.y.toFixed(2));
    for (const b of F.ebullets) if (b.alive) parts.push('b' + b.x.toFixed(2) + ',' + b.y.toFixed(2));
  }
  if (B) parts.push(B.state, B.hp.toFixed(3), B.bullets.length, B.t.toFixed(4));
  return fnv1a(parts.join('|'));
}
const Replays = {
  KEY: 'void-horizon-replays', MAX: 12,
  list() { return STORE.get(this.KEY, []); },
  save(rec) {
    let a = [rec, ...this.list()].slice(0, this.MAX);
    while (a.length && !STORE.set(this.KEY, a)) a = a.slice(0, a.length - 1);   // quota: drop oldest
  },
  get(id) { return this.list().find(r => r.id === id) || null; },
};
const Telemetry = {
  KEY: 'void-horizon-telemetry', MAX: 400,
  all() { return STORE.get(this.KEY, { v: 1, deaths: [] }); },
  addDeath(d) { const t = this.all(); t.deaths.unshift(d); t.deaths = t.deaths.slice(0, this.MAX); STORE.set(this.KEY, t); },
  addRun(r) { const t = this.all(); (t.runs || (t.runs = [])).unshift(r); t.runs = t.runs.slice(0, this.MAX); STORE.set(this.KEY, t); },
  setFault(id, mine) {
    const t = this.all(), d = t.deaths.find(x => x.id === id);
    if (d) { d.myFault = mine; STORE.set(this.KEY, t); }
  },
  exportJSON() {
    const t = this.all(), bySector = {};
    for (const d of t.deaths) {
      const s = bySector[d.sector] || (bySector[d.sector] = { deaths: 0, causes: {}, fault: { yes: 0, no: 0 } });
      s.deaths++; s.causes[d.cause.type] = (s.causes[d.cause.type] || 0) + 1;
      if (d.myFault === true) s.fault.yes++; else if (d.myFault === false) s.fault.no++;
    }
    const runs = t.runs || [], fault = { yes: 0, no: 0, unanswered: 0 };
    for (const d of t.deaths) d.myFault === true ? fault.yes++ : d.myFault === false ? fault.no++ : fault.unanswered++;
    return JSON.stringify({ game: 'void-horizon', build: BUILD, exported: new Date().toISOString(),
                            deathsMyFault: fault, summaryBySector: bySector, runs, deaths: t.deaths }, null, 1);
  },

function downloadText(text, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
// give the player a file (clipboard first, download as fallback)
function shareText(text, filename) {
  const download = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  try {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => 'copied', () => (download(), 'downloaded'));
  } catch (e) {}

// hazard description for a hit: what, and how long the player could see it coming
function describeHit(g, src, hit) {
  const now = hit.now, ms = (t) => (t === undefined || t === null) ? null : Math.round((now - t) * 1000);
  return { type: hit.type, kind: hit.kind || null, side: hit.side || null,
           x: hit.x !== undefined ? Math.round(hit.x) : null, y: hit.y !== undefined ? Math.round(hit.y) : null,
           visibleMs: ms(hit.seenAt), telegraphMs: ms(hit.tellAt), src };

// Playback: feeds a recorded run back through the real sim, frame by frame.
class ReplayDriver {
  constructor(game, rec) {
    this.game = game; this.rec = rec;
    this.speed = 1; this.playing = true; this.acc = 0;
    this.snapshot = JSON.parse(JSON.stringify(game.run));   // replays never touch the real save
    this.restart();
  }
  restart() {
    const g = this.game, r = this.rec;
    g.replaying = true; g.replay = r; g.replayHits = [];
    g.run.upgrades = { ...r.upgrades }; g.run.equipped = r.equipped;
    g.sm.to('playing', { level: r.sector });

  }
  get k() { return this.game.simFrame; }
  stepOne() {
    if (this.done) return;

    while (this.ii < ins.length && ins[this.ii][0] === g.simFrame) {
      const [, type, x, y, id] = ins[this.ii++];
      g.sm.input(type, x === null ? null : { x, y, id });
    }
    if (g.sm.current.name !== 'playing') return this.finish();
    g.update(CONFIG.SIM_DT);
    if (g.sm.current.name !== 'playing') this.finish();
  }
  seek(frame) {                 // re-simulate from the top (fast, no rendering)
    this.restart();
    while (!this.done && this.k < frame) this.stepOne();
  }
  finish() {
    if (this.done) return;
    this.done = true; this.playing = false;
    const g = this.game, r = this.rec;
    const hitsA = (r.hits || []).map(h => h.frame).join(','), hitsB = g.replayHits.map(h => h.frame).join(',');
    this.result = {
      frameMatch: this.k === r.end.frame,
      hashMatch: g.lastExitHash === r.end.hash,
      hitsMatch: hitsA === hitsB,
      frames: this.k, expectedFrames: r.end.frame, hash: g.lastExitHash, expectedHash: r.end.hash,
    };
    this.result.exact = this.result.frameMatch && this.result.hashMatch && this.result.hitsMatch;
  }
  frame(realDt) {               // called by the Loop instead of game.update
    if (!this.playing || this.done) return;

    let n = 0;
    while (this.acc >= CONFIG.SIM_DT && n < 64) { this.stepOne(); this.acc -= CONFIG.SIM_DT; n++; }
  }
  // ---- on-screen controls (world coords) ----
  _buttons() {

    const B = (id, label, x, w) => ({ id, label, x, y: 652, w, h: 46 });
    this._btns = [B('restart', '⟲ RESTART', 40, 124), B('play', '', 172, 84),
      B('s0.25', '¼×', 264, 54), B('s0.5', '½×', 322, 54), B('s1', '1×', 380, 54), B('s2', '2×', 438, 54), B('s4', '4×', 496, 54),
      B('step', 'STEP ▸', 558, 104), B('end', 'JUMP TO END', 670, 150), B('export', 'EXPORT', 828, 116), B('exit', 'EXIT', 952, 96)];
    return this._btns;
  }
  ui(type, p) {

    if (type === 'down' && !p) { this.playing = !this.playing && !this.done; return; }
    if (type !== 'down' || !p) return;
    const end = this.rec.end.frame;
    if (p.y >= 612 && p.y <= 640 && p.x >= 40 && p.x <= 1240) {          // timeline scrub
      const f = Math.round((p.x - 40) / 1200 * end), was = this.playing;
      this.seek(clamp(f, 0, end)); this.playing = was && !this.done; return;
    }
    for (const b of this._buttons()) {
      if (p.x < b.x || p.x > b.x + b.w || p.y < b.y || p.y > b.y + b.h) continue;
      Snd.play('ui');
      if (b.id === 'restart') { this.restart(); this.playing = true; }
      else if (b.id === 'play') { if (this.done) { this.restart(); } this.playing = !this.playing || this.done; }
      else if (b.id[0] === 's' && b.id !== 'step') this.speed = parseFloat(b.id.slice(1));
      else if (b.id === 'step') { this.playing = false; this.stepOne(); }
      else if (b.id === 'end') { this.seek(Math.max(0, end - 180)); this.speed = 0.25; this.playing = !this.done; }

    ctx.save();

    // timeline: inputs (cyan), hits (pink), playhead (white)
    ctx.fillStyle = 'rgba(77,232,255,0.15)'; ctx.fillRect(40, 622, 1200, 8);
    ctx.fillStyle = 'rgba(77,232,255,0.55)';
    for (const i of r.inputs) if (i[1] === 'down') ctx.fillRect(40 + i[0] / end * 1200, 619, 1, 14);
    ctx.fillStyle = CONFIG.ACCENT;

      ctx.fillStyle = on ? 'rgba(77,232,255,0.15)' : 'rgba(77,232,255,0.04)';
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#eaffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 16px ${F}`;
      ctx.fillText(b.id === 'play' ? (this.playing ? '❚❚' : '▶') : b.label, b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = CONFIG.NEON_DIM; ctx.font = `600 14px ${F}`;
    ctx.fillText(`frame ${this.k} / ${end}`, 1240, 676);
    ctx.textAlign = 'center'; ctx.fillStyle = CONFIG.WARN; ctx.font = `700 15px ${F}`;
    ctx.fillText(`● REPLAY  ·  SECTOR ${r.sector}  ·  ${r.end.reason.toUpperCase()}  ·  build ${r.build}`, CONFIG.WORLD_W / 2, 78);
    if (this.result) {
      const ok = this.result.exact;
      ctx.fillStyle = ok ? 'rgba(10,40,24,0.92)' : 'rgba(60,8,20,0.92)';
      ctx.strokeStyle = ok ? '#5dff9a' : '#ff5d7a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(290, 250, 700, 120, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ok ? '#b8ffd2' : '#ffc2cf'; ctx.font = `800 26px ${F}`;
      ctx.fillText(ok ? '✓ REPRODUCED EXACTLY' : '✗ DIVERGED FROM THE RECORDING', CONFIG.WORLD_W / 2, 292);
      ctx.font = `400 16px ${F}`; ctx.fillStyle = '#d8e8ee';
      const R = this.result;
      ctx.fillText(`frames ${R.frames}/${R.expectedFrames} · state hash ${R.hash} ${R.hashMatch ? '=' : '≠'} ${R.expectedHash} · ` +
                   `${(r.hits || []).length} hit(s) ${R.hitsMatch ? 'on identical frames' : 'on DIFFERENT frames'}`, CONFIG.WORLD_W / 2, 330);
    }
    ctx.restore();
  }
  exit() {
    const g = this.game;
    g.replaying = false; g.replay = null; g.driver = null;
    g.run = this.snapshot;
    g.sm.to(DEBUG || REPLAY_MODE ? 'replays' : 'menu');
  }
}

// ---------- LAB: evidence tools (solver, reaction windows, economy) ----------

  MIN_FLIP_FRAMES: 8,                               // >=133 ms between flips: human tap rate
  PR: CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR,       // the radius playing.update passes to collide()
  HUMAN_FLOOR_MS: 250,
  runLength(n, cfg) {
    return n === CONFIG.TOTAL_LEVELS ? Math.round(cfg.quota * 0.4)
         : isBossLevel(n) ? Math.round(cfg.quota * 0.45) : cfg.quota;
  },
  stubGame() {
    return { player: { x: CONFIG.PLAYER_X, y: (CONFIG.RAIL_CEIL_Y + CONFIG.RAIL_FLOOR_Y) / 2 },
             particles: { burst() {}, spawn() {} }, run: { upgrades: { magnet: 0 } }, shake() {}, time: 0 };
  },
  // Step the REAL ObstacleField once. Per sim frame, record what can occupy the
  // player's column: static hazards as forbidden y-intervals (exact collide() geometry);
  // divers and tracers (they react to the player) as tracks/events for the search.
  timeline(n, seed) {
    const cfg = { ...LevelConfig(n), seed }, g = this.stubGame(), F = new ObstacleField(g, cfg);
    const px = CONFIG.PLAYER_X, pr = this.PR, f = CONFIG.HITBOX_FACTOR, dt = this.DT;
    const len = this.runLength(n, cfg), frames = [], hz = new Map(), pulses = [], fires = [];
    let dist = 0, fi = 0, lastPulse = 'idle';
    while (dist < len) {
      const was = F.ebullets.map(b => b.alive);
      F.update(dt, cfg.speed);
      dist += cfg.speed * dt;
      const fr = { iv: [], dv: null, fire: null, pulse: F.pulse.state === 'live' ? F.pulse.side : 0 };
      if (F.pulse.state !== lastPulse) {
        if (F.pulse.state === 'warn') pulses.push({ warnF: fi, side: F.pulse.side, liveF: null });
        if (F.pulse.state === 'live' && pulses.length) pulses[pulses.length - 1].liveF = fi;
        lastPulse = F.pulse.state;
      }
      for (const o of F.pool) {
        if (!o.alive || o.type === 'dust') continue;
        let h = hz.get(o.uid);
        if (!h) { h = { type: o.type, kind: o.kind || null, side: o.side || 0, spawnF: fi, visibleF: null, impactF: null, y: Math.round(o.y) }; hz.set(o.uid, h); }
        if (h.visibleF === null && o.seenAt !== undefined) h.visibleF = fi;
        if (o.type === 'drone' && o.kind === 'diver') {
          if (o.x > px - 40) (fr.dv || (fr.dv = [])).push(o.uid, o.x, h.y0 === undefined ? (h.y0 = o.baseY) : h.y0);
          if (h.impactF === null && Math.abs(o.x - px) < (pr + o.r) * f) h.impactF = fi;
          continue;
        }
        let lo = 0, hi = 0, hit = false;
        if (o.type === 'mine' || o.type === 'drone') {
          const rr = (pr + o.r) * f, dx = px - o.x;
          if (Math.abs(dx) < rr) { const e = Math.sqrt(rr * rr - dx * dx); lo = o.y - e; hi = o.y + e; hit = true; }
        } else {
          const hw = Math.max(1, o.w / 2 - CONFIG.HIT_INSET), hh = Math.max(1, o.h / 2 - CONFIG.HIT_INSET), rr = pr * f, dxn = Math.max(0, Math.abs(px - o.x) - hw);
          if (dxn < rr) { const e = Math.sqrt(rr * rr - dxn * dxn); lo = o.y - hh - e; hi = o.y + hh + e; hit = true; }
        }
        if (hit) { fr.iv.push(lo, hi); if (h.impactF === null) h.impactF = fi; }
      }
      F.ebullets.forEach((b, i) => {
        if (b.alive && !was[i]) {
          const ox = b.x - b.vx * dt, oy = b.y - b.vy * dt;
          (fr.fire || (fr.fire = [])).push(ox, oy);
          const tellF = b.tellAt !== undefined ? Math.round(b.tellAt / dt) - 1 : null;
          // fastest possible arrival (shot straight down the corridor): the worst case
          const arriveF = fi + Math.ceil((ox - px - (pr * f + 4)) / CONFIG.ENEMY_BULLET_SPEED / dt);
          fires.push({ fireF: fi, tellF, arriveF, ox: Math.round(ox) });
        }
      });
      frames.push(fr); fi++;
    }
    return { n, seed, cfg, frames, hazards: [...hz.values()], pulses, fires, len };
  },
  // Search flip timings for a run that takes ZERO hits (no shields, no shooting).
  // Beam search over exact ship physics; branches merge when their state (incl. any
  // diver/tracer that reacts to them) quantizes to the same key. Merging only prunes,
  // so a found route is real (and the harness replays it through the real game).
  solve(T, K = 48) {
    const dt = this.DT, G = CONFIG.GRAVITY, MAXF = CONFIG.MAX_FALL, MINF = this.MIN_FLIP_FRAMES;
    const floorY = CONFIG.RAIL_FLOOR_Y - CONFIG.PLAYER_R, ceilY = CONFIG.RAIL_CEIL_Y + CONFIG.PLAYER_R;
    const px = CONFIG.PLAYER_X, pr = this.PR, f = CONFIG.HITBOX_FACTOR;
    const dR = (pr + 14) * f, bR = pr * f + 4, restF = CONFIG.RAIL_FLOOR_Y - pr, restC = CONFIG.RAIL_CEIL_Y + pr, pW = pr * 0.6;
    const BS = CONFIG.ENEMY_BULLET_SPEED, DMIN = CONFIG.RAIL_CEIL_Y + 30, DMAX = CONFIG.RAIL_FLOOR_Y - 30;
    let cur = [{ y: floorY, vy: 0, dir: 1, g: 1, cd: 0, dv: [], bt: [], base: 0 }];
    const par = [], flp = [];
    const nF = T.frames.length;
    for (let fi = 0; fi < nF; fi++) {
      const fr = T.frames[fi], next = new Map(), iv = fr.iv;
      for (let ni = 0; ni < cur.length; ni++) {
        const nd = cur[ni];
        for (let a = 0; a < 2; a++) {
          if (a === 1 && nd.cd > 0) continue;
          let y = nd.y, vy = nd.vy, dir = nd.dir, gr = nd.g, cd = nd.cd > 0 ? nd.cd - 1 : 0;
          if (a === 1) { dir = -dir; gr = 0; cd = MINF - 1; }
          if (!gr) {
            vy += G * dir * dt; vy = vy < -MAXF ? -MAXF : vy > MAXF ? MAXF : vy; y += vy * dt;
            if (y >= floorY) { y = floorY; if (dir > 0) { vy = 0; gr = 1; } else if (vy > 0) vy = 0; }
            else if (y <= ceilY) { y = ceilY; if (dir < 0) { vy = 0; gr = 1; } else if (vy < 0) vy = 0; }
          }
          let dead = false;
          for (let j = 0; j < iv.length; j += 2) if (y > iv[j] && y < iv[j + 1]) { dead = true; break; }
          if (dead) continue;
          if (fr.pulse && Math.abs(y - (fr.pulse > 0 ? restF : restC)) < pW) continue;
          // divers home on THIS branch's position
          let dv = nd.dv, h = 0;
          if (fr.dv) {
            const out = [];
            for (let j = 0; j < fr.dv.length; j += 3) {
              const uid = fr.dv[j], x = fr.dv[j + 1];
              let dy = fr.dv[j + 2];
              for (let q = 0; q < dv.length; q += 2) if (dv[q] === uid) { dy = dv[q + 1]; break; }
              let s = (y - dy) * 2.2; s = s < -160 ? -160 : s > 160 ? 160 : s;
              dy += s * dt; dy = dy < DMIN ? DMIN : dy > DMAX ? DMAX : dy;
              const ddx = px - x, ddy = y - dy;
              if (ddx * ddx + ddy * ddy < dR * dR) { dead = true; break; }
              if (x > px - dR - 2) { out.push(uid, dy); h = (h * 131 + uid * 7 + Math.round(dy / 4)) % 67108859; }
            }
            if (dead) continue;
            dv = out;
          } else if (dv.length) dv = [];
          // tracers are aimed at THIS branch's position when fired
          let bt = nd.bt;
          if (fr.fire || bt.length) {
            const out = [];
            const all = fr.fire ? bt.concat(this._newShots(fr.fire, px, y, BS, fi)) : bt;
            for (let j = 0; j < all.length; j += 5) {
              const ox = all[j], oy = all[j + 1], vx = all[j + 2], vyb = all[j + 3], bf = all[j + 4];
              const age = fi - bf + 1, bx = ox + vx * dt * age, by = oy + vyb * dt * age;
              const ddx = px - bx, ddy = y - by;
              if (ddx * ddx + ddy * ddy < bR * bR) { dead = true; break; }
              if (bx > px - bR - 2) { out.push(ox, oy, vx, vyb, bf); h = (h * 131 + Math.round(vyb)) % 67108859; }
            }
            if (dead) continue;
            bt = out;
          }
          const base = ((Math.round(y * 2) * 181 + (Math.round(vy / 20) + 90)) * 4 + (dir > 0 ? 2 : 0) + gr) * 9 + cd;
          const key = base + h * 16777216;
          if (!next.has(key)) next.set(key, { y, vy, dir, g: gr, cd, dv, bt, base, p: ni, fl: a });
        }
      }
      if (!next.size) return { ok: false, failF: fi, frames: nF };
      let arr = [...next.values()];
      if (arr.length > K) {
        arr.sort((p, q) => p.base - q.base);
        const step = arr.length / K, pick = [];
        for (let i = 0; i < K; i++) pick.push(arr[Math.floor(i * step)]);
        arr = pick;
      }
      const P = new Int32Array(arr.length), Fl = new Uint8Array(arr.length);
      for (let i = 0; i < arr.length; i++) { P[i] = arr[i].p; Fl[i] = arr[i].fl; }
      par.push(P); flp.push(Fl); cur = arr;
    }
    const flips = [];
    let idx = 0;
    for (let fi = nF - 1; fi >= 0; fi--) { if (flp[fi][idx]) flips.push(fi); idx = par[fi][idx]; }
    return { ok: true, flips: flips.reverse(), frames: nF };
  },
  _newShots(fire, px, y, BS, fi) {
    const out = [];
    for (let j = 0; j < fire.length; j += 2) {
      const ox = fire[j], oy = fire[j + 1], a = Math.atan2(y - oy, px - ox);
      out.push(ox, oy, Math.cos(a) * BS, Math.sin(a) * BS, fi);
    }
    return out;
  },
  // adaptive beam: cheap first, widen before declaring a pattern impossible
  check(n, seed) {
    const T = this.timeline(n, seed);
    let r = this.solve(T, 64), K = 64;
    if (!r.ok) { K = 400; r = this.solve(T, K); }
    if (!r.ok) { K = 4000; r = this.solve(T, K); }
    r.K = K; r.n = n; r.seed = seed;
    if (!r.ok) r.why = this.diagnose(T, r.failF);
    return { r, T };
  },
  // what was on the column around the frame the search ran out of options
  diagnose(T, failF) {
    const near = T.hazards.filter(h => h.impactF !== null && h.impactF >= failF - 50 && h.impactF <= failF + 4)
      .map(h => `${h.type}${h.kind ? ':' + h.kind : ''}${h.side ? (h.side > 0 ? '@floor' : '@ceil') : ''}`);
    const pl = T.pulses.find(p => p.liveF !== null && p.liveF <= failF && failF <= p.liveF + Math.round(CONFIG.PULSE_ACTIVE_S * 60));
    if (pl) near.push('rail-live@' + (pl.side > 0 ? 'floor' : 'ceil'));
    return { failF, hazards: near };
  },
  // Fly the solver's route through the REAL game (sandboxed: no save writes) and record it
  // as an ordinary replay, so anyone can watch it in the replay viewer.
  routeToReplay(game, n, seed) {
    const { r } = this.check(n, seed);
    if (!r.ok) return { ok: false, why: r.why };
    const snap = JSON.parse(JSON.stringify(game.run)), dt = this.DT;
    game.replaying = true; game.replay = { fieldSeed: seed, bossSeed: 1 }; game.replayHits = [];
    game.sm.to('playing', { level: n });
    const inputs = []; let fi = 0, guard = 0;
    const done = () => game.sm.current.name !== 'playing' || (game.boss && game.boss.state !== 'approach');
    while (!done() && guard++ < 30000) {
      if (fi < r.flips.length && r.flips[fi] === Math.round(game.field.simT / dt)) { inputs.push([game.simFrame, 'down', null, null, null]); game.sm.input('down', null); fi++; }
      game.update(dt);
    }
    if (game.sm.current.name === 'playing') { inputs.push([game.simFrame, 'esc', null, null, null]); game.sm.input('esc', null);
      inputs.push([game.simFrame, 'down', 640, 491, null]); game.sm.input('down', { x: 640, y: 491, id: null }); }  // pause -> MAIN MENU
    const rec = { v: 1, game: 'void-horizon', id: 'solver-s' + n + '-' + seed, build: BUILD, date: new Date().toISOString(),
                  sector: n, fieldSeed: seed, bossSeed: 1, upgrades: { ...snap.upgrades }, equipped: snap.equipped,
                  inputs, hits: game.replayHits, end: { frame: game.simFrame, hash: game.lastExitHash, dist: 0, quota: 1, reason: 'solver route' }, solver: true };
    game.replaying = false; game.replay = null; game.run = snap;
    return { ok: true, rec, realHits: rec.hits.length };
  },
  // seconds from "you can see it" (or its telegraph) to "it reaches your column"
  reaction(T) {
    const dt = this.DT, rows = [];
    for (const h of T.hazards) {
      if (h.visibleF === null || h.impactF === null) continue;
      rows.push({ cls: h.type === 'drone' ? 'drone:' + h.kind : h.type, ms: (h.impactF - h.visibleF) * dt * 1000, telegraphed: false });
    }
    for (const p of T.pulses) if (p.liveF !== null) rows.push({ cls: 'rail-pulse', ms: (p.liveF - p.warnF) * dt * 1000, telegraphed: true });
    for (const s of T.fires) {
      rows.push({ cls: 'tracer (from shot)', ms: (s.arriveF - s.fireF) * dt * 1000, telegraphed: false, tellMs: s.tellF !== null ? (s.arriveF - s.tellF) * dt * 1000 : null, fire: s });
    }
    return rows;
  },
};

// ---------- Game ----------
class Game {
  constructor(canvasEl) {
    this.gc = new GameCanvas(canvasEl);
    this.sm = new StateMachine(this);
    this.starfield = new Starfield();
    this.particles = new ParticleSystem(500);
    this.time = 0;
    this.scrollMult = 1;
    this.shakeTrauma = 0;
    this.hitstop = 0;
    this.gravityDistort = 1;    // Phase 6 Entity field: 1 = normal, <0 = wrong-way pull
    // persistent run progress (localStorage) + per-run scratch
    this.run = this._loadProgress();
    applyAccess(this.run.access);
    // Phase 8: apply saved audio prefs (context itself waits for a gesture)
    Snd.sfxVol = this.run.audio.sfx; Snd.musVol = this.run.audio.mus; Snd.muted = this.run.audio.muted;
    this.summary = null;
    this.deathTimer = 0;
    this.boss = null;
    this.timeScale = 1;
    this._bindInput(canvasEl);
    this._registerStates();
    // debug/test harnesses skip the tap-to-engage boot screen
    this.sm.to(REPLAY_MODE ? 'replays' : (DEBUG || BENCH) ? 'menu' : 'boot');
    if (BENCH) this.startBench();
  }
  _loadProgress() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem('void-horizon-save') || '{}'); } catch (e) {}
    return {
      unlocked: clamp(p.unlocked || 1, 1, CONFIG.TOTAL_LEVELS),
      dustTotal: p.dustTotal || 0,
      lore: Array.isArray(p.lore) ? p.lore : [],   // boss keys killed (Phase 7 LORE screen)
      // Phase 7 upgrades: photon starts owned at T2 (the Sector-3 unlock promise);
      // everything else starts at 0. Corrupt/partial saves fall back to defaults.
      upgrades: (() => {
      const d = { photon: 2, pulse: 0, void: 0, magnet: 0, hull: 0, charge: 0, graviton: 0 };
      const src = (p.upgrades && typeof p.upgrades === 'object') ? p.upgrades : {};
      for (const k of Object.keys(d))
        d[k] = clamp(Math.floor(src[k] === undefined ? d[k] : src[k]), 0, UPGRADES[k].max);
      // migration: any weapon stuck at T1 (old shop sold it — no autofire/charge,
      // "gun stopped working" bug) is raised to T2 for free
      for (const k of Object.keys(d))
        if (UPGRADES[k].weapon && d[k] === 1) d[k] = 2;
      return d;
      })(),
      equipped: (UPGRADES[p.equipped] && UPGRADES[p.equipped].weapon && p.equipped) || 'photon',
      // Phase 8: audio prefs (volumes + mute persist with the save)
      access: (() => {
        const a = (p.access && typeof p.access === 'object') ? p.access : {};
        return { flash: !!a.flash, motion: !!a.motion, palette: a.palette === 'colorblind' ? 'colorblind' : 'default' };
      })(),
      audio: (() => {
        const a = (p.audio && typeof p.audio === 'object') ? p.audio : {};
        return { sfx: clamp(a.sfx === undefined ? 0.8 : a.sfx, 0, 1),
                 mus: clamp(a.mus === undefined ? 0.6 : a.mus, 0, 1),
                 muted: !!a.muted };
      })(),
      level: 1, dist: 0, dust: 0,   // per-run scratch
    };
  }
  // Dust banks the INSTANT it's earned: dying, quitting or closing the tab never
  // loses any — the only way dust leaves the inventory is spending it in UPGRADES.
  // run.dust still counts this run's haul for the end-of-run screens.
  addDust(n) {
    this.run.dust += n;
    this.run.dustTotal = (this.run.dustTotal || 0) + n;
    const now = performance.now();
    if (!(now - (this._lastSave || 0) < 1500)) { this._lastSave = now; this.saveProgress(); }
    else this._saveDirty = true;
  }
  saveProgress() {
    this._saveDirty = false;
    if (this.replaying) return;           // replays are sandboxed
    try {
      localStorage.setItem('void-horizon-save', JSON.stringify({
        unlocked: this.run.unlocked, dustTotal: this.run.dustTotal, lore: this.run.lore,
        upgrades: this.run.upgrades, equipped: this.run.equipped, audio: this.run.audio, access: this.run.access,
      }));
    } catch (e) {} // private-mode etc. — game still plays, just no persistence
  }
  shake(amount) { this.shakeTrauma = Math.min(1, this.shakeTrauma + amount * (ACCESS.motion ? 0.15 : 1)); }
  // every input passes through here: coords are rounded so the recording and the
  // live run see byte-identical values, then recorded (during a run) or routed to
  // the replay controls (during playback)
  input(type, p) {
    if (this.bench) {
      if (this.bench.phase === 'done' && type === 'down') {
        const r = { ...this.bench.result, ua: navigator.userAgent, dpr: devicePixelRatio, w: innerWidth, h: innerHeight, build: BUILD };
        shareText(JSON.stringify(r, null, 1), 'void-horizon-bench.json').then(h => this.toastMsg(h === 'copied' ? 'Benchmark copied' : 'Benchmark saved'));
      }
      return;                                    // the autopilot owns the controls
    }
    if (p) p = { x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100, id: p.id === undefined ? null : p.id };
    if (this.driver) { this.driver.ui(type, p); return; }
    const rec = this.rec;
    if (rec && type !== 'move' && this.sm.current && this.sm.current.name === 'playing')
      rec.inputs.push([this.simFrame, type, p ? p.x : null, p ? p.y : null, p ? p.id : null]);
    this.sm.input(type, p);
  }
  startReplay(rec) { this.driver = new ReplayDriver(this, rec); }
  // ?bench: the heaviest scene in the game — Entity fight, Graviton T4 beam, bullets, particles —
  // driven by a fixed autopilot so every device runs the same 20 s. Results stay on screen.
  startBench() {
    this.run = JSON.parse(JSON.stringify(this.run));          // never touches the real save
    this.replaying = true; this.replay = { fieldSeed: LevelConfig(50).seed, bossSeed: 7 }; this.replayHits = [];
    Object.assign(this.run.upgrades, { graviton: 4, hull: 4, charge: 4 }); this.run.equipped = 'graviton';
    this.sm.to('playing', { level: 50 });
    this.player.shields = 999;
    this.run.dist = this.boss.quota;
    this.bench = { phase: 'warmup', t: 0 };
  }
  _benchTick(dt) {
    const B = this.bench, f = this.simFrame || 0;
    if (this.player) this.player.shields = 999;
    if (this.sm.current.name === 'playing') {
      if (f % 54 === 0) this.sm.input('down', null);                    // flip
      if (f % 150 === 0) this.sm.input('fire', null);                   // hold to charge...
      if (f % 150 === 70) this.sm.input('fireup', null);                // ...release: graviton beam
    }
    if (B.phase === 'warmup' && this.boss && this.boss.state === 'fight') { B.phase = 'warm2'; B.t = 0; }
    else if (B.phase === 'warm2') { B.t += dt; if (B.t > 1) { B.phase = 'measure'; B.t = 0; loop.perf = null; } }
    else if (B.phase === 'measure') { B.t += dt; if (B.t >= 20) { B.phase = 'done'; B.result = loop.perfStats(); } }
  }
  toastMsg(text) { this.toast = { text, t: 2.2 }; }

  _bindInput(canvasEl) {
    const emit = (type, ev) => {
      if (ev && ev.preventDefault) ev.preventDefault();
      let p = null;
      if (ev && 'clientX' in ev) {
        p = this.gc.toWorld(ev.clientX, ev.clientY);
        p.id = ev.pointerId;   // multi-touch: states can tell fingers apart
      }
      this.input(type, p);
    };
    // fullscreen toggle swallows taps in its corner before any state sees them
    // (iOS/Android require a user-gesture tap to enter fullscreen)
    const inFsBtn = (p) => {
      if (!p) return false;
      const b = CONFIG.FS_BTN;
      return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 10) ** 2;
    };
    const rawEmit = emit;
    const emit2 = (type, ev) => {
      if (ev && 'clientX' in ev) {
        const p = this.gc.toWorld(ev.clientX, ev.clientY);
        if (type === 'down' && inFsBtn(p)) { this.toggleFullscreen(); return; }
      }
      rawEmit(type, ev);
    };
    canvasEl.addEventListener('pointerdown', (e) => { Snd.unlock(); emit2('down', e); }, { passive: false });
    canvasEl.addEventListener('pointerup',   (e) => emit('up', e),   { passive: false });
    // the OS can steal a touch (edge swipe, notification): treat it as a release so
    // the FIRE finger can't get stuck down with charge + autofire running forever
    canvasEl.addEventListener('pointercancel', (e) => emit('up', e), { passive: false });
    canvasEl.addEventListener('pointermove', (e) => emit('move', e), { passive: false });
    window.addEventListener('keydown', (ev) => {
      Snd.unlock();   // keyboard counts as the Chrome autoplay gesture too
      if ((ev.code === 'Space' || ev.code === 'Enter') && !ev.repeat) { ev.preventDefault(); this.input('down', null); }
      else if ((ev.code === 'KeyF' || ev.code === 'KeyJ' || ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') && !ev.repeat) {
        ev.preventDefault(); this.input('fire', null);
      }
      else if ((ev.code === 'Escape' || ev.code === 'KeyP') && !ev.repeat) { ev.preventDefault(); this.input('esc', null); }
      else if (ev.code === 'ArrowRight') { ev.preventDefault(); this.input('step', null); }
    });
    // switching apps / locking the phone / changing tabs auto-pauses a run
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.input('blur', null);
    });
    window.addEventListener('keyup', (ev) => {
      if (ev.code === 'Space' || ev.code === 'Enter') { ev.preventDefault(); this.input('up', null); }
      else if (ev.code === 'KeyF' || ev.code === 'KeyJ' || ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') {
        ev.preventDefault(); this.input('fireup', null);
      }
    });
  }

  _registerStates() {
    // ----- MENU -----
    // Phase 8: volume sliders (bottom-left of menu; drag = set, release = save)
    const AUDIO_UI = {
      sfx:  { x: 70, y: 616, w: 170 },
      mus:  { x: 70, y: 656, w: 170 },
      mute: { x: 70, y: 692, w: 170, h: 26 },
      drag: null,   // 'sfx' | 'mus' | null
    };
    function audioHit(p, s) {
      return p.x >= s.x - 12 && p.x <= s.x + s.w + 12 &&
             p.y >= s.y - 14 && p.y <= s.y + 14;
    }
    function audioSet(kind, p, game) {
      const s = AUDIO_UI[kind];
      const v = clamp((p.x - s.x) / s.w, 0, 1);
      if (kind === 'sfx') {
        game.run.audio.sfx = v; Snd.setVolumes(v, game.run.audio.mus);
        if (!Snd.ac) Snd.unlock();       // dragging a slider counts as the gesture
      } else {
        game.run.audio.mus = v; Snd.setVolumes(game.run.audio.sfx, v);
        if (!Snd.ac) Snd.unlock();
      }
    }
    // ----- BOOT ("tap to engage") -----
    // Browsers block audio until a user gesture, so the cinematic intro waits
    // for one tap: that tap unlocks Web Audio, fires the riser, and starts the
    // menu's dissolve-in with the soundtrack in sync.
    const boot = {
      go: false,
      onEnter(game) { game.buttons = []; boot.go = false; Snd.setMusicMode('off'); },
      input(game, type) {
        if (boot.go || (type !== 'down' && type !== 'fire')) return;
        boot.go = true;
        Snd.unlock();
        Snd.play('riser');
        game.sm.to('menu', { intro: true });
      },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.save();
        ctx.fillStyle = '#000';                     // pure black: the dissolve starts from here
        ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
        ctx.textAlign = 'center';
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 3);
        ctx.fillStyle = CONFIG.NEON;
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 16;
        ctx.font = '600 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('▸  TAP TO ENGAGE  ◂', CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
        ctx.globalAlpha = 0.4; ctx.shadowBlur = 0;
        ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('sound on  ·  headphones recommended', CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 + 40);
        ctx.restore();
      },
    };

    // ----- MENU -----
    // Intro timeline (first launch only, after the boot tap):
    //   0.0–1.4s  black screen dissolves cell-by-cell from the centre (cyan burn edge)
    //   0.55s+    title letters materialise one by one (rise + glow flare)
    //   1.9s      IMPACT: black hole snaps in, flash + shockwave + particles,
    //             soundtrack drops from the pad swell into the full menu theme
    //   2.0–3.0s  subtitle, buttons, audio controls fade/slide in
    // Coming back to the menu later is just a quick 0.35s fade.
    const INTRO_LEN = 3.0, INTRO_IMPACT = 1.9;
    const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);              // ease-out cubic
    const easeBack = (x) => { x = clamp(x, 0, 1); const c = 1.7;          // overshoot pop
      return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    const DISSOLVE = (() => { const r = mulberry32(4242), a = [];          // fixed noise mask
      for (let i = 0; i < 40 * 23; i++) a.push(r()); return a; })();
    const menu = {
      onEnter(game, payload) {
        const full = !!(payload && payload.intro);
        game.menuIntro = { t: full ? 0 : INTRO_LEN, full, impact: !full,
                           fade: full ? 0 : 0.35, flash: 0, ringT: 9, holeX: 0 };
        Snd.setMusicMode(full ? 'intro' : 'calm');
        const start = game.run.unlocked;
        game.buttons = [
          new Button(start > 1 ? `PLAY — SECTOR ${start}` : 'PLAY', 490, 360, 300, 62,
            () => game.sm.to('playing', { level: start })),
          new Button('UPGRADES', 490, 440, 300, 62, () => game.sm.to('upgrades')),
          new Button('LORE', 490, 520, 300, 62, () => game.sm.to('lore')),
          new Button('SETTINGS', 490, 600, 300, 54, () => game.sm.to('settings')),
        ];
      },
      _impact(game) {
        const I = game.menuIntro;
        I.impact = true; I.flash = 1; I.ringT = 0;
        Snd.play('impact');
        Snd.setMusicMode('calm');                     // the drop: full menu theme kicks in
        game.shake(0.7);
        const hx = I.holeX || CONFIG.WORLD_W / 2;
        game.particles.burst(hx, 232, 60, '#ffc85a', 720, 1.0, 3.5);
        game.particles.burst(hx, 232, 30, CONFIG.ACCENT, 520, 0.9, 3);
      },
      input(game, type, p) {
        const I = game.menuIntro;
        if (I && I.t < INTRO_LEN) {                   // intro playing: a tap skips to the end
          if (type === 'down') { I.t = INTRO_LEN; if (!I.impact) menu._impact(game); }
          return;
        }
        if (type === 'move' && p && AUDIO_UI.drag) { audioSet(AUDIO_UI.drag, p, game); return; }
        if (type === 'move') {
          for (const b of game.buttons) b.hover = b.contains(p);
        } else if (type === 'down' && p) {
          if (audioHit(p, AUDIO_UI.sfx)) { AUDIO_UI.drag = 'sfx'; audioSet('sfx', p, game); return; }
          if (audioHit(p, AUDIO_UI.mus)) { AUDIO_UI.drag = 'mus'; audioSet('mus', p, game); return; }
          if (p.x >= AUDIO_UI.mute.x - 12 && p.x <= AUDIO_UI.mute.x + AUDIO_UI.mute.w + 12 &&
              p.y >= AUDIO_UI.mute.y - 14 && p.y <= AUDIO_UI.mute.y + AUDIO_UI.mute.h) {
            game.run.audio.muted = Snd.toggleMute(); game.saveProgress(); return;
          }
          for (const b of game.buttons) {
            if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          }
        } else if (type === 'up' && !p) {
          if (AUDIO_UI.drag) { AUDIO_UI.drag = null; game.saveProgress(); return; }
          game.sm.to('playing', { level: game.run.unlocked }); // keyboard Enter/Space starts
        } else if (type === 'up' && p && AUDIO_UI.drag) {
          AUDIO_UI.drag = null; game.saveProgress(); return;
        } else if (type === 'esc') {
          game.sm.to('menu'); // harmless
        }
      },
      update(game, dt) {
        const I = game.menuIntro;
        if (I.t < INTRO_LEN) I.t += dt;
        if (!I.impact && I.t >= INTRO_IMPACT) menu._impact(game);
        I.fade = Math.max(0, I.fade - dt);
        I.flash = Math.max(0, I.flash - dt * 2.5);
        I.ringT += dt;
        for (const b of game.buttons) b.update(dt);
      },
      render(game, rc) {
        const ctx = rc, t = game.time, I = game.menuIntro;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 84px "Segoe UI", system-ui, sans-serif';
        // draw the title letter-by-letter, swapping the O in VOID for a live black hole.
        // Accretion band half-width is r*1.32 = 0.73 letter-widths, so 1.8x
        // advance keeps clearance per side without a visual chasm.
        const title = 'VOID HORIZON';
        const tw = ctx.measureText(title).width + ctx.measureText('O').width * 0.8;
        let lx = CONFIG.WORLD_W / 2 - tw / 2;
        ctx.textAlign = 'left';              // per-glyph advance needs LEFT
        let holeDone = false, idx = 0;
        for (const ch of title) {
          const cw = ctx.measureText(ch).width;
          const start = 0.55 + idx * 0.07;   // staggered materialise
          idx++;
          if (ch === 'O' && !holeDone) {
            holeDone = true;
            const hx = lx + cw * 0.9;
            I.holeX = hx;
            // the hole snaps in with an overshoot right on the impact beat
            const hr = cw * 0.55 * (I.impact ? 1 : easeBack((I.t - (INTRO_IMPACT - 0.25)) / 0.25));
            // clipped to the reserved O slot so the glow can't wash out D and I
            if (hr > 0.5) drawTitleBlackHole(ctx, hx, 260 - 28, hr, t, cw * 0.9);
            lx += cw * 1.8;
          } else {
            const a = ease((I.t - start) / 0.5);
            if (a > 0) {
              ctx.save();
              ctx.globalAlpha = a;
              ctx.shadowColor = CONFIG.NEON;
              ctx.shadowBlur = 24 + 10 * Math.sin(t * 1.5) + (1 - a) * 50;   // flares as it forms
              ctx.fillText(ch, lx, 260 + (1 - a) * 28);
              ctx.restore();
            }
            lx += cw;
          }
        }
        ctx.textAlign = 'center';
        ctx.globalAlpha = ease((I.t - 1.95) / 0.5);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('DUAL-GRAVITY PROTOCOL // SECTOR WAR', CONFIG.WORLD_W / 2, 315);
        ctx.restore();

        // impact shockwave ring + particles
        if (I.ringT < 0.7) {
          ctx.save();
          ctx.globalAlpha = 1 - I.ringT / 0.7;
          ctx.strokeStyle = '#ffc85a'; ctx.shadowColor = '#ffc85a'; ctx.shadowBlur = 20;
          ctx.lineWidth = 6 * (1 - I.ringT / 0.7) + 1;
          ctx.beginPath(); ctx.arc(I.holeX, 232, 40 + ease(I.ringT / 0.7) * 700, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
        game.particles.render(ctx);

        // buttons slide up + fade in, staggered
        game.buttons.forEach((b, i) => {
          const a = ease((I.t - 2.1 - i * 0.13) / 0.45);
          if (a <= 0) return;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(0, (1 - a) * 24);
          b.render(ctx, t);
          ctx.restore();
        });

        // Phase 8: SFX / Music sliders + MUTE (bottom-left)
        const a = game.run.audio;
        ctx.save();
        ctx.globalAlpha = ease((I.t - 2.5) / 0.5);
        ctx.textAlign = 'left';
        ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
        for (const [label, s, v] of [['SFX', AUDIO_UI.sfx, a.sfx], ['MUSIC', AUDIO_UI.mus, a.mus]]) {
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.fillText(label, s.x, s.y - 10);
          ctx.strokeStyle = 'rgba(77,232,255,0.45)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.w, s.y); ctx.stroke();
          ctx.fillStyle = a.muted ? 'rgba(77,232,255,0.3)' : CONFIG.NEON;
          ctx.beginPath(); ctx.arc(s.x + s.w * v, s.y, 7, 0, Math.PI * 2); ctx.fill();
        }
        const mu = AUDIO_UI.mute;
        ctx.strokeStyle = a.muted ? CONFIG.WARN : 'rgba(77,232,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(mu.x, mu.y - 9, mu.w, mu.h);
        ctx.fillStyle = a.muted ? CONFIG.WARN : CONFIG.NEON_DIM;
        ctx.fillText(a.muted ? 'AUDIO: MUTED' : 'AUDIO: ON', mu.x + 10, mu.y + 9);
        ctx.restore();

        // DISSOLVE: the black screen breaks apart cell-by-cell (seeded noise mask,
        // centre clears first) with a cyan "burn" on cells about to vanish
        if (I.full && I.t < 1.45) {
          const p = ease(I.t / 1.4), cs = 32;
          ctx.save();
          for (let gy = 0, k = 0; gy < 23; gy++) {
            for (let gx = 0; gx < 40; gx++, k++) {
              const r = DISSOLVE[k] * 0.85 + (Math.abs(gx - 19.5) / 19.5) * 0.15;
              if (r <= p) continue;
              ctx.fillStyle = r - p < 0.05 ? 'rgba(77,232,255,0.55)' : '#000';
              ctx.fillRect(gx * cs, gy * cs, cs + 1, cs + 1);
            }
          }
          ctx.restore();
        }
        // impact flash / quick return fade
        if (I.flash > 0 || I.fade > 0) {
          ctx.save();
          if (I.flash > 0 && !ACCESS.flash) {
            ctx.globalAlpha = I.flash * 0.35; ctx.fillStyle = '#eaffff';
            ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          }
          if (I.fade > 0) {
            ctx.globalAlpha = I.fade / 0.35; ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          }
          ctx.restore();
        }
      },
    };

    // ----- LORE ARCHIVE (real screen: dossier list + reader pane) -----
    // The narrator is the ship's log; ~~struck text~~ renders as real strikethrough
    // (the log editing itself), ██ is just a redaction glyph.
    const LORE_PROLOGUE = {
      key: 'prologue', title: 'PROLOGUE // WHO IS FLYING', faction: '',
      text: "LOG // this ship has no registered pilot. the seat sensors ~~report a heartbeat~~ read ambient. " +
            "the contract that funds this corridor run was issued by an office that ~~closed~~ never existed. " +
            "the cargo hold pays in dust, the dust buys fire, the fire buys the next sector. " +
            "i do not remember enlisting. i do not remember ~~the first nine deaths~~ most of the first nine deaths. " +
            "the corridor is old — older than the factions swarming it — and it slopes downward, " +
            "gently, the way a drain slopes. everything out here is falling. " +
            "i am simply the only one falling ~~on purpose~~ with the guns on.",
    };
    const LORE_EPILOGUE = {
      key: 'entity', title: 'EPILOGUE // IT', faction: 'THE BLACK HOLE',
      lock: g => g.run.lore.includes('entity'),
      text: "LOG // nine fires out. the corridor is quiet in a way it has never been — not silent, " +
            "settled, like a machine that stopped being wound. the hole at the end does not rage anymore. " +
            "it was never a throne and never a god. it was a ~~door~~ a drain, and the factions were " +
            "not its priests, only the silt that gathered where the current slowed. " +
            "i killed nine of its fevers and called it a war. " +
            "the horizon is thin here. the log keeps editing itself faster now, as if ~~we~~ i am running out of pages. " +
            "i am going to fly in and file one last entry, and if this entry ends mid-sentence, " +
            "understand that the sentence is not wh",
    };
    function loreEntries(game) {
      const list = [LORE_PROLOGUE];
      for (const f of LORE_FACTIONS) {
        list.push({ key: 'f_' + f.id, title: f.title, faction: f.faction,
                    text: f.text, lock: f.lock });
      }
      list.push(LORE_EPILOGUE);
      return list;
    }
    // faction dossiers: header prose + the boss entries they dropped
    const LORE_FACTIONS = [
      { id: 'corridor', title: 'THE CORRIDOR', faction: 'THE ARENA', lock: () => true,
        text: "LOG // nobody built the corridor. survey drones agree on one thing: the rails are older " +
              "than every faction that crawls on them. it runs ~50 sectors and every one of them tilts " +
              "a degree more toward the hole. gravity here is not law, it is ~~suggestion~~ drainage. " +
              "the factions did not choose this war. they chose the high ground in a drain." },
      { id: 'vexill', title: 'VEXILL HIVE', faction: 'THE FEEDER', lock: g => g.run.lore.includes('vexill'),
        text: "LOG // the Hive came first and will come last — billions of insectile drones grown around " +
              "a breeding mind, seeded down the corridor like bait. they do not hold territory. they grow " +
              "toward the hole and eat what blocks them. two gardeners fell to us: Krixtha, then Hive-Mother Ossu. " +
              "the garden ~~stopped growing~~ kept growing either way." },
      { id: 'korvaati', title: 'KOR-VAATI LEGION', faction: 'THE BLADE', lock: g => g.run.lore.includes('korvaati'),
        text: "LOG // the Legion fights like it is being graded: aimed volleys, telegraphed sweeps, contempt " +
              "for cover. they believe the corridor is a proving ground and the hole is the honor roll at the " +
              "bottom of it. Vaal Kor-Sun saluted us. Kaalen-Vaa fused captured laser tech into the Legion " +
              "volley — heresy, and effective. the Legion mourned her the way you mourn a blade that cut you." },
      { id: 'nethys', title: 'NETHYS CHOIR', faction: 'THE HYMN', lock: g => g.run.lore.includes('nethys'),
        text: "LOG // the Choir sings in fire. their spiral litanies are precise enough to engrave hull plate, " +
              "and they insist the corridor is a pipe organ — that gravity is the note and every ship that " +
              "falls in is ~~acoustics~~ an offering. the Chorus fell, then Resonant Vael sang her own requiem " +
              "over her sinking core. our recorders still catch the harmonics three sectors out. the cats hate that frequency." },
      { id: 'drathis', title: 'DRATHIS COMPACT', faction: 'THE INVOICE', lock: g => g.run.lore.includes('drathis'),
        text: "LOG // the Compact sell war by the kilogram and have never once fought it personally. " +
              "Bastion DR-9 was a demo unit. Siege Engine TH-0 was their last invoice: a platform that " +
              "paid for itself by never being allowed to lose. they call the corridor a test range " +
              "~~leased by whom~~ and every kill we made was data they were paying to collect. we returned TH-0 to sender, restocked as debris." },
      { id: 'umbral', title: 'UMBRAL COURT', faction: 'THE COURIERS', lock: g => g.run.lore.includes('umbral'),
        text: "LOG // the Court claims to speak for what waits past the dark. the Herald carried every " +
              "faction's fire like samples — all styles, no loyalty. it was not a commander. it was a " +
              "~~priest~~ messenger, and the message was the same one the corridor has been posting for a " +
              "thousand years: everything in the drain arrives at the drain. the Black Hole at the end " +
              "is its destination, not its throne." },
    ];
    function wrapLog(text, max) {
      const words = text.split(' '); const lines = []; let cur = '';
      for (const w of words) {
        if ((cur + ' ' + w).trim().length > max) { lines.push(cur.trim()); cur = w; }
        else cur += ' ' + w;
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }
    const lore = {
      selected: null,
      onEnter(game) {
        lore.selected = LORE_PROLOGUE;
        game.buttons = [ new Button('BACK', 1010, 60, 120, 44, () => game.sm.to('menu')) ];
      },
      input(game, type, p) {
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); return; }
        if (type === 'esc') { game.sm.to('menu'); return; }
        if (type === 'down' && p) {
          for (const b of game.buttons)
            if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          // entry list hits
          const list = loreEntries(game);
          const y0 = 190, rowH = 62;
          if (p.x >= 80 && p.x <= 520) {
            const i = Math.floor((p.y - y0) / rowH);
            if (i >= 0 && i < list.length) {
              const e = list[i];
              if (!e.lock || e.lock(game)) lore.selected = e;
              else game.shake(0.4);
            }
          }
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 14;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 40px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('SHIP\u2019S LOG // ARCHIVE', CONFIG.WORLD_W / 2, 120);
        ctx.restore();
        // left: entry list
        const list = loreEntries(game), y0 = 190, rowH = 62;
        ctx.textAlign = 'left';
        list.forEach((e, i) => {
          const unlocked = !e.lock || e.lock(game);
          const y = y0 + i * rowH;
          const sel = lore.selected === e;
          ctx.save();
          ctx.strokeStyle = sel ? CONFIG.NEON : (unlocked ? CONFIG.NEON_DIM : 'rgba(120,130,150,0.25)');
          ctx.fillStyle = sel ? 'rgba(77,232,255,0.08)' : 'rgba(0,0,0,0.25)';
          ctx.lineWidth = sel ? 2 : 1;
          ctx.beginPath(); ctx.roundRect(80, y, 440, rowH - 10, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = unlocked ? (sel ? '#eaffff' : '#9fd8e8') : '#5a6472';
          ctx.font = '700 20px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(unlocked ? e.title : '\u2588\u2588\u2588\u2588\u2588\u2588 // SIGNAL LOST', 98, y + 27);
          ctx.fillStyle = unlocked ? CONFIG.NEON_DIM : '#4a5260';
          ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(unlocked ? (e.faction || 'UNVERIFIED') : 'REQUIRES PROOF', 98, y + 45);
          ctx.restore();
        });
