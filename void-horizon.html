<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOID HORIZON</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05060e;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  /* NOTE: never 100vw/100vh — on mobile 100vh includes the browser toolbar area,
     which stretches the canvas past the visible window and desyncs touch input.
     fixed+inset pins the canvas to the true visible viewport. */
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================
   VOID HORIZON — single-file HTML5 game
   Phase 2: dual-gravity player, corridor, input semantics
            (tap=flip instantly, FIRE key/button: tap=bolt, hold=charge), juice pack.
   ============================================================ */

// ---------- CONFIG (all tunables live here) ----------
const CONFIG = {
  WORLD_W: 1280,            // logical world units (letterboxed)
  WORLD_H: 720,
  SIM_HZ: 60,
  SIM_DT: 1 / 60,
  MAX_FRAME_DT: 0.25,       // clamp huge frames (tab-away) -> no spiral of death
  BG: '#05060e',
  NEON: '#4de8ff',
  NEON_DIM: '#1a5f78',
  ACCENT: '#ff4dd2',
  GRAV_COLOR: '#ff36e0',      // graviton cannon: hotter neon pink than ACCENT
  WARN: '#ffd24d',
  // accessibility audit: WARN (yellow) was used for BOTH what kills you (diver drones,
  // tracers, rail pulses) and what you collect (dust) — color distance 0.0 for everyone.
  // Meanings now have their own colors; see PALETTES for the colorblind-safe set.
  DANGER: '#ff5a36',
  REWARD: '#ffd24d',

  // corridor geometry (station rails)
  RAIL_CEIL_Y: 110,         // underside of top station
  RAIL_FLOOR_Y: 610,        // top of bottom station
  PLAYER_X: 260,
  PLAYER_R: 16,
  // hitbox audit: every hazard now tests the ship as ONE circle of radius
  // PLAYER_R * HITBOX_FACTOR^2 = 10.24 px (boss bullets used 12.8 — 25% bigger than everything else)

  // physics
  GRAVITY: 2800,            // px/s^2
  MAX_FALL: 1700,

  // input semantics
  CHARGE_MS: 450,           // FIRE-button hold past this = charge (release = charged shot)
  WEAPON_UNLOCK_LEVEL: 3,   // weapon offline until Sector 3 (unlocked by clearing Sector 2)
  TAP_S: 0.22,              // FIRE tap cooldown
  TAP_BOLT_SPEED: 700,      // weak tap bolt (vs 900 autofire photon)
  TAP_BOLT_DMG: 1,

  // juice
  // depth pass: was 0.035. Measured tap->visible motion: 59 ms median with it, 8 ms without.
  // A freeze on the player's OWN action reads as lag (hitstop belongs to impacts).
  HITSTOP_FLIP: 0,
  // depth pass, input feel (measured: flips were dropped ONLY during the 0.9 s resume
  // countdown — 50/50 — and accepted on every other frame, so that's the one buffer)
  FLIP_BUFFER_S: 0.15,      // a flip tapped in the last 150 ms of the 3-2-1 fires on frame 1
  FLIP_GRACE_S: 0.066,      // late-input grace: a flip pressed <=66 ms (4 frames) before touching
                            // something anchored to the rail you're LEAVING doesn't count as a hit
  HITSTOP_LAND: 0.015,
  SHAKE_FLIP: 0.30,         // trauma units
  SHAKE_LAND: 0.12,
  SQUASH: 0.35,             // landing squash amount

  SCROLL_SPEED: 380,        // corridor scroll px/s (base; level speed multiplies)

  // phase 3 — levels & obstacles
  TOTAL_LEVELS: 50,
  HITBOX_FACTOR: 0.8,       // forgiving: 80% of visual size (round hazards + the ship)
  // hitbox audit: blocks/walls used 80% of their size, so forgiveness grew with the object:
  // ~3 px on a mine or small block but up to 29 px at a tall wall's tip (wider than the
  // ship's whole hitbox). Rect hazards now use the drawn shape inset by a fixed 4 px.
  HIT_INSET: 4,
  OBSTACLE_CAP: 24,
  BASE_SCROLL: 380,
  SCROLL_PER_LEVEL: 8,      // +8px/s per level (L50 = 772)
  QUOTA_BASE: 9000,
  QUOTA_PER_LEVEL: 700,     // L1=9.7k ... L50=44k world px (levels ~9-22s, user: too brief)
  DUST_PER_OBSTACLE: 2,
  DUST_GOAL_BONUS: 50,      // (legacy flat bonus; see goalBonus)
  // depth pass, economy: measured before — grinding Sectors 1-3 paid 172 dust/min vs 55/min
  // for pushing new sectors (casual model), so the optimal play was replaying the tutorial.
  // Rewards now scale with challenge: orbs are worth more deeper in, and the sector bonus
  // is a FIRST-clear bonus (replays pay a token).
  orbValue: (n) => 2 + Math.floor((n - 1) / 5),           // S1-5: 2 ... S46-50: 11
  goalBonus: (n, first) => first ? 40 + 12 * n : 10,      // S1 first clear 52 ... S49 628

  // phase 4 — combat
  AUTOFIRE_S: 0.42,         // photon cannon cooldown
  BULLET_POOL: 40,
  BULLET_SPEED: 900,
  BULLET_DMG: 1,
  BEAM_SPEED: 1100,         // charged beam px/s
  BEAM_PIERCE: 3,           // obstacles a beam destroys before fading
  BEAM_DMG: 5,
  SHOCK_RADIUS: 150,        // pulse-lance blast radius

  // playtest rework — rail hazards + combat depth
  PULSE_WARN_S: 1.4,        // telegraph before the rail goes live (was 1.15 — too easy to miss)
  PULSE_ACTIVE_S: 1.35,     // rail is lethal for this long
  ENEMY_BULLET_POOL: 24,
  ENEMY_BULLET_SPEED: 340,  // slow enough to flip-dodge
  DRONE_SHOOT_S: 1.9,       // shooter drone fire interval
  // depth pass: a tracer is aimed where you ARE when it fires, so the muzzle glow can't tell
  // you where to go — the honest reaction window is fire -> arrival. Floor: 250 ms to react
  // + ~100 ms for a flip to move the ship off the line (sqrt(2*14/2800) = 0.10 s) + margin.
  TRACER_MIN_WINDOW_S: 0.4, // measured before: 30.8% of shots arrived in < 250 ms (min -33 ms)
  WALL_SAME_SIDE_S: 1.4,    // walls closer than this (in seconds of travel) share a rail
  SPREAD_N: 8,              // void spread pellets
  SHIELDS_START: 3,
  HURT_IFRAMES: 1.1,        // invulnerability after taking a hit
  DUST_PER_KILL: 2,         // unused since kills drop collectible orbs instead (see ObstacleField._destroy)
  FIRE_BTN: { x: 1170, y: 600, r: 62 },  // on-screen FIRE (touch): lower-right thumb spot;
                                         // rendered translucent so it never hides the boss
  FS_BTN: { x: 1236, y: 46, r: 26 },    // fullscreen toggle, top-right corner (all states)
  PAUSE_BTN: { x: 1172, y: 46, r: 26 }, // pause (during a run), left of fullscreen
  // bosses (Phase 5)
  BOSS_R: 52,               // body collision radius (forgiving via HITBOX_FACTOR)
  BOSS_BULLET_CAP: 240,
  BOSS_SLOMO: 0.6,          // death slow-motion time scale

  STAR_LAYERS: [
    { count: 90,  speed: 8,   size: 1.0, alpha: 0.35 },
    { count: 55,  speed: 22,  size: 1.6, alpha: 0.60 },
    { count: 28,  speed: 50,  size: 2.4, alpha: 0.90 },
  ],
};

const DEBUG = new URLSearchParams(location.search).has('debug');
// accessibility settings (persisted with the save; applied at load and from SETTINGS)
const ACCESS = { flash: false, motion: false, palette: 'default' };
// colorblind-safe set, chosen by measuring the RENDERED game under Chrome's vision-deficiency
// emulation (glows on a dark background shrink colour differences vs. paper values): dangers
// sit on the blue/violet side, rewards on yellow — the axis protan/deutan vision keeps.
// Measured worst pairs (CIEDE2000): dust vs any danger >= 26, ship vs danger >= 10.8.
// (A red-danger set looked fine on paper but rendered dust vs diver at 5.2 under protanopia.)
const PALETTES = {
  default:    { NEON: '#4de8ff', ACCENT: '#ff4dd2', DANGER: '#ff5a36', REWARD: '#ffd24d', WARN: '#ffd24d' },
  colorblind: { NEON: '#3ddc97', ACCENT: '#6a40ff', DANGER: '#6a40ff', REWARD: '#ffe14d', WARN: '#ffe14d' },
};
function applyAccess(a) {
  if (a) Object.assign(ACCESS, a);
  Object.assign(CONFIG, PALETTES[ACCESS.palette] || PALETTES.default);
}

// ---------- utils ----------
// Task 4.3: tap-vs-hold input as a PURE state function (unit-testable).
// Used for the FIRE channel: st = { down, t, charging } — tick() advances time,
// decide() resolves release ('flip' label = quick tap = weak bolt, 'charged' = beam).
// chargeEnabled=false (weapon locked or tier <2): hold NEVER latches charge.
function tapHoldTick(st, dt, chargeMs, chargeEnabled) {
  if (!st.down) return st;
  st.t += dt;
  if (!st.charging && chargeEnabled && st.t * 1000 >= chargeMs) st.charging = true;
  return st;
}
function tapHoldDecide(st) {
  // called on release ('up'). Returns 'flip' | 'charged' | 'none'.
  if (!st.down) return 'none';
  st.down = false;
  const out = st.charging ? 'charged' : 'flip';
  st.charging = false;
  return out;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// ---------- GameCanvas: dynamic scaling with DPR + letterbox ----------
class GameCanvas {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.cssW = 0; this.cssH = 0;
    this.scale = 1;
    this.offsetX = 0; this.offsetY = 0;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    // mobile URL-bar collapse doesn't always fire window resize
    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', () => this.resize());
    window.addEventListener('orientationchange', () => this.resize());
  }
  resize() {
    this.dpr = clamp(window.devicePixelRatio || 1, 1, 3);
    this.cssW = window.innerWidth;
    this.cssH = window.innerHeight;
    this.canvas.width = Math.round(this.cssW * this.dpr);
    this.canvas.height = Math.round(this.cssH * this.dpr);
    this.scale = Math.min(this.cssW / CONFIG.WORLD_W, this.cssH / CONFIG.WORLD_H);
    this.offsetX = (this.cssW - CONFIG.WORLD_W * this.scale) / 2;
    this.offsetY = (this.cssH - CONFIG.WORLD_H * this.scale) / 2;
  }
  toWorld(clientX, clientY) {
    // subtract the canvas's ACTUAL viewport rect (mobile URL bars can shift it;
    // on desktop this is normally 0,0 — exact either way)
    const r = this.canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - this.offsetX) / this.scale,
      y: (clientY - r.top - this.offsetY) / this.scale,
    };
  }
  beginFrame() {
    const { ctx } = this;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = CONFIG.BG;
    ctx.fillRect(0, 0, this.cssW, this.cssH);
    ctx.save();
    ctx.translate(this.offsetX, this.offsetY);
    ctx.scale(this.scale, this.scale);
    ctx.beginPath();
    ctx.rect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
    ctx.clip();
  }
  endFrame() { this.ctx.restore(); }
}

// ---------- StateMachine ----------
class StateMachine {
  constructor(game) {
    this.game = game;
    this.current = null;
    this.states = new Map();
    this.transitions = 0;
  }
  register(name, state) {
    state.name = name;
    this.states.set(name, state);
    return this;
  }
  to(name, payload) {
    const next = this.states.get(name);
    if (!next) throw new Error(`Unknown state: ${name}`);
    if (this.current && this.current.onExit) this.current.onExit(this.game, name);
    if (DEBUG) console.log(`[SM] ${this.current ? this.current.name : '(none)'} -> ${name}`);
    this.current = next;
    this.transitions++;
    if (next.onEnter) next.onEnter(this.game, payload);
  }
  update(dt)    { if (this.current.update)    this.current.update(this.game, dt); }
  render(rc)    { if (this.current.render)    this.current.render(this.game, rc); }
  input(type, worldPos) { if (this.current.input) this.current.input(this.game, type, worldPos); }
}

// ---------- ART: cached glow sprites + backdrop layers (visual upgrade) ----------
// shadowBlur is expensive and looks muddy at scale. Pre-rendered radial-gradient
// sprites drawn with additive blending ('lighter') are far cheaper and give a
// real bloom look. Everything here is RENDER-ONLY — no gameplay values change.
const ART = {
  _glow: new Map(),
  built: false,
  _alpha(hex, a) {
    if (typeof hex !== 'string' || hex.length !== 7) return `rgba(255,255,255,${a})`;
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  },
  _canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
  glowSprite(color) {
    let c = this._glow.get(color);
    if (c) return c;
    c = this._canvas(128, 128);
    const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, this._alpha(color, 1));
    gr.addColorStop(0.18, this._alpha(color, 0.65));
    gr.addColorStop(0.5, this._alpha(color, 0.18));
    gr.addColorStop(1, this._alpha(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    this._glow.set(color, c);
    return c;
  },
  // additive bloom blob; r = outer radius
  glow(ctx, x, y, r, color, alpha = 1) {
    if (r <= 0 || alpha <= 0) return;
    const op = ctx.globalCompositeOperation, a0 = ctx.globalAlpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a0 * Math.min(1, alpha);
    ctx.drawImage(this.glowSprite(color), x - r, y - r, r * 2, r * 2);
    ctx.globalCompositeOperation = op; ctx.globalAlpha = a0;
  },
  build() {
    if (this.built) return;
    this.built = true;
    const W = CONFIG.WORLD_W, H = CONFIG.WORLD_H;
    // --- nebula: soft overlapping clouds, tiled seamlessly on X for scrolling ---
    {
      const c = this._canvas(W, H), g = c.getContext('2d'), rnd = mulberry32(90210);
      g.globalCompositeOperation = 'lighter';
      const cols = ['#3a1a6e', '#0e4a6b', '#6b1a55', '#1a2f6e', '#0f5a5a'];
      for (let i = 0; i < 28; i++) {
        const x = rnd() * W, y = rnd() * H, r = 120 + rnd() * 330;
        const col = cols[i % cols.length], a = 0.10 + rnd() * 0.12;
        for (const ox of [-W, 0, W]) {
          const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r);
          gr.addColorStop(0, this._alpha(col, a));
          gr.addColorStop(0.6, this._alpha(col, a * 0.35));
          gr.addColorStop(1, this._alpha(col, 0));
          g.fillStyle = gr; g.fillRect(x + ox - r, y - r, r * 2, r * 2);
        }
      }
      // baked micro-stars give the clouds texture
      g.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 520; i++) {
        g.globalAlpha = 0.08 + rnd() * 0.3;
        g.fillStyle = rnd() < 0.15 ? '#ffd9f4' : '#cfeaff';
        g.fillRect(rnd() * W, rnd() * H, 1, 1);
      }
      this.nebula = c;
    }
    // --- distant ringed gas giant ---
    {
      const c = this._canvas(520, 400), g = c.getContext('2d'), cx = 260, cy = 200, R = 140;
      const ring = (front) => {
        g.save(); g.translate(cx, cy); g.rotate(-0.28);
        g.strokeStyle = 'rgba(255,200,120,0.32)'; g.lineWidth = 10;
        g.beginPath(); g.ellipse(0, 0, 235, 42, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); g.stroke();
        g.strokeStyle = 'rgba(255,170,90,0.18)'; g.lineWidth = 4;
        g.beginPath(); g.ellipse(0, 0, 210, 36, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); g.stroke();
        g.restore();
      };
      ring(false);
      const halo = g.createRadialGradient(cx, cy, R, cx, cy, R + 40);
      halo.addColorStop(0, 'rgba(77,232,255,0.28)'); halo.addColorStop(1, 'rgba(77,232,255,0)');
      g.fillStyle = halo; g.fillRect(0, 0, 520, 400);
      g.save();
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
      const body = g.createRadialGradient(cx - 50, cy - 55, 10, cx, cy, R);
      body.addColorStop(0, '#4c78a8'); body.addColorStop(0.45, '#1d3256'); body.addColorStop(1, '#070b16');
      g.fillStyle = body; g.fillRect(cx - R, cy - R, R * 2, R * 2);
      const rnd = mulberry32(31337);
      for (let i = 0; i < 9; i++) {                       // cloud bands
        g.globalAlpha = 0.10 + rnd() * 0.14;
        g.fillStyle = rnd() < 0.5 ? '#7fb2e0' : '#2b4f80';
        g.beginPath();
        g.ellipse(cx, cy - R + 20 + i * 30 + rnd() * 8, R * 1.2, 5 + rnd() * 9, -0.12, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
      const shade = g.createRadialGradient(cx + 70, cy + 70, 30, cx + 70, cy + 70, R * 1.6);
      shade.addColorStop(0, 'rgba(2,3,8,0.92)'); shade.addColorStop(0.55, 'rgba(2,3,8,0.55)');
      shade.addColorStop(1, 'rgba(2,3,8,0)');
      g.fillStyle = shade; g.fillRect(cx - R, cy - R, R * 2, R * 2);
      g.restore();
      g.strokeStyle = 'rgba(140,220,255,0.55)'; g.lineWidth = 2;
      g.beginPath(); g.arc(cx, cy, R, Math.PI * 0.85, Math.PI * 1.7); g.stroke();
      ring(true);
      this.planet = c;
    }
    // --- vignette + hurt vignette ---
    const vig = (inner, col, a) => {
      const c = this._canvas(W, H), g = c.getContext('2d');
      const gr = g.createRadialGradient(W / 2, H / 2, H * inner, W / 2, H / 2, W * 0.72);
      gr.addColorStop(0, this._alpha(col, 0)); gr.addColorStop(1, this._alpha(col, a));
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      return c;
    };
    this.vig = vig(0.45, '#000008', 0.62);
    this.hurt = vig(0.32, '#ff1e50', 0.55);
  },
};

// ---------- Starfield (3-layer parallax) ----------
class Starfield {
  constructor(seed = 1337) {
    const rnd = mulberry32(seed);
    this.layers = CONFIG.STAR_LAYERS.map((cfg) => {
      const stars = [];
      for (let i = 0; i < cfg.count; i++) {
        stars.push({
          x: rnd() * CONFIG.WORLD_W,
          y: rnd() * CONFIG.WORLD_H,
          r: cfg.size * (0.6 + rnd() * 0.8),
          phase: rnd() * Math.PI * 2,
          twinkle: 0.5 + rnd() * 2.0,
        });
      }
      return { cfg, stars };
    });
    this.time = 0;
  }
  update(dt, scrollMult = 1) {
    this.time += dt;
    this.mult = scrollMult;
    // far layers drift with the run: nebula and planet are the slowest parallax
    this.nebX = ((this.nebX || 0) + 3 * scrollMult * dt) % CONFIG.WORLD_W;
    this.planetX = ((this.planetX === undefined ? 760 : this.planetX) + 1.4 * scrollMult * dt) % (CONFIG.WORLD_W + 700);
    for (const { cfg, stars } of this.layers) {
      for (const s of stars) {
        s.x -= cfg.speed * scrollMult * dt;
        if (s.x < -4) s.x += CONFIG.WORLD_W + 8;
      }
    }
  }
  render(ctx) {
    ART.build();
    const W = CONFIG.WORLD_W, H = CONFIG.WORLD_H;
    // nebula clouds (seamless tile, two copies)
    // seamless scroll as two slices (one full-screen fill instead of two)
    const sx = Math.floor(this.nebX || 0) % W;
    if (W - sx > 0) ctx.drawImage(ART.nebula, sx, 0, W - sx, H, 0, 0, W - sx, H);
    if (sx > 0) ctx.drawImage(ART.nebula, 0, 0, sx, H, W - sx, 0, sx, H);
    // distant gas giant, kept dim so it never competes with hazards
    const px = W + 260 - (this.planetX || 0);
    ctx.save();
    ctx.globalAlpha = 0.24;
    ctx.drawImage(ART.planet, px - 208, 150 - 160, 416, 320);   // high, mostly behind the ceiling
    ctx.restore();
    // stars: near layer stretches into streaks at speed
    const mult = this.mult || 1;
    this.layers.forEach(({ cfg, stars }, li) => {
      const streak = li === 2 && mult > 1.2 ? cfg.speed * mult * 0.12 : 0;
      for (const s of stars) {
        const a = cfg.alpha * (0.55 + 0.45 * Math.sin(this.time * s.twinkle + s.phase));
        ctx.globalAlpha = a;
        if (streak > 1) {
          ctx.strokeStyle = '#cfeaff'; ctx.lineWidth = s.r; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + streak, s.y); ctx.stroke();
        } else {
          ctx.fillStyle = '#cfeaff';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        }
        // the brightest stars get a diffraction glint
        if (li === 2 && s.r > 2.9 && !streak) {
          ctx.globalAlpha = a * 0.5;
          ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(s.x - 7, s.y); ctx.lineTo(s.x + 7, s.y);
          ctx.moveTo(s.x, s.y - 7); ctx.lineTo(s.x, s.y + 7);
          ctx.stroke();
        }
      }
    });
    ctx.globalAlpha = 1;
  }
}

// ---------- ParticleSystem (pooled) ----------
class ParticleSystem {
  constructor(max = 500) {
    this.pool = new Array(max).fill(null).map(() => ({ alive: false }));
    this.max = max;
    this.aliveCount = 0;
  }
  spawn(x, y, vx, vy, life, color, size, opts = {}) {
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) {
        p.alive = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
        p.life = life; p.maxLife = life; p.color = color; p.size = size;
        p.drag = opts.drag ?? 0.985; p.glow = opts.glow ?? true;
        this.aliveCount++;
        return p;
      }
    }
    return null; // pool exhausted — drop silently (hard cap = perf guarantee)
  }
  burst(x, y, n, color, speed, life = 0.5, size = 3, rnd = Math.random) {
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2;
      const sp = speed * (0.35 + rnd() * 0.65);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
                 life * (0.6 + rnd() * 0.4), color, size * (0.6 + rnd() * 0.8));
    }
  }
  update(dt) {
    let alive = 0;
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= p.drag; p.vy *= p.drag;
      alive++;
    }
    this.aliveCount = alive;
  }
  render(ctx) {
    // additive bloom: overlapping sparks brighten each other like real light
    const op = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.max; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      const t = p.life / p.maxLife, s = p.size * (0.5 + t * 0.5);
      ctx.globalAlpha = t;
      if (p.glow) ctx.drawImage(ART.glowSprite(p.color), p.x - s * 3, p.y - s * 3, s * 6, s * 6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
    }
    ctx.globalCompositeOperation = op;
    ctx.globalAlpha = 1;
  }
}

// ---------- Player: dual-gravity physics ----------
class Player {
  constructor(game) {
    this.game = game;
    this.reset();
  }
  reset() {
    this.x = CONFIG.PLAYER_X;
    this.y = CONFIG.RAIL_FLOOR_Y - CONFIG.PLAYER_R;
    this.vy = 0;
    this.gravDir = 1;          // 1 = falling to floor, -1 = to ceiling
    this.grounded = true;
    this.squash = 0;           // landing squash, decays
    this.trail = [];           // recent positions
    this.chargeT = 0;          // charge ring fill 0..1
    this.alive = true;
    this.shields = CONFIG.SHIELDS_START +
      ((this.game.run && this.game.run.upgrades) ? this.game.run.upgrades.hull : 0);
    this.iframes = 0;          // s of invulnerability after a hit
    this.graceT = 0; this.graceUid = null; this.graceRail = 0; this.lastFlipFrame = -999; this.leftSide = 0;
  }
  get floorY() { return CONFIG.RAIL_FLOOR_Y - CONFIG.PLAYER_R; }
  get ceilY()  { return CONFIG.RAIL_CEIL_Y + CONFIG.PLAYER_R; }
  // effective gravity direction*magnitude: gravDir x the Entity's distortion
  // field (game.gravityDistort, 1.0 normally; negative = corridor pulls wrong-way)
  eff() { return this.gravDir * (this.game.gravityDistort || 1); }

  // a flip was *requested* (short tap release) — flips anytime, grounded or airborne
  requestFlip() {
    this.doFlip();
  }
  doFlip() {
    this.leftSide = this.gravDir;                  // the rail we're pushing off
    this.lastFlipFrame = this.game.simFrame || 0;
    this.flipFromRail = this.grounded; this.flipY = this.y;
    this.gravDir *= -1;
    this.grounded = false;
    const g = this.game;
    Snd.play('flip');
    g.shake(CONFIG.SHAKE_FLIP);
    g.hitstop = Math.max(g.hitstop, CONFIG.HITSTOP_FLIP);
    g.particles.burst(this.x, this.y - this.gravDir * CONFIG.PLAYER_R,
                      14, CONFIG.NEON, 420, 0.45, 3);
    this.squash = Math.max(this.squash, 0.18); // stretch pop
  }
  update(dt) {
    if (this.iframes > 0) this.iframes = Math.max(0, this.iframes - dt);
    if (this.graceT > 0) { this.graceT -= dt; if (this.graceT <= 0) { this.graceUid = null; this.graceRail = 0; } }
    // Phase 6: the Entity's gravity-distortion field scales/flips effective gravity.
    // eff < 0 means the corridor pulls the "wrong" way — flips become a tool
    // to counter it (flip while inverted = normal pull again).
    const eff = this.eff();
    if (this.grounded && eff < 0) this.grounded = false;  // floor becomes ceiling-bound fall
    if (!this.grounded) {
      this.vy += CONFIG.GRAVITY * eff * dt;
      this.vy = clamp(this.vy, -CONFIG.MAX_FALL, CONFIG.MAX_FALL);
      this.y += this.vy * dt;
      // rails are solid from BOTH sides. (Was: only the rail gravity pointed at was
      // checked, so a counter-flip just before landing carried the ship through the
      // rail into the station hull, off-screen and untouchable. Found by the LAB solver.)
      if (this.y >= this.floorY) {
        if (eff > 0) this.land(this.floorY); else { this.y = this.floorY; if (this.vy > 0) this.vy = 0; }
      } else if (this.y <= this.ceilY) {
        if (eff < 0) this.land(this.ceilY); else { this.y = this.ceilY; if (this.vy < 0) this.vy = 0; }
      }
    }

    this.squash = Math.max(0, this.squash - dt * 4.5);

    // trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 14) this.trail.shift();
    // exhaust sparks (visual only; pooled + capped particles)
    if (Math.random() < 0.55) {
      const col = this.gravDir > 0 ? CONFIG.WARN : CONFIG.ACCENT;
      this.game.particles.spawn(this.x - CONFIG.PLAYER_R * 1.35, this.y + (Math.random() - 0.5) * 6,
        -200 - Math.random() * 180, (Math.random() - 0.5) * 50,
        0.22 + Math.random() * 0.2, col, 1.2 + Math.random() * 1.1, { drag: 0.95 });
    }
  }
  land(y) {
    const impact = Math.abs(this.vy);
    this.y = y;
    this.vy = 0;
    this.grounded = true;
    const g = this.game;
    if (impact > 600) { // only hard landings crunch
      this.squash = Math.min(CONFIG.SQUASH, CONFIG.SQUASH * impact / CONFIG.MAX_FALL);
      g.shake(CONFIG.SHAKE_LAND);
      g.hitstop = Math.max(g.hitstop, CONFIG.HITSTOP_LAND);
      const dir = -this.gravDir; // scuff sprays away from rail
      for (let i = 0; i < 10; i++) {
        g.particles.spawn(
          this.x + (Math.random() - 0.5) * 26, this.y - dir * CONFIG.PLAYER_R,
          (Math.random() - 0.5) * 340, dir * (60 + Math.random() * 160),
          0.3, CONFIG.NEON_DIM, 2.2);
      }
    }
  }
  render(ctx, t) {
    const R = CONFIG.PLAYER_R;
    const engCol = this.gravDir > 0 ? CONFIG.WARN : CONFIG.ACCENT;
    // ---- plasma ribbon: tapered additive streak tracing the flight path ----
    if (this.trail.length > 2) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.strokeStyle = engCol;
      const n = this.trail.length;
      for (let i = 1; i < n; i++) {
        const a = this.trail[i - 1], b = this.trail[i], f = i / n;
        ctx.globalAlpha = f * 0.3;
        ctx.lineWidth = 1.5 + f * 8;
        ctx.beginPath();
        ctx.moveTo(a.x - R * 1.25 - (n - i + 1) * 7, a.y);
        ctx.lineTo(b.x - R * 1.25 - (n - i) * 7, b.y);
        ctx.stroke();
      }
      ctx.restore();
    }
    // i-frame blink: flicker hull while invulnerable after a hit
    const blink = this.iframes > 0 ? (ACCESS.flash ? 0.55 : (Math.floor(t * 14) % 2 === 0 ? 0.3 : 1)) : 1;

    // engine bloom sits behind the hull
    ART.glow(ctx, this.x - R * 1.3, this.y, R * (this.grounded ? 1.6 : 2.3), engCol, 0.8 * blink);

    const sq = this.squash;
    ctx.save();
    ctx.globalAlpha = blink;
    ctx.translate(this.x, this.y);
    ctx.scale(1 + sq, (1 - sq) * this.gravDir);   // mirror so ship always banks toward its rail
    ctx.rotate(clamp((this.vy * this.gravDir) / 1000, -1, 1) * 0.5);

    // ---- plasma flame (layered: wide colored plume + white-hot core) ----
    {
      const fl = R * (0.9 + 0.3 * Math.sin(t * 40) + 0.15 * Math.sin(t * 67)) * (this.grounded ? 0.7 : 1.35);
      const nx = -R * 1.2;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const outer = ctx.createLinearGradient(nx, 0, nx - fl * 1.8, 0);
      outer.addColorStop(0, ART._alpha(engCol, 0.95)); outer.addColorStop(1, ART._alpha(engCol, 0));
      ctx.fillStyle = outer;
      ctx.beginPath();
      ctx.moveTo(nx, -R * 0.24);
      ctx.quadraticCurveTo(nx - fl * 0.9, -R * 0.3, nx - fl * 1.8, 0);
      ctx.quadraticCurveTo(nx - fl * 0.9, R * 0.3, nx, R * 0.24);
      ctx.closePath(); ctx.fill();
      const core = ctx.createLinearGradient(nx, 0, nx - fl, 0);
      core.addColorStop(0, 'rgba(255,255,255,0.95)'); core.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.moveTo(nx, -R * 0.11);
      ctx.quadraticCurveTo(nx - fl * 0.5, -R * 0.12, nx - fl, 0);
      ctx.quadraticCurveTo(nx - fl * 0.5, R * 0.12, nx, R * 0.11);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // ---- hull: side-profile fighter, long nose, dorsal fin, swept belly wing ----
    const hullPath = () => {
      ctx.beginPath();
      ctx.moveTo(R + 8, -R * 0.02);
      ctx.lineTo(R * 0.35, -R * 0.32);
      ctx.lineTo(-R * 0.05, -R * 0.42);
      ctx.lineTo(-R * 0.28, -R * 0.50);
      ctx.lineTo(-R * 0.40, -R * 1.05);
      ctx.lineTo(-R * 0.78, -R * 0.95);
      ctx.lineTo(-R * 0.72, -R * 0.42);
      ctx.lineTo(-R * 0.98, -R * 0.34);
      ctx.lineTo(-R * 1.18, -R * 0.24);
      ctx.lineTo(-R * 1.18,  R * 0.24);
      ctx.lineTo(-R * 0.98,  R * 0.36);
      ctx.lineTo(-R * 0.55,  R * 0.48);
      ctx.lineTo(-R * 0.20,  R * 1.02);
      ctx.lineTo(-R * 0.72,  R * 0.98);
      ctx.lineTo(-R * 0.85,  R * 0.52);
      ctx.lineTo(-R * 0.10,  R * 0.46);
      ctx.lineTo(R * 0.45,  R * 0.30);
      ctx.closePath();
    };
    const hull = ctx.createLinearGradient(0, -R * 1.05, 0, R * 1.02);
    hull.addColorStop(0, '#5d86b4'); hull.addColorStop(0.35, '#1f3654');
    hull.addColorStop(0.7, '#0c1828'); hull.addColorStop(1, '#050a14');
    ctx.fillStyle = hull;
    ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 10;   // one soft rim glow for the hero
    hullPath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.save();
    hullPath(); ctx.clip();
    // panel seams + magenta racing stripe
    ctx.strokeStyle = 'rgba(160,220,255,0.22)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(R * 0.55, -R * 0.12); ctx.lineTo(-R * 1.1, -R * 0.12);
    ctx.moveTo(-R * 0.45, -R * 0.45); ctx.lineTo(-R * 0.45, R * 0.42);
    ctx.moveTo(-R * 0.9, -R * 0.3); ctx.lineTo(-R * 0.9, R * 0.3);
    ctx.moveTo(-R * 0.62, R * 0.55); ctx.lineTo(-R * 0.35, R * 0.92);
    ctx.stroke();
    ctx.strokeStyle = ART._alpha(CONFIG.ACCENT, 0.85); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(R + 4, R * 0.08); ctx.lineTo(-R * 1.15, R * 0.14); ctx.stroke();
    // engine vents
    ctx.strokeStyle = 'rgba(77,232,255,0.45)'; ctx.lineWidth = 1;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(-R * 1.08, k * R * 0.11); ctx.lineTo(-R * 0.96, k * R * 0.11); ctx.stroke();
    }
    ctx.restore();
    // rim light
    ctx.strokeStyle = CONFIG.NEON; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
    hullPath(); ctx.stroke();

    // ---- canopy: tinted glass with a specular streak ----
    const glass = ctx.createRadialGradient(R * 0.02, -R * 0.56, 1, R * 0.02, -R * 0.46, R * 0.42);
    glass.addColorStop(0, '#d8fbff'); glass.addColorStop(0.35, '#3fa6d6'); glass.addColorStop(1, '#0a2540');
    ctx.fillStyle = glass;
    ctx.strokeStyle = '#9ff4ff'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(R * 0.30, -R * 0.32);
    ctx.quadraticCurveTo(R * 0.08, -R * 0.66, -R * 0.24, -R * 0.48);
    ctx.lineTo(-R * 0.05, -R * 0.42);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(R * 0.18, -R * 0.42); ctx.quadraticCurveTo(R * 0.05, -R * 0.55, -R * 0.1, -R * 0.5); ctx.stroke();

    // ---- nav lights (fin tip + wing tip) ----
    const nav = Math.floor(t * 2.5) % 2 === 0;
    ART.glow(ctx, -R * 0.40, -R * 1.05, 7, '#4dffb0', nav ? 0.9 : 0.25);
    ART.glow(ctx, -R * 0.20, R * 1.02, 7, '#ff4d6d', nav ? 0.25 : 0.9);
    ctx.restore();

    // ---- shield segments: one arc per remaining shield, slowly orbiting ----
    if (this.shields > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const hit = this.iframes > 0;
      ctx.strokeStyle = hit ? CONFIG.ACCENT : CONFIG.NEON;
      ctx.lineWidth = hit ? 3 : 1.5;
      ctx.globalAlpha = hit ? 0.35 + 0.35 * Math.sin(t * 40) : 0.16;
      const n = Math.min(this.shields, 8);           // never more than 8 drawn segments
      const seg = (Math.PI * 2) / n, rot = t * 0.9;
      for (let k = 0; k < n; k++) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, R * 2.05, rot + k * seg + 0.12, rot + (k + 1) * seg - 0.12);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ---- charge: energy gathers at the nose + ring ----
    if (this.chargeT > 0) {
      const Wp = this.game.weapon, grav = Wp && Wp.variant === 'graviton' && !Wp.locked;
      const cc = grav ? CONFIG.GRAV_COLOR : CONFIG.WARN;
      const nx = this.x + R + 10;
      ART.glow(ctx, nx, this.y, (grav ? 10 : 6) + this.chargeT * (grav ? 38 : 24), cc, 0.4 + this.chargeT * 0.6);
      if (grav) {
        // energy ball: white-hot core + three sparks orbiting faster as it fills
        ART.glow(ctx, nx, this.y, 4 + this.chargeT * 12, '#ffffff', 0.5 + this.chargeT * 0.5);
        const spin = t * (6 + this.chargeT * 18), orb = 10 + this.chargeT * 10;
        for (let k = 0; k < 3; k++) {
          const a = spin + k * 2.094;
          ART.glow(ctx, nx + Math.cos(a) * orb, this.y + Math.sin(a) * orb * 0.6, 7, cc, 0.9);
        }
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = cc;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, R + 8,
              -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, this.chargeT));
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---------- Corridor (station rails + scrolling girders) ----------
class Corridor {
  constructor(seed = 7) {
    this.rnd = mulberry32(seed);
    this.girders = [];
    for (let i = 0; i < 8; i++) {
      this.girders.push({ x: i * 180 + this.rnd() * 60, h: 14 + this.rnd() * 26 });
    }
    this.lights = [];
    for (let i = 0; i < 12; i++) {
      this.lights.push({ x: i * 110 + this.rnd() * 40, ceil: i % 2 === 0 });
    }
    this.scroll = 0;
  }
  update(dt, speed) {
    const v = (speed || CONFIG.SCROLL_SPEED) * dt;
    // 15840 = common multiple of the 1440 girder and 1320 light cycles (no jump on wrap)
    this.scroll = (this.scroll + v) % 15840;
    this.pulseX = ((this.pulseX || 0) + v * 2.2) % 1440;
  }
  rail(ctx, y, flip) {
    const W = CONFIG.WORLD_W, dir = flip ? 1 : -1;     // dir points into the corridor
    ctx.save();
    // energy conduit haze hugging the rail
    const gr = ctx.createLinearGradient(0, y, 0, y + dir * 30);
    gr.addColorStop(0, 'rgba(77,232,255,0.20)'); gr.addColorStop(1, 'rgba(77,232,255,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, Math.min(y, y + dir * 30), W, 30);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = CONFIG.NEON; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.strokeStyle = '#eaffff'; ctx.lineWidth = 1; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.globalAlpha = 1;
    // energy pulses racing along the rail
    for (let k = 0; k < 4; k++) {
      const x = W + 80 - ((this.pulseX + k * 360 + (flip ? 180 : 0)) % 1440);
      ART.glow(ctx, x, y, 34, CONFIG.NEON, 0.55);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70, y); ctx.stroke();
    }
    ctx.restore();
    // trim line on the station side
    ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y - dir * 6); ctx.lineTo(W, y - dir * 6); ctx.stroke();
  }
  render(ctx, t) {
    const W = CONFIG.WORLD_W, CY = CONFIG.RAIL_CEIL_Y, FY = CONFIG.RAIL_FLOOR_Y, H = CONFIG.WORLD_H;
    // station masses: brushed hull plating, lit toward the corridor
    const top = ctx.createLinearGradient(0, 0, 0, CY);
    top.addColorStop(0, '#04060d'); top.addColorStop(0.7, '#0d1426'); top.addColorStop(1, '#1a2540');
    ctx.fillStyle = top; ctx.fillRect(0, 0, W, CY);
    const bot = ctx.createLinearGradient(0, FY, 0, H);
    bot.addColorStop(0, '#1a2540'); bot.addColorStop(0.3, '#0d1426'); bot.addColorStop(1, '#04060d');
    ctx.fillStyle = bot; ctx.fillRect(0, FY, W, H - FY);

    // hull plate seams + lit portholes, scrolling with the run
    ctx.save();
    ctx.strokeStyle = 'rgba(120,170,220,0.10)'; ctx.lineWidth = 1;
    const seam = this.scroll % 120;
    ctx.beginPath();
    for (let x = -seam; x < W; x += 120) {
      ctx.moveTo(x, 8); ctx.lineTo(x, CY - 10);
      ctx.moveTo(x + 60, FY + 10); ctx.lineTo(x + 60, H - 8);
    }
    ctx.moveTo(0, CY * 0.45); ctx.lineTo(W, CY * 0.45);
    ctx.moveTo(0, FY + (H - FY) * 0.55); ctx.lineTo(W, FY + (H - FY) * 0.55);
    ctx.stroke();
    for (let i = 0; i < 18; i++) {
      const lit = ((i * 7919) % 5) !== 0;                       // a few windows stay dark
      const x = ((i * 83 - this.scroll * 0.9) % 1494 + 1494) % 1494 - 100;
      const ceil = i % 2 === 0, wy = ceil ? 26 : H - 34;
      ctx.fillStyle = lit ? 'rgba(255,214,140,0.55)' : 'rgba(80,100,130,0.25)';
      for (let k = 0; k < 3; k++) ctx.fillRect(x + k * 12, wy, 8, 5);
      if (lit) ART.glow(ctx, x + 14, wy + 2, 22, '#ffc85a', 0.18);
    }
    ctx.restore();

    // scrolling girders on station faces (depth cue)
    ctx.strokeStyle = 'rgba(77,232,255,0.20)';
    ctx.lineWidth = 2;
    for (const g of this.girders) {
      const x = ((g.x - this.scroll) % 1440 + 1440) % 1440 - 80;
      ctx.beginPath();
      ctx.moveTo(x, CY - 4); ctx.lineTo(x + 24, CY - 4 - g.h);
      ctx.moveTo(x, CY - 4 - g.h); ctx.lineTo(x + 48, CY - 4 - g.h);
      ctx.moveTo(x, FY + 4); ctx.lineTo(x + 24, FY + 4 + g.h);
      ctx.moveTo(x, FY + 4 + g.h); ctx.lineTo(x + 48, FY + 4 + g.h);
      ctx.stroke();
    }
    // rail lights
    for (const l of this.lights) {
      const x = ((l.x - this.scroll) % 1320 + 1320) % 1320 - 40;
      const y = l.ceil ? CY + 8 : FY - 8;
      const pulse = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + x * 0.02));
      ART.glow(ctx, x, y, 12, CONFIG.ACCENT, pulse);
      ctx.fillStyle = '#ffd9f4';
      ctx.fillRect(x - 1, y - 1, 2, 2);
    }

    this.rail(ctx, CY, true);
    this.rail(ctx, FY, false);
  }
}

// ---------- LevelConfig: deterministic 50-level parameter table ----------
function LevelConfig(n) {
  n = clamp(n, 1, CONFIG.TOTAL_LEVELS);
  const t = (n - 1) / (CONFIG.TOTAL_LEVELS - 1);   // 0..1 progression
  return {
    level: n,
    speed: CONFIG.BASE_SCROLL + CONFIG.SCROLL_PER_LEVEL * (n - 1),
    quota: CONFIG.QUOTA_BASE + CONFIG.QUOTA_PER_LEVEL * n,
    // spawn weights shift from debris-only toward mines/walls
    weights: {
      debris: 1.0,
      mine:   Math.max(0, t * 2 - 0.2),            // mines from ~L6
      wall:   Math.max(0, t * 1.6 - 0.2),          // walls from ~L8 (was L19)
      drone:  Math.min(0.9, Math.max(0, t * 2)),   // drones from ~L1 ramping
      dust:   0.55,
    },
    // seconds between spawns (shrinks with level; never below fair-flip window)
    gapMin: Math.max(0.75, 1.35 - t * 0.55),
    gapJit: Math.max(0.25, 0.9 - t * 0.5),
    // seconds between rail pulses (whole rail electrifies — no standing still)
    pulseGap: Math.max(1.5, 3.4 - t * 1.8),
    pulseJit: 1.3,
    seed: n * 7919,
  };
}

// ---------- ObstacleField: pooled obstacles + dust, seeded per level ----------
// Types: debris (rail chunk), mine (floats mid-corridor, pulses),
//        wall (tall slab on one rail — forces a committed flip),
//        dust  (collectible). All shapes are forgiving (HITBOX_FACTOR).
class ObstacleField {
  constructor(game, levelCfg) {
    this.game = game;
    this.cfg = levelCfg;
    this.rnd = mulberry32(levelCfg.seed);
    // DETERMINISM: kill-drop scatter has its own seeded stream, so shooting things can't
    // change what spawns next; the field keeps its own clock (game.time also runs in menus)
    this.dropRnd = mulberry32((levelCfg.seed ^ 0x5bd1e995) >>> 0);
    this.simT = 0;
    this.lastHit = null;        // what the last 'hit' was (telemetry)
    this.pool = new Array(CONFIG.OBSTACLE_CAP).fill(null).map(() => ({ alive: false }));
    this.aliveCount = 0;
    this.nextSpawnDist = 900;   // px of runway before the first obstacle
    this.traveled = 0;

    const pu = this.pulse;
    if (this.pulseEnabled && pu.state === 'warn') this._drawRailWarn(ctx, t);
    if (this.pulseEnabled && pu.state === 'live') {
      const ry = pu.side > 0 ? CONFIG.RAIL_FLOOR_Y : CONFIG.RAIL_CEIL_Y;
      const live = pu.state === 'live';
      const blink = live ? 1 : (Math.floor(t * 10) % 2 ? 0.8 : 0.15);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const zz = live ? 7 : 2;   // lightning zigzag amplitude
      const bolt = () => {
        ctx.beginPath();
        for (let x = 0; x <= CONFIG.WORLD_W; x += 24) {
          const y = ry + ((x / 24) % 2 ? -zz : zz) * (live ? (0.6 + 0.4 * Math.sin(t * 30 + x)) : 0.5);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      };
      ctx.strokeStyle = CONFIG.DANGER;
      ctx.globalAlpha = blink * 0.35; ctx.lineWidth = live ? 14 : 5; bolt();
      ctx.globalAlpha = blink; ctx.lineWidth = live ? 4 : 2; bolt();
      if (live) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; bolt();
        for (let x = (t * 900) % 160; x < CONFIG.WORLD_W; x += 160)
          ART.glow(ctx, x, ry, 46, CONFIG.DANGER, 0.45);
      }
      ctx.restore();
    }
    // enemy tracers: white-hot cores with additive halos
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const b of this.ebullets) {
      if (!b.alive) continue;
      ctx.strokeStyle = CONFIG.DANGER; ctx.globalAlpha = 0.5; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.045, b.y - b.vy * 0.045); ctx.stroke();
      ctx.globalAlpha = 1;
      ART.glow(ctx, b.x, b.y, 15, CONFIG.DANGER, 0.9);
      ctx.fillStyle = '#fff6d0';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    for (const o of this.pool) {
      if (!o.alive) continue;
      ctx.save();
      if (o.type === 'dust') this._drawDust(ctx, o, t);
      else if (o.type === 'debris') this._drawDebris(ctx, o, t);
      else if (o.type === 'mine') this._drawMine(ctx, o, t);
      else if (o.type === 'drone') this._drawDrone(ctx, o, t);
      else this._drawWall(ctx, o, t);
      ctx.restore();
    }
  }
  // RAIL CHARGING telegraph: the rail fills like a countdown bar, the danger glow
  // builds, blinking + beeps accelerate toward the moment it goes live, and a
  // FLIP! callout appears if you're riding the rail that's about to fire.
  _drawRailWarn(ctx, t) {
    const pu = this.pulse, W = CONFIG.WORLD_W;
    const ry = pu.side > 0 ? CONFIG.RAIL_FLOOR_Y : CONFIG.RAIL_CEIL_Y;
    const dir = pu.side > 0 ? -1 : 1;                       // into the corridor
    const prog = clamp(pu.t / CONFIG.PULSE_WARN_S, 0, 1);
    // chirp: blink rate climbs from 5Hz to ~21Hz
    const on = ACCESS.flash ? true : Math.sin(Math.PI * 2 * (5 * pu.t + 8 * pu.t * prog)) > 0;
    const k = on ? 1 : 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // danger haze rising off the rail
    const band = ctx.createLinearGradient(0, ry, 0, ry + dir * 120);
    band.addColorStop(0, ART._alpha(CONFIG.DANGER, 0.12 + 0.38 * prog));   // steady ramp, never blinks
    band.addColorStop(1, ART._alpha(CONFIG.DANGER, 0));
    ctx.fillStyle = band;
    ctx.fillRect(0, Math.min(ry, ry + dir * 120), W, 120);
    // charge bar: dim full rail, bright fill sweeping left -> right
    ctx.lineCap = 'round';
    ctx.strokeStyle = CONFIG.DANGER; ctx.globalAlpha = 0.3; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W, ry); ctx.stroke();
    const fx = W * prog;
    ctx.globalAlpha = 0.6 + 0.4 * k; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(fx, ry); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(fx, ry); ctx.stroke();
    ctx.globalAlpha = 1;
    ART.glow(ctx, fx, ry, 46 + prog * 20, CONFIG.DANGER, 0.9);
    // sparks crawling along the charged section
    for (let i = 0; i < 7; i++) {
      const sx = ((i * 233 + pu.t * 700 * (i % 2 ? 1 : -1)) % W + W) % W;
      if (sx > fx + 40) continue;
      ART.glow(ctx, sx, ry + Math.sin(t * 40 + i) * 4, 10 + prog * 14, CONFIG.DANGER, (0.3 + 0.6 * prog) * k);
    }
    ctx.restore();
    // label
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = on ? 1 : 0.45;
    ctx.fillStyle = CONFIG.DANGER;
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('⚠  RAIL CHARGING  ⚠', W / 2, ry + dir * 40);
    // you're on it: big FLIP! callout pointing at the safe rail
    const P = this.game.player;
    const ryP = pu.side > 0 ? CONFIG.RAIL_FLOOR_Y - CONFIG.PLAYER_R : CONFIG.RAIL_CEIL_Y + CONFIG.PLAYER_R;
    if (P && P.alive && Math.abs(P.y - ryP) < CONFIG.PLAYER_R * 1.5) {
      const pop = 1 + 0.15 * Math.sin(t * 24);
      ctx.translate(P.x + 4, P.y + dir * 52);
      ctx.scale(pop, pop);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = CONFIG.DANGER; ctx.shadowBlur = 16;
      ctx.font = '800 26px "Segoe UI", system-ui, sans-serif';
      ctx.fillText((dir < 0 ? '▲' : '▼') + ' FLIP!', 0, 0);
    }
    ctx.restore();
  }
  // faceted gold crystal, spinning, with a glint
  _drawDust(ctx, o, t) {
    const pulse = 0.6 + 0.4 * Math.sin(t * 4 + o.phase);
    ART.glow(ctx, o.x, o.y, o.r * 3.4, CONFIG.REWARD, 0.3 + 0.25 * pulse);
    ctx.translate(o.x, o.y);
    ctx.rotate(Math.sin(t * 1.6 + o.phase) * 0.6);
    const s = o.r * 1.1;
    const faces = [['#fff3c4', 0, -1, 1, 0], ['#ffc44d', 1, 0, 0, 1],
                   ['#b8780f', 0, 1, -1, 0], ['#ffde85', -1, 0, 0, -1]];
    for (const [c, ax, ay, bx, by] of faces) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(ax * s, ay * s * 1.35); ctx.lineTo(bx * s, by * s * 1.35);
      ctx.closePath(); ctx.fill();
    }
    const gl = Math.sin(t * 2.3 + o.phase * 3);
    if (gl > 0.9) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (gl - 0.9) / 0.1;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(9, -3); ctx.moveTo(0, -12); ctx.lineTo(0, 6); ctx.stroke();
    }
  }
  // torn station plating: metal gradient, rivets, a still-glowing hot edge
  _drawDebris(ctx, o, t) {
    const hw = o.w / 2, hh = o.h / 2;
    const baseY = o.y + hh * o.side, tipY = o.y - hh * o.side;
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(o.x - hw, baseY);
      ctx.lineTo(o.x - hw + o.jit[0] * o.w * 0.5, tipY);
      ctx.lineTo(o.x + hw - o.jit[1] * o.w * 0.5, tipY + o.jit[2] * 8 * o.side);
      ctx.lineTo(o.x + hw, baseY);
      ctx.closePath();
    };
    const gr = ctx.createLinearGradient(0, baseY, 0, tipY);
    gr.addColorStop(0, '#0a0e18'); gr.addColorStop(1, '#46526e');
    ctx.fillStyle = gr; path(); ctx.fill();
    ctx.save(); path(); ctx.clip();
    ctx.strokeStyle = 'rgba(170,185,210,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 1; k <= 2; k++) {
      const yy = baseY - o.side * o.h * k * 0.3;
      ctx.moveTo(o.x - hw, yy); ctx.lineTo(o.x + hw, yy + o.jit[3] * 6);
    }
    ctx.stroke();
    ctx.fillStyle = '#6a7690';
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.arc(o.x + k * hw * 0.55, baseY - o.side * 6, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = '#8a93a6'; ctx.lineWidth = 1.4; path(); ctx.stroke();
    const heat = 0.5 + 0.5 * Math.sin(t * 3 + o.phase);
    ART.glow(ctx, o.x - hw + o.jit[0] * o.w * 0.5, tipY, 9 + heat * 5, '#ff7a2a', 0.65);
  }
  // spiked proximity mine: dark alloy shell, pulsing core, danger halo
  _drawMine(ctx, o, t) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 5 + o.phase);
    ART.glow(ctx, o.x, o.y, o.r * 3.6, CONFIG.ACCENT, 0.22 + 0.3 * pulse);
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.phase + t * 0.8);
    ctx.fillStyle = '#3a2140'; ctx.strokeStyle = '#ff9be4'; ctx.lineWidth = 1;
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.2) * o.r * 0.8, Math.sin(a - 0.2) * o.r * 0.8);
      ctx.lineTo(Math.cos(a) * o.r * 1.6, Math.sin(a) * o.r * 1.6);
      ctx.lineTo(Math.cos(a + 0.2) * o.r * 0.8, Math.sin(a + 0.2) * o.r * 0.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const shell = ctx.createRadialGradient(-o.r * 0.35, -o.r * 0.35, 1, 0, 0, o.r);
    shell.addColorStop(0, '#8a6a9a'); shell.addColorStop(0.5, '#2a1830'); shell.addColorStop(1, '#100814');
    ctx.fillStyle = shell;
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ART._alpha(CONFIG.ACCENT, 0.75); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = ART._alpha(CONFIG.ACCENT, 0.3);
    ctx.beginPath(); ctx.arc(0, 0, o.r * 0.62, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ART.glow(ctx, o.x, o.y, o.r * (0.8 + pulse * 0.9), CONFIG.ACCENT, 0.95);
    ctx.fillStyle = '#ffe6f8';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.18, 0, Math.PI * 2); ctx.fill();
  }
  // hostile drones. diver = afterburning dart; shooter = armored gunship
  _drawDrone(ctx, o, t) {
    const diver = o.kind === 'diver', col = diver ? CONFIG.DANGER : CONFIG.ACCENT, r = o.r;
    // engine wash trails behind (to the right: drones fly left)
    ART.glow(ctx, o.x + r * 1.1, o.y, r * (diver ? 2.6 : 1.7), col, diver ? 0.8 : 0.55);
    if (diver) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const len = r * (4 + Math.sin(t * 30 + o.phase));
      const gr = ctx.createLinearGradient(o.x + r * 0.6, 0, o.x + len, 0);
      gr.addColorStop(0, ART._alpha(col, 0.9)); gr.addColorStop(1, ART._alpha(col, 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(o.x + r * 0.6, o.y - r * 0.28); ctx.lineTo(o.x + len, o.y); ctx.lineTo(o.x + r * 0.6, o.y + r * 0.28);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(Math.PI + Math.sin(t * 6 + o.phase) * 0.15);   // nose points left, into the player
    const hull = ctx.createLinearGradient(0, -r, 0, r);
    hull.addColorStop(0, '#3a4468'); hull.addColorStop(0.5, '#141a30'); hull.addColorStop(1, '#05070f');
    ctx.fillStyle = hull; ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (diver) {
      ctx.moveTo(r * 1.4, 0);
      ctx.lineTo(-r * 0.4, -r * 0.5);
      ctx.lineTo(-r * 0.15, -r * 0.18);
      ctx.lineTo(-r * 0.95, 0);
      ctx.lineTo(-r * 0.15, r * 0.18);
      ctx.lineTo(-r * 0.4, r * 0.5);
    } else {
      ctx.moveTo(r * 1.05, 0);
      ctx.lineTo(r * 0.2, -r * 0.55);
      ctx.lineTo(-r * 0.75, -r * 0.9);
      ctx.lineTo(-r * 0.4, -r * 0.2);
      ctx.lineTo(-r * 0.55, 0);
      ctx.lineTo(-r * 0.4, r * 0.2);
      ctx.lineTo(-r * 0.75, r * 0.9);
      ctx.lineTo(r * 0.2, r * 0.55);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = ART._alpha(col, 0.35); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(r * 0.7, 0); ctx.lineTo(-r * 0.4, 0); ctx.stroke();
    if (!diver) {
      // rotating gun ring
      ctx.save();
      ctx.rotate(t * 3 + o.phase);
      ctx.strokeStyle = ART._alpha(col, 0.8); ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.arc(0, 0, r * 0.5, k * 2.094, k * 2.094 + 1.2); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
    // eye core
    ART.glow(ctx, o.x - r * 0.15, o.y, 9 + Math.sin(t * 8 + o.phase) * 2, col, 0.95);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(o.x - r * 0.15, o.y, 2, 0, Math.PI * 2); ctx.fill();
    if (!diver) {
      // firing tell: muzzle charges up as the next shot approaches
      const fa = (o.fireT || 0) / CONFIG.DRONE_SHOOT_S;
      if (fa < 0.35) {
        const k = 1 - fa / 0.35;
        ART.glow(ctx, o.x - r * 1.1, o.y, 6 + k * 20, CONFIG.DANGER, k);
        ctx.globalAlpha = k; ctx.strokeStyle = CONFIG.DANGER; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(o.x, o.y, r + 4 + (1 - k) * 8, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // armor pips
      if (o.hp !== undefined) {
        for (let k = 0; k < o.hp; k++) {
          ctx.fillStyle = CONFIG.ACCENT;
          ctx.fillRect(o.x - 7 + k * 6, o.y - r - 9, 4, 2);
        }
      }
    }
  }
  // station bulkhead: armored plates, hazard edge, blinking warning beacons
  _drawWall(ctx, o, t) {
    const hw = o.w / 2, hh = o.h / 2, x0 = o.x - hw, y0 = o.y - hh;
    const gr = ctx.createLinearGradient(x0, 0, x0 + o.w, 0);
    gr.addColorStop(0, '#0a1020'); gr.addColorStop(0.45, '#22324f'); gr.addColorStop(1, '#070c16');
    ctx.fillStyle = gr; ctx.fillRect(x0, y0, o.w, o.h);
    ctx.strokeStyle = 'rgba(140,190,230,0.16)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let py = y0 + 28; py < y0 + o.h - 10; py += 32) { ctx.moveTo(x0 + 4, py); ctx.lineTo(x0 + o.w - 4, py); }
    ctx.moveTo(o.x, y0 + 4); ctx.lineTo(o.x, y0 + o.h - 4);
    ctx.stroke();
    ctx.fillStyle = 'rgba(140,190,230,0.3)';
    for (let py = y0 + 14; py < y0 + o.h - 6; py += 32) {
      ctx.fillRect(x0 + 5, py, 2, 2); ctx.fillRect(x0 + o.w - 7, py, 2, 2);
    }
    ctx.strokeStyle = '#3aa8c9'; ctx.lineWidth = 2;
    ctx.strokeRect(x0, y0, o.w, o.h);
    // hazard stripes on the face toward the corridor
    const fy = o.side > 0 ? y0 : y0 + o.h;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, fy - 4, o.w, 8); ctx.clip();
    ctx.strokeStyle = CONFIG.DANGER; ctx.globalAlpha = 0.85; ctx.lineWidth = 3;
    for (let sx = -o.w; sx < o.w * 2; sx += 12) {
      ctx.beginPath(); ctx.moveTo(x0 + sx, fy - 6); ctx.lineTo(x0 + sx + 10, fy + 6); ctx.stroke();
    }
    ctx.restore();
    ART.glow(ctx, o.x, fy, o.w * 0.7, CONFIG.DANGER, 0.18);
    const on = Math.floor(t * 3 + o.phase) % 2 === 0, by = fy + (o.side > 0 ? 12 : -12);
    ART.glow(ctx, x0 + 8, by, 13, '#ff3b3b', on ? 0.95 : 0.2);
    ART.glow(ctx, x0 + o.w - 8, by, 13, '#ff3b3b', on ? 0.2 : 0.95);
  }
}

// ---------- Weapons: autofire bullets + charged shot variants ----------
// weapon object shape (grows into the Phase 5 upgrade tree):
//   { tier: 1..3, variant: 'photon'|'pulse'|'void'|'graviton', locked: bool }
// Whole weapon stays OFFLINE until sector >= CONFIG.WEAPON_UNLOCK_LEVEL (user choice:
// unlock after clearing Sector 2). tier >= 2 (granted at unlock) enables hold-charge.
class Weapon {
  constructor(game) {
    this.game = game;
    // tier is DERIVED from run.upgrades[variant] (see getter below) — Phase 7 shop
    this.variant = 'photon';
    this.cool = 0;
    this.locked = true;                  // sector < WEAPON_UNLOCK_LEVEL (synced in reset)
    this.fireHold = { down: false, t: 0, charging: false }; // FIRE-button tap-vs-hold
    this.graceT = 0;                     // release-grace window (see _fireUp)
    this.bullets = new Array(CONFIG.BULLET_POOL).fill(null).map(() => ({ alive: false }));
    this.beams = [];                     // charged shots (rare — small array ok)
    this.shocks = [];                    // pulse blast VFX
    this.ray = null;                     // graviton beam while it fires
    this.gravCool = 0; this.gravCoolMax = 1;
  }
  // derived: charging (and the whole weapon) needs tier>=2 AND sector unlocked
  get chargeEnabled() { return this.tier >= 2 && !this.locked; }
  get tier() {
    const ups = this.game.run && this.game.run.upgrades;
    return ups ? (ups[this.variant] || 0) : 1;
  }
  set tier(v) {   // dev/test path: write through to the shop state
    const ups = this.game.run && this.game.run.upgrades;
    if (ups) ups[this.variant] = clamp(Math.floor(v), 0, UPGRADES[this.variant].max);
  }
  // damage + autofire scaling per weapon tier (T3/T4 branches)
  get dmgMult() {
    const ups = this.game.run && this.game.run.upgrades;
    return TIER_DMG[ups ? (ups[this.variant] || 0) : 2];
  }
  _syncGate() {
    const lvl = (this.game.run && this.game.run.level) || 1;
    this.locked = lvl < CONFIG.WEAPON_UNLOCK_LEVEL;
    const ups = this.game.run && this.game.run.upgrades;
    this.variant = (ups && ups[this.game.run.equipped]) ? this.game.run.equipped : 'photon';
  }
  _allocBullet() {
    for (const b of this.bullets) if (!b.alive) { b.alive = true; return b; }
    return null;
  }
  fire() {                       // autofire photon bolt
    const b = this._allocBullet();
    if (!b) return;
    b.x = this.game.player.x + CONFIG.PLAYER_R;
    b.y = this.game.player.y;
    b.vx = CONFIG.BULLET_SPEED; b.vy = 0;
    b.r = 3.5; b.dmg = CONFIG.BULLET_DMG * this.dmgMult; b.beam = false;
    Snd.play('pew');
  }
  // FIRE-button tap: weak bolt (slower + less damage than the autofire photon)
  fireWeak() {
    if (this.cool > 0) return;
    const b = this._allocBullet();
    if (!b) return;
    b.x = this.game.player.x + CONFIG.PLAYER_R;
    b.y = this.game.player.y;
    b.vx = CONFIG.TAP_BOLT_SPEED; b.vy = 0;
    b.r = 3; b.dmg = CONFIG.TAP_BOLT_DMG; b.beam = false;
    this.cool = CONFIG.TAP_S;
    Snd.play('pew');
  }
  // charged release: spawn per variant (Task 4.4), scaled by the weapon's shop tier
  fireCharged(variant, x, y) {
    const ups = this.game.run && this.game.run.upgrades;
    const t = ups ? (ups[variant] || 0) : 2;
    if (variant === 'graviton') { this._fireGraviton(t); return; }
    Snd.play('beam');
    const dmg = CONFIG.BEAM_DMG * TIER_DMG[t];
    if (variant === 'void') {
      // radial burst of fast pellets
      for (let k = 0; k < CONFIG.SPREAD_N; k++) {
        const b = this._allocBullet(); if (!b) break;
        const a = (k / CONFIG.SPREAD_N) * Math.PI * 2;
        b.x = x; b.y = y;
        b.vx = Math.cos(a) * 620; b.vy = Math.sin(a) * 620;
        b.r = 4; b.dmg = 2 * TIER_DMG[t]; b.beam = false; b.homing = false;
      }
      this.game.shake(0.4);
      this.game.particles.burst(x, y, 18, '#b47cff', 420, 0.5, 3);
    } else {
      // photon: piercing beam bolt | pulse: beam that detonates on impact
      this.beams.push({
        x, y, r: 9,
        vx: CONFIG.BEAM_SPEED,
        pierce: (variant === 'pulse' ? 1 : CONFIG.BEAM_PIERCE) + (t >= 4 ? 2 : 0),
        dmg, variant, alive: true, t: 0,
      });
      this.game.shake(0.5);
      this.game.hitstop = Math.max(this.game.hitstop, 0.05);
    }
  }
  // GRAVITON: release a sustained corkscrew beam (tier sets length/power/width/recharge)
  _fireGraviton(t) {
    const g = this.game, P = g.player;
    t = Math.max(2, t);
    if (this.ray || this.gravCool > 0) {          // still recharging: dud spark
      Snd.play('gravFizzle');
      g.particles.burst(P.x + CONFIG.PLAYER_R + 8, P.y, 6, CONFIG.GRAV_COLOR, 160, 0.25, 1.8);
      return;
    }
    const k = clamp(P.chargeT, 0.5, 1);           // a fuller charge = a fatter beam
    this.ray = { t: 0, dur: GRAV_DUR[t], dps: GRAV_DPS[t], hw: GRAV_HW[t] * (0.8 + 0.2 * k),
                 cool: GRAV_COOL[t], tick: 0, w: 0, x0: P.x, x1: P.x, y: P.y, blocked: false,
                 hist: [{ t: 0, y: P.y }] };
    Snd.gravCharge(false);
    Snd.gravBeam(this.ray.dur);
    g.shake(0.7);
    g.hitstop = Math.max(g.hitstop, 0.06);
    g.particles.burst(P.x + CONFIG.PLAYER_R + 10, P.y, 30, CONFIG.GRAV_COLOR, 520, 0.5, 3);
  }
  cancelRay() {
    if (this.ray) { this.ray = null; Snd.gravBeamStop(); }
  }
  // beam centre height at world x. The beam is light travelling at GRAV_LIGHT,
  // so a point d px out shows where the nose was d/GRAV_LIGHT seconds ago.
  rayY(x) {
    const R = this.ray, h = R.hist;
    const tt = R.t - Math.max(0, x - R.x0) / GRAV_LIGHT;
    if (tt <= h[0].t) return h[0].y;
    for (let i = h.length - 1; i > 0; i--) {
      if (h[i - 1].t <= tt) {
        const a = h[i - 1], b = h[i], f = (tt - a.t) / ((b.t - a.t) || 1);
        return a.y + (b.y - a.y) * clamp(f, 0, 1);
      }
    }
    return h[h.length - 1].y;
  }
  _updateRay(dt, field, boss) {
    const g = this.game, R = this.ray, P = g.player;
    if (!P.alive) { this.cancelRay(); return; }
    R.t += dt;
    // the beam is welded to the ship's nose; flipping WHIPS it across the corridor
    R.x0 = P.x + CONFIG.PLAYER_R + 8; R.y = P.y;
    R.hist.push({ t: R.t, y: P.y });
    while (R.hist.length > 2 && R.hist[1].t < R.t - 0.5) R.hist.shift();
    const yAt = this._yAt || (this._yAt = (x) => this.rayY(x));
    const fade = clamp((R.dur - R.t) / 0.25, 0, 1);       // thins out at the end
    R.w = R.hw * Math.min(1, R.t / 0.08) * (0.35 + 0.65 * fade) * (1 + 0.08 * Math.sin(R.t * 40));
    const reach = Math.min(CONFIG.WORLD_W + 60 - R.x0, GRAV_LIGHT * R.t);   // blasts outward
    const wall = field.rayEnd(R.x0, yAt, R.w);
    R.x1 = Math.min(R.x0 + reach, wall);
    R.blocked = wall <= R.x0 + reach;
    // swallows enemy fire in its path
    field.clearBulletsInBand(R.x0, R.x1, yAt, R.w + 4);
    if (boss && boss.bullets)
      for (const b of boss.bullets)
        if (b.x > R.x0 && b.x < R.x1 && Math.abs(b.y - yAt(b.x)) < R.w + b.r) b.life = 0;
    // damage ticks 10x per second on everything in the band
    R.tick -= dt;
    if (R.tick <= 0) {
      R.tick += 0.1;
      const dmg = R.dps * 0.1, br = CONFIG.BOSS_R * 0.9;
      field.damageBand(R.x0, R.x1, yAt, R.w, dmg);
      if (boss && boss.state === 'fight' && boss.x - br < R.x1) {
        const by = yAt(clamp(boss.x, R.x0, R.x1));
        if (Math.abs(boss.y - by) < R.w + br) boss.hit(boss.x, clamp(boss.y, by - R.w, by + R.w), 1, dmg, null);
      }
    }
    g.shakeTrauma = Math.max(g.shakeTrauma, 0.28);       // rumble while it fires
    if (Math.random() < 0.75)                             // impact sparks
      g.particles.spawn(R.x1, yAt(R.x1) + (Math.random() - 0.5) * R.w * 1.6,
        -120 - Math.random() * 260, (Math.random() - 0.5) * 420, 0.3 + Math.random() * 0.25,
        Math.random() < 0.5 ? CONFIG.GRAV_COLOR : '#ffffff', 1.6 + Math.random() * 1.8, { drag: 0.92 });
    if (R.t >= R.dur) {
      this.gravCool = this.gravCoolMax = R.cool;
      this.ray = null;
      Snd.gravBeamStop();
    }
  }
  update(dt, field, boss) {
    const g = this.game;
    this.graceT = Math.max(0, this.graceT - dt);
    this.gravCool = Math.max(0, this.gravCool - dt);
    if (this.ray) this._updateRay(dt, field, boss);
    // autofire ONLY while the charge ring is full (rewards holding)
    this.cool -= dt;
    if (this.cool <= 0 && g.player.alive && this.chargeEnabled &&
        g.player.chargeT >= 1) {
      this.fire();
      const ups = g.run && g.run.upgrades;
      this.cool = CONFIG.AUTOFIRE_S * TIER_AUTOFIRE[ups ? (ups[this.variant] || 0) : 2];
    }
    else if (this.cool < 0) this.cool = 0;
    // bullets: move, hit obstacles, despawn offscreen
    for (const b of this.bullets) {
      if (!b.alive) continue;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x > CONFIG.WORLD_W + 30 || b.y < -30 || b.y > CONFIG.WORLD_H + 30 || b.x < -30) { b.alive = false; continue; }
      // a bolt is spent on its first hit (was: flew on through every enemy in its row,
      // and re-hit 3hp drones every frame it overlapped them)
      const hopts = { dmg: b.dmg, pierce: 1, bolt: true };
      field.damageCircle(b.x, b.y, b.r, hopts);
      if (hopts.pierce <= 0) { b.alive = false; continue; }
      if (boss && b.alive && boss.hit(b.x, b.y, b.r, b.dmg, null)) b.alive = false;
    }
    // beams travel right, damaging along the way
    for (let i = this.beams.length - 1; i >= 0; i--) {
      const bm = this.beams[i];
      bm.t += dt;
      bm.x += bm.vx * dt;
      bm.seen = bm.seen || new Set();
      const opts = { pierce: bm.pierce, dmg: bm.dmg, seen: bm.seen };
      const destroyed = field.damageCircle(bm.x, bm.y, bm.r, opts);
      if (boss) boss.hit(bm.x, bm.y, bm.r, bm.dmg, bm.seen);
      bm.pierce = opts.pierce;   // write back — pierce is spent, not per-frame
      if (bm.variant === 'pulse' && (destroyed > 0 || opts.blocked)) {   // also detonates on a wall
        // Pulse Lance: expanding shockwave on impact
        field.damageRadius(bm.x, bm.y, CONFIG.SHOCK_RADIUS);
        this.shocks.push({ x: bm.x, y: bm.y, r: 10, max: CONFIG.SHOCK_RADIUS, t: 0 });
        g.shake(0.5);
        bm.alive = false;
      }
      if (!bm.alive || bm.pierce <= 0 || bm.x > CONFIG.WORLD_W + 40) {
        if (bm.variant === 'photon') g.particles.burst(bm.x, bm.y, 10, CONFIG.NEON, 300, 0.3, 2.5);
        this.beams.splice(i, 1);
      }
    }
    // shock VFX
    for (let i = this.shocks.length - 1; i >= 0; i--) {
      const s = this.shocks[i];
      s.t += dt; s.r = 10 + (s.max - 10) * Math.min(1, s.t / 0.25);
      if (s.t > 0.3) this.shocks.splice(i, 1);
    }
  }
  reset() {
    this._syncGate();
    this.fireHold.down = false; this.fireHold.t = 0; this.fireHold.charging = false;
    this.graceT = 0;
    this.cool = 0;
    for (const b of this.bullets) b.alive = false;
    this.beams.length = 0; this.shocks.length = 0;
    this.cancelRay(); this.gravCool = 0;
  }
  render(ctx, t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // bolts: plasma streak + white-hot core + bloom head
    for (const b of this.bullets) {
      if (!b.alive) continue;
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, L = 20;
      ctx.globalAlpha = 0.5; ctx.strokeStyle = CONFIG.NEON; ctx.lineWidth = b.r * 2.2;
      ctx.beginPath(); ctx.moveTo(b.x - ux * L, b.y - uy * L); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#eaffff'; ctx.lineWidth = b.r * 0.8;
      ctx.beginPath(); ctx.moveTo(b.x - ux * L * 0.7, b.y - uy * L * 0.7); ctx.lineTo(b.x, b.y); ctx.stroke();
      ART.glow(ctx, b.x, b.y, b.r * 4.5, CONFIG.NEON, 0.75);
    }
    // charged beams: wide halo, colored body, white core, crackling arcs
    for (const bm of this.beams) {
      const col = bm.variant === 'pulse' ? CONFIG.WARN : (bm.variant === 'void' ? '#b47cff' : CONFIG.NEON);
      // tapered tail: transparent at the back, full colour at the head
      ctx.lineCap = 'butt';
      const tail = ctx.createLinearGradient(bm.x - 130, 0, bm.x, 0);
      tail.addColorStop(0, ART._alpha(col, 0)); tail.addColorStop(1, ART._alpha(col, 0.55));
      ctx.strokeStyle = tail; ctx.lineWidth = bm.r * 2.6;
      ctx.beginPath(); ctx.moveTo(bm.x - 130, bm.y); ctx.lineTo(bm.x + 4, bm.y); ctx.stroke();
      ctx.lineCap = 'round';
      ctx.strokeStyle = col; ctx.globalAlpha = 0.95; ctx.lineWidth = bm.r * 1.2;
      ctx.beginPath(); ctx.moveTo(bm.x - 65, bm.y); ctx.lineTo(bm.x + 8, bm.y); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = bm.r * 0.6;
      ctx.beginPath(); ctx.moveTo(bm.x - 45, bm.y); ctx.lineTo(bm.x + 10, bm.y); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {      // crackling arcs riding the beam
        const sx = bm.x - 90 + k * 22, j = Math.sin(t * 50 + k * 2.3) * bm.r * 1.1;
        ctx.moveTo(sx, bm.y);
        ctx.lineTo(sx + 7, bm.y + j);
        ctx.lineTo(sx + 14, bm.y - j * 0.5);
        ctx.lineTo(sx + 20, bm.y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ART.glow(ctx, bm.x + 8, bm.y, bm.r * 5.5, col, 1);
    }
    // GRAVITON corkscrew: halo, BACK helix strands, beam body + white core, FRONT
    // strands, travelling rings. Back strands under the core and front strands over
    // it is what makes the helix read as wrapping AROUND the beam.
    const Rr = this.ray;
    if (Rr && Rr.x1 > Rr.x0 + 2 && Rr.w > 0.5) {
      const C = CONFIG.GRAV_COLOR, x0 = Rr.x0, x1 = Rr.x1, w = Rr.w;
      const A = w * 1.3, k = 0.045, spin = t * 24, step = 8;
      // sample the (possibly bent) beam centre once per frame
      const xs = [], ys = [];
      for (let x = x0; ; x += step) { const xx = Math.min(x, x1); xs.push(xx); ys.push(this.rayY(xx)); if (xx >= x1) break; }
      const n = xs.length;
      const spine = () => { ctx.beginPath(); ctx.moveTo(xs[0], ys[0]); for (let i = 1; i < n; i++) ctx.lineTo(xs[i], ys[i]); ctx.stroke(); };
      const strands = (front) => {
        ctx.beginPath();
        for (const off of [0, Math.PI]) {
          for (let i = 0; i < n - 1; i++) {
            const ph = (xs[i] - x0) * k - spin + off;
            if ((Math.cos(ph) > 0) !== front) continue;
            const ph2 = ph + (xs[i + 1] - xs[i]) * k;
            ctx.moveTo(xs[i], ys[i] + Math.sin(ph) * A);
            ctx.lineTo(xs[i + 1], ys[i + 1] + Math.sin(ph2) * A);
          }
        }
        ctx.stroke();
      };
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      // soft halo: stacked low-alpha strokes fall off smoothly (no hard box edge)
      ctx.strokeStyle = C;
      for (const [mul, a] of [[5.2, 0.06], [3.8, 0.09], [2.6, 0.14]]) {
        ctx.globalAlpha = a; ctx.lineWidth = w * mul; spine();
      }
      // BACK strands go under the body, FRONT strands over it: reads as wrapping around
      ctx.globalAlpha = 0.45; ctx.lineWidth = 2; strands(false);
      ctx.globalAlpha = 0.9; ctx.lineWidth = w * 1.5; spine();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w * 0.55; spine();
      ctx.globalAlpha = 0.95; ctx.strokeStyle = '#ffd1f7'; ctx.lineWidth = 3; strands(true);
      // rings riding the beam outward
      ctx.globalAlpha = 0.5; ctx.strokeStyle = '#ffd1f7'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 12; i++) {
        const rx = x0 + ((i * 97 + t * 700) % 1164);
        if (rx > x1) continue;
        ctx.beginPath(); ctx.ellipse(rx, this.rayY(rx), w * 0.32, A * 1.05, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // muzzle + impact blooms
      ART.glow(ctx, x0, ys[0], w * 5.5, C, 1);
      ART.glow(ctx, x0, ys[0], w * 2.2, '#ffffff', 0.9);
      const flick = 0.75 + 0.25 * Math.sin(t * 60), ye = ys[n - 1];
      ART.glow(ctx, x1, ye, w * (Rr.blocked ? 6.5 : 4.5) * flick, C, 1);
      if (Rr.blocked) ART.glow(ctx, x1, ye, w * 2.4, '#ffffff', 0.9);
    }
    // shockwaves: bright ring + filled flash
    for (const s of this.shocks) {
      const a = Math.max(0, 1 - s.t / 0.3);
      ART.glow(ctx, s.x, s.y, s.r * 1.1, CONFIG.WARN, a * 0.5);
      ctx.globalAlpha = a; ctx.strokeStyle = CONFIG.WARN; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

// ---------- UI button helper ----------
class Button {
  constructor(label, x, y, w, h, action) {
    this.label = label; this.x = x; this.y = y; this.w = w; this.h = h;
    this.action = action;
    this.hover = false; this.pressT = 0;
  }
  contains(p) {
    return p.x >= this.x && p.x <= this.x + this.w &&
           p.y >= this.y && p.y <= this.y + this.h;
  }
  update(dt) { this.pressT = Math.max(0, this.pressT - dt * 4); }
  render(ctx, t) {
    const glow = this.hover ? 18 : 8;
    const pulse = 0.75 + 0.25 * Math.sin(t * 2.2);
    ctx.save();
    ctx.shadowColor = CONFIG.NEON;
    ctx.shadowBlur = glow * pulse;
    ctx.strokeStyle = this.hover ? CONFIG.NEON : CONFIG.NEON_DIM;
    ctx.lineWidth = this.hover ? 2.5 : 1.5;
    ctx.fillStyle = this.hover ? 'rgba(77,232,255,0.10)' : 'rgba(77,232,255,0.03)';
    const s = this.pressT * 3;
    ctx.beginPath();
    ctx.roundRect(this.x + s, this.y + s, this.w - s * 2, this.h - s * 2, 8);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = this.hover ? '#eaffff' : CONFIG.NEON;
    ctx.font = '600 26px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.label, this.x + this.w / 2, this.y + this.h / 2 + 1);
    ctx.restore();
  }
}

// Photon starts owned at T2 (keeps the Sector-3 unlock promise from Phase 4).

// cost to raise `branch` from current tier to the next (null = maxed/owned)
function upgCost(branch, curTier) {
  const u = UPGRADES[branch];
  return (curTier >= u.max) ? null : u.costs[curTier];
}

function BossDef(sector) {
  const s = clamp(sector, 1, 9);
  const id = BOSS_IDS[s - 1];
  return {
    sector: s, level: s * 5, ...id,
    // capped so the Entity (380 HP, user-final) stays the beefiest enemy
    hp: Math.min(380, 95 + (s - 1) * 42),
    bulletSpeed: 1 + s * 0.055,        // multiplier on every pattern's speed
    pause: Math.max(0.45, 0.95 - s * 0.055),  // breather between patterns
    dustReward: 40 + s * 12,
  };
}

// Pattern library (Task 5.2): radial burst, aimed fan, spiral, sweeping laser
// wall, homing swarm — each parameterized by sector scaling.
class Boss {
  constructor(game, sector) {
    const g = game;
    this.game = g;
    this.def = BossDef(sector);
    this.maxHp = this.def.hp; this.hp = this.def.hp;
    this.x = 1080; this.y = CONFIG.WORLD_H / 2;
    this.state = 'approach';      // approach -> entrance -> fight -> dying
    this.winState = 'level_complete';  // Entity overrides -> 'victory'
    this.t = 0; this.flash = 0;
    this.patternIdx = -1; this.pat = null; this.patT = 0; this.pauseT = 0.6;
    this.laser = null;            // { mode:'warn'|'live', y0, y1, t, hit }
    this.bullets = [];            // boss bullets (own pool — denser than drones)
    this.quota = Math.round(game.levelCfg.quota * 0.45);  // approach length
    this.rnd = mulberry32((game.bossSeed || 1) >>> 0);   // DETERMINISM: seeded per run (replay)
    this.lastHit = null;
    g.shake(0.8);
  }
  // camera lock: clear the field, silence hazards, freeze spawning
  _silenceField() {
    const g = this.game, F = g.field;
    for (const o of F.pool)
      if (o.alive) { o.alive = false; g.particles.burst(o.x, o.y, 6, '#8899aa', 200, 0.4, 2); }
    F.aliveCount = 0;
    F.pulseEnabled = false; F.pulse.state = 'idle';
    for (const b of F.ebullets) b.alive = false;

  _radial() {

  _startPattern() {

  update(dt) {

        } else if (this.pat === 'fan' && this.patT > (0.5 / d.bulletSpeed) && this.fanN < 2) {

  // player collision -> 'hit' (one read per laser sweep)

  // ===== BOSS DEATH CINEMATIC (timeline in REAL seconds since the killing blow) =====

    while (this.chainI < CHAIN.length && e >= CHAIN[this.chainI]) {
      const a = Math.random() * Math.PI * 2, r = R * (0.2 + Math.random() * 0.9);
      const bx = this.x + Math.cos(a) * r, by = this.y + Math.sin(a) * r;

  // world-space death VFX. front=false: under the body (light rays); true: over it
  _renderDeathFx(ctx, t, front) {
