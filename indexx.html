function BossDef(sector) {
  const s = clamp(sector, 1, 9);
  const id = BOSS_IDS[s - 1];
  return {
    sector: s, level: s * 5, ...id,
    // capped so the Entity (380 HP, user-final) stays the beefiest enemy
    hp: Math.min(380, 95 + (s - 1) * 42),
    bulletSpeed: 1 + s * 0.055,        // multiplier on every pattern's speed
    pause: Math.max(0.45, 0.95 - s * 0.055),  // breather between patterns
    dustReward: 40 + s * 12,
  };
}

// Pattern library (Task 5.2): radial burst, aimed fan, spiral, sweeping laser
// wall, homing swarm — each parameterized by sector scaling.
class Boss {
  constructor(game, sector) {
    const g = game;
    this.game = g;
    this.def = BossDef(sector);
    this.maxHp = this.def.hp; this.hp = this.def.hp;
    this.x = 1080; this.y = CONFIG.WORLD_H / 2;
    this.state = 'approach';      // approach -> entrance -> fight -> dying
    this.winState = 'level_complete';  // Entity overrides -> 'victory'
    this.t = 0; this.flash = 0;
    this.patternIdx = -1; this.pat = null; this.patT = 0; this.pauseT = 0.6;
    this.laser = null;            // { mode:'warn'|'live', y0, y1, t, hit }
    this.bullets = [];            // boss bullets (own pool — denser than drones)
    this.quota = Math.round(game.levelCfg.quota * 0.45);  // approach length
    g.shake(0.8);
  }
  // ---- firing (all speeds scale with sector) ----
  _shoot(x, y, ang, speed, opts = {}) {
    if (this.bullets.length >= CONFIG.BOSS_BULLET_CAP) return;
    this.bullets.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
                        r: opts.r || 5, homing: !!opts.homing, life: opts.life || 6 });
  }
  _radial() {
    const d = this.def, n = 10 + d.sector * 2, sp = 150 * d.bulletSpeed;
    const off = Math.random() * Math.PI;
    for (let k = 0; k < n; k++) this._shoot(this.x, this.y, off + k / n * Math.PI * 2, sp);
    this.game.shake(0.25);
  }
  _fan() {
    const d = this.def, P = this.game.player;
    const n = 3 + Math.floor(d.sector / 2), spread = 0.55;
    const base = Math.atan2(P.y - this.y, P.x - this.x);
    const sp = 240 * d.bulletSpeed;
    for (let k = 0; k < n; k++)
      this._shoot(this.x, this.y, base + (k / (n - 1) - 0.5) * spread * 2, sp);
  }
  _spiralShot(ang) { this._shoot(this.x, this.y, ang, 170 * this.def.bulletSpeed); }
  _swarm() {
    const d = this.def, n = 3 + Math.floor(d.sector / 2);
    for (let k = 0; k < n; k++) {
      const a = Math.PI * 0.75 + (Math.random() - 0.5);
      this._shoot(this.x, this.y, a, 130 * d.bulletSpeed, { homing: true, r: 6.5, life: 5 });
    }
    this.game.shake(0.2);
  }
  _laser() {
    // sweeping laser wall: starts on the player's current rail — telegraphed,
    // then sweeps to just short of the opposite rail. Flip to the far rail = safe.
    const P = this.game.player;
    const y0 = P.gravDir > 0 ? CONFIG.RAIL_FLOOR_Y : CONFIG.RAIL_CEIL_Y;
    const y1 = (P.gravDir > 0 ? CONFIG.RAIL_CEIL_Y : CONFIG.RAIL_FLOOR_Y) + (P.gravDir > 0 ? 26 : -26);
    this.laser = { mode: 'warn', y0, y1, t: 0, dur: 0.7, sweep: 0.8 / this.def.bulletSpeed, hit: false };
  }
  _startPattern() {
    const pats = this.def.patterns;
    this.patternIdx = (this.patternIdx + 1) % pats.length;
    const p = pats[this.patternIdx];
    this.pat = p; this.patT = 0; this.spiralA = Math.random() * Math.PI * 2; this.fanN = 0;
    if (p === 'radial') { this.patDur = 0.9; this._radial(); }
    else if (p === 'fan') { this.patDur = 1.1; this._fan(); this.fanN = 1; }
    else if (p === 'spiral') { this.patDur = 1.5; }
    else if (p === 'laser') { this.patDur = 0.1; this._laser(); }
    else if (p === 'swarm') { this.patDur = 0.7; this._swarm(); }
  }
  update(dt) {
    const g = this.game, d = this.def;
    this.t += dt; this.flash = Math.max(0, this.flash - dt);
    // sweep the FULL corridor: rail centers are y=126/594 (±234 of center).
    // This is the aim window — the boss crosses each rail line, and the sine
    // dwells near the extremes (exactly where the player shoots from) longest.
    this.y = CONFIG.WORLD_H / 2 + Math.sin(this.t * 0.9) * 234;
    if (this.state === 'approach') {
      g.scrollMult = 2.6;
      if (g.run.dist >= this.quota) { this.state = 'entrance'; this.cardT = 0; g.shake(0.9); Snd.play('bossIn');
        Snd.setMusicMode(this.fightMusicMode || 'boss'); }
    } else if (this.state === 'entrance') {
      g.scrollMult = 0.9;
      this.cardT += dt;
      if (this.cardT > 1.6) {
        this.state = 'fight';
        g.scrollMult = 0;
        // camera lock: clear the field, silence hazards, freeze spawning
        for (const o of this.game.field.pool)
          if (o.alive) { o.alive = false; g.particles.burst(o.x, o.y, 6, '#8899aa', 200, 0.4, 2); }
        g.field.aliveCount = 0;
        g.field.pulseEnabled = false;
        for (const b of g.field.ebullets) b.alive = false;
      }
    } else if (this.state === 'fight') {
      // pattern sequencer
      if (this.pat) {
        this.patT += dt;
        if (this.pat === 'spiral') {
          this.spiralA += dt * 7.5;
          this._spiralAcc = (this._spiralAcc || 0) + dt;
          const iv = 0.055 / d.bulletSpeed;
          while (this._spiralAcc > iv) { this._spiralAcc -= iv; this._spiralShot(this.spiralA); }
        } else if (this.pat === 'fan' && this.patT > (0.5 / d.bulletSpeed) && this.fanN < 2) {
          this._fan(); this.fanN++;
        } else if (this.pat === 'radial' && this.patT > this.patDur / 2 && !this.radial2) {
          this._radial(); this.radial2 = true;
        }
        if (this.patT > this.patDur) {
          if (this.pat === 'radial') this.radial2 = false;
          this.pat = null; this.pauseT = d.pause;
        }
      } else {
        this.pauseT -= dt;
        if (this.pauseT <= 0) this._startPattern();
      }
      // laser wall
      if (this.laser) {
        const L = this.laser;
        L.t += dt;
        if (L.mode === 'warn' && L.t > L.dur) { L.mode = 'live'; L.t = 0; g.shake(0.4); }
        else if (L.mode === 'live') {
          L.y = L.y0 + (L.y1 - L.y0) * Math.min(1, L.t / L.sweep);
          if (L.t > L.sweep) this.laser = null;
        }
      }
    } else if (this.state === 'dying') {
      this.deathT -= dt;
      if (this.deathT <= 0) {
        g.timeScale = 1;
        if (this.onDeathCleanup) this.onDeathCleanup(g);
        g.sm.to(this.winState, {
          level: g.run.level, dust: g.run.dust,
          bonus: CONFIG.DUST_GOAL_BONUS, boss: true, bossName: d.name,
        });
      }
      return;  // bullets freeze mid-explosion — the burst reads better
    }
    // bullets: homing steer + move + lifetime
    const P = g.player;
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.life -= dt;
      if (b.homing && P.alive) {
        const want = Math.atan2(P.y - b.y, P.x - b.x);
        const have = Math.atan2(b.vy, b.vx);
        let da = want - have;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        const turn = Math.max(-1.8 * dt, Math.min(1.8 * dt, da));
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(have + turn) * sp; b.vy = Math.sin(have + turn) * sp;
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.life <= 0 || b.x < -40 || b.x > CONFIG.WORLD_W + 40 || b.y < -40 || b.y > CONFIG.WORLD_H + 40)
        this.bullets.splice(i, 1);
    }
  }
  // player collision -> 'hit' (one read per laser sweep)
  collide(px, py, pr) {
    if (this.state !== 'fight') return null;
    for (const b of this.bullets) {
      const dx = px - b.x, dy = py - b.y, rr = pr + b.r * CONFIG.HITBOX_FACTOR;
      if (dx * dx + dy * dy < rr * rr) { b.life = 0; return 'hit'; }
    }
    const L = this.laser;
    if (L && L.mode === 'live' && !L.hit) {
      if (Math.abs(py - L.y) < pr * CONFIG.HITBOX_FACTOR + 7) { L.hit = true; return 'hit'; }
    }
    return null;
  }
  // player weapon hits (bullets + pierce-aware beams via shared `seen` set)
  hit(x, y, r, dmg, seen) {
    if (this.state !== 'fight') return false;
    if (seen && seen.has('boss')) return false;
    const dx = x - this.x, dy = y - this.y, rr = r + CONFIG.BOSS_R * 0.9;
    if (dx * dx + dy * dy > rr * rr) return false;
    // consumed only on ACTUAL contact (a travelling beam's seen-set must stay
    // open while it's still in flight — it once marked 'boss' on frame 1,
    // which made charged beams unable to ever hit the boss)
    if (seen) seen.add('boss');
    this.hp -= dmg; this.flash = 0.12;
    this.game.particles.burst(x, y, 8, this.def.color, 320, 0.3, 2.4);
    if (this.hp <= 0) this._die();
    return true;
  }
  _die() {
    const g = this.game, d = this.def;
    this.state = 'dying'; this.deathT = 1.0;
    Snd.play('bigBoom');
    g.timeScale = CONFIG.BOSS_SLOMO;         // slow-mo 0.6x, ~1s
    g.shake(1); g.hitstop = 0.08;
    g.particles.burst(this.x, this.y, 48, d.color, 640, 0.9, 4);
    g.particles.burst(this.x, this.y, 30, CONFIG.WARN, 520, 0.8, 3);
    g.addDust(d.dustReward);
    // lore unlock (persisted; LORE screen lands in Phase 7)
    if (!g.run.lore.includes(d.key)) { g.run.lore.push(d.key); g.saveProgress(); }
  }
  render(ctx, t) {
    if (this.state === 'approach') return;
    const d = this.def, R = CONFIG.BOSS_R;
    // laser wall: telegraph, then a blinding sweep
    const L = this.laser;
    if (L) {
      const y = L.mode === 'warn' ? L.y0 : L.y;
      const live = L.mode === 'live';
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (live) {
        const W = CONFIG.WORLD_W;
        ctx.strokeStyle = CONFIG.WARN;
        ctx.globalAlpha = 0.25; ctx.lineWidth = 44;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.globalAlpha = 0.9; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        for (let x = (t * 1400) % 200; x < W; x += 200) ART.glow(ctx, x, y, 60, CONFIG.WARN, 0.5);
      } else {
        ctx.strokeStyle = d.color; ctx.lineWidth = 2;
        ctx.globalAlpha = Math.floor(t * 12) % 2 ? 0.75 : 0.2;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CONFIG.WORLD_W, y); ctx.stroke();
        ctx.setLineDash([10, 12]); ctx.globalAlpha = 0.3; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, L.y1); ctx.lineTo(CONFIG.WORLD_W, L.y1); ctx.stroke();
      }
      ctx.restore();
    }
    // bullets: additive orbs (cheap enough for 240 on screen)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.bullets) {
      const col = b.homing ? '#ff7ad9' : d.color;
      const rr = b.homing ? b.r + Math.sin(t * 14 + b.life * 9) * 1.5 : b.r;
      ART.glow(ctx, b.x - b.vx * 0.02, b.y - b.vy * 0.02, rr * 2.4, col, 0.35);
      ART.glow(ctx, b.x, b.y, rr * 3, col, 0.85);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, rr * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // body: aura, orbiting halo rings, gradient core, tracking eye
    const col = this.flash > 0 ? '#ffffff' : d.color;
    ctx.save();
    ctx.translate(this.x, this.y);
    ART.glow(ctx, 0, 0, R * 3.4, d.color, 0.4 + 0.15 * Math.sin(t * 2));
    ctx.save();
    ctx.rotate(t * 0.5);
    ctx.strokeStyle = ART._alpha(d.color, 0.55); ctx.lineWidth = 3;
    for (let k = 0; k < 6; k++) {
      ctx.beginPath(); ctx.arc(0, 0, R * 1.6, k * Math.PI / 3, k * Math.PI / 3 + 0.6); ctx.stroke();
    }
    ctx.rotate(-t * 1.3);
    ctx.strokeStyle = ART._alpha(d.color, 0.3); ctx.lineWidth = 1.5;
    for (let k = 0; k < 12; k++) {
      ctx.beginPath(); ctx.arc(0, 0, R * 1.85, k * Math.PI / 6, k * Math.PI / 6 + 0.22); ctx.stroke();
    }
    ctx.restore();
    const body = ctx.createRadialGradient(0, 0, R * 0.1, 0, 0, R * 1.25);
    body.addColorStop(0, ART._alpha(d.color, 0.4));
    body.addColorStop(0.45, 'rgba(16,20,38,0.96)');
    body.addColorStop(1, 'rgba(4,6,14,0.98)');
    ctx.strokeStyle = col; ctx.fillStyle = body; ctx.lineWidth = 3;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    this._shape(ctx, d.shape, t);
    ctx.shadowBlur = 0;
    // battle damage: cracks spread as HP drops
    const dmg = 1 - this.hp / this.maxHp;
    if (dmg > 0.4) {
      ctx.strokeStyle = ART._alpha('#ffb347', 0.35 + 0.4 * dmg); ctx.lineWidth = 1.5;
      const rnd = mulberry32(d.sector * 101);
      ctx.beginPath();
      for (let k = 0; k < Math.floor(dmg * 7); k++) {
        let a = rnd() * Math.PI * 2, rr = R * 0.25;
        ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        for (let s = 0; s < 3; s++) {
          a += (rnd() - 0.5) * 0.8; rr += R * 0.22;
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
      }
      ctx.stroke();
    }
    if (d.key !== 'entity') {
      const P = this.game.player;
      const ea = Math.atan2(P.y - this.y, P.x - this.x);
      const ex = Math.cos(ea) * R * 0.22, ey = Math.sin(ea) * R * 0.22;
      ART.glow(ctx, ex, ey, R * 0.75, col, 0.95);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, R * 0.09, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // entrance name card
    if (this.state === 'entrance') {
      const a = Math.min(1, this.cardT * 2) * Math.min(1, (1.6 - this.cardT) * 3);
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 24;
      ctx.font = '700 54px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(d.name, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 - 40);
      ctx.shadowBlur = 0; ctx.fillStyle = CONFIG.NEON_DIM;
      ctx.font = '600 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(`${d.faction.toUpperCase()} — SECTOR BOSS`, CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 + 4);
      ctx.restore();
    }
  }
  _shape(ctx, s, t) {
    const R = CONFIG.BOSS_R;
    const spin = t * 0.6;
    const poly = (n, r, rot) => {
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        const a = rot + k / n * Math.PI * 2;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    };
    if (s === 0) { poly(6, R, spin); poly(3, R * 0.45, -spin * 2); }                    // hive hex
    else if (s === 1) { poly(4, R, 0); poly(4, R * 0.55, Math.PI / 4); ctx.strokeRect(-R*0.2,-R*0.2,R*0.4,R*0.4); } // legion diamond
    else if (s === 2) {                                                          // choir ring
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let k = 0; k < 5; k++) { const a = spin * 2 + k / 5 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62, 5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, 0, R * 0.3 + Math.sin(t * 4) * 3, 0, Math.PI * 2); ctx.stroke();
    }
    else if (s === 3) { poly(6, R, spin); for (let k = 0; k < 6; k++) { const a = spin + k / 6 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(Math.cos(a) * R * 1.35, Math.sin(a) * R * 1.35, 6, 0, Math.PI * 2); ctx.stroke(); } } // mother + brood
    else if (s === 4) { ctx.fillRect(-R, -R, R * 2, R * 2); ctx.strokeRect(-R, -R, R * 2, R * 2);
      ctx.strokeRect(-R * 0.5, -R * 0.5, R, R);
      ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke(); } // bastion cross
    else if (s === 5) { poly(3, R * 1.15, 0); poly(3, R * 0.7, Math.PI); }             // warlord star
    else if (s === 6) { poly(8, R, spin); poly(4, R * 0.5, spin + Math.PI / 4); }      // resonant octagon
    else if (s === 7) {                                                                // siege
      ctx.strokeRect(-R, -R * 0.7, R * 2, R * 1.4); ctx.fillRect(-R, -R * 0.7, R * 2, R * 1.4);
      ctx.beginPath(); ctx.moveTo(-R * 1.4, 0); ctx.lineTo(-R * 0.6, -R * 0.35); ctx.lineTo(-R * 0.6, R * 0.35);
      ctx.closePath(); ctx.stroke(); }
    else { poly(5, R, spin); poly(5, R * 0.72, -spin * 1.6);                            // umbral herald
      ctx.beginPath(); ctx.arc(0, 0, R * 1.3 + Math.sin(t * 3) * 4, 0, Math.PI * 2); ctx.stroke(); }
  }
  renderBar(ctx) {
    if (this.state === 'approach') return;
    const d = this.def, w = 520, x = (CONFIG.WORLD_W - w) / 2, y = 66;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = d.color;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(d.name + ' — ' + d.faction.toUpperCase(), CONFIG.WORLD_W / 2, y - 8);
    ctx.fillStyle = 'rgba(10,14,28,0.8)';
    ctx.fillRect(x, y, w, 12);
    ctx.fillStyle = d.color;
    ctx.shadowColor = d.color; ctx.shadowBlur = 10;
    ctx.fillRect(x, y, w * clamp(this.hp / this.maxHp, 0, 1), 12);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, 12);
    ctx.restore();
  }
}

// ---------- Phase 6: THE BLACK HOLE ENTITY (level 50) ----------
// Subclasses Boss: same lifecycle (approach -> entrance -> fight -> dying) and
// bullet/laser plumbing, plus:
//  - a gravity-distortion field (game.gravityDistort) that sinusoidally scales
//    and periodically INVERTS the corridor's pull — you must re-time flips
//  - phase shifts at 66% and 33% HP: pattern pool deepens, tempo tightens
//  - screen-wide events: GRAVITY INVERSION and CORE BURST (radial from center)
//  - horizon warp rings rendered behind it; victory routes to the VICTORY state
const ENTITY_DEF = {
  key: 'entity', name: 'THE BLACK HOLE ENTITY', faction: 'IT',
  color: '#b47cff', shape: 9, sector: 10, level: 50,
  hp: 380, bulletSpeed: 1.55, pause: 0.42, dustReward: 400,
  patterns: ['radial', 'fan', 'spiral', 'laser', 'swarm'],
  lore: ''  // filled by LORE_ENTRIES
};

class Entity extends Boss {
  constructor(game) {
    super(game, 9);
    this.def = { ...ENTITY_DEF };
    this.maxHp = ENTITY_DEF.hp; this.hp = ENTITY_DEF.hp;
    this.quota = Math.round(game.levelCfg.quota * 0.4);
    this.winState = 'victory';
    this.fightMusicMode = 'entity';
    this.phase = 1;               // 1 -> 2 (66%) -> 3 (33%)
    this.eventT = 7;              // s until next screen-wide event
    this.event = null;            // { kind:'invert'|'burst', warnT }
    this.distortT = Math.random() * 10;
    game.gravityDistort = 1;
    this.onDeathCleanup = (g) => { g.gravityDistort = 1; };
  }
  _phaseFor(hpFrac) { return hpFrac <= 0.33 ? 3 : (hpFrac <= 0.66 ? 2 : 1); }
  _startPattern() {
    // deeper pool + rarer breaths as phases progress
    const roll = Math.random();
    const pool = this.phase === 1 ? ['radial', 'fan', 'spiral', 'laser']
               : this.phase === 2 ? ['fan', 'spiral', 'swarm', 'laser', 'radial']
               : ['spiral', 'swarm', 'laser', 'radial', 'fan', 'burst-spiral'];
    const p = pool[Math.floor(roll * pool.length)];
    this.pat = (p === 'burst-spiral') ? 'spiral' : p;
    this.patT = 0; this.spiralA = Math.random() * Math.PI * 2; this.fanN = 0;
    this.radial2 = false;
    const fast = this.phase === 3 ? 0.7 : (this.phase === 2 ? 0.85 : 1);
    if (this.pat === 'radial') { this.patDur = 0.9 * fast; this._radial(); }
    else if (this.pat === 'fan') { this.patDur = 1.1 * fast; this._fan(); this.fanN = 1; }
    else if (this.pat === 'spiral') { this.patDur = 1.5 * fast; }
    else if (this.pat === 'laser') { this.patDur = 0.1; this._laser(); }
    else if (this.pat === 'swarm') { this.patDur = 0.7 * fast; this._swarm(); }
  }
  // one bullet volley wider than the sector-9 baseline
  _radial() {
    const d = this.def, n = 14 + this.phase * 4, sp = 150 * d.bulletSpeed;
    const off = Math.random() * Math.PI;
    for (let k = 0; k < n; k++) this._shoot(this.x, this.y, off + k / n * Math.PI * 2, sp);
    this.game.shake(0.3);
  }
  update(dt) {
    super.update(dt);
    if (this.state !== 'fight' || !this.game.player.alive) {
      // outside the fight: distortion idles at normal (also covers dying)
      this.game.gravityDistort = 1;
      return;
    }
    const g = this.game;
    // phase shift check
    const ph = this._phaseFor(this.hp / this.maxHp);
    if (ph !== this.phase) {
      this.phase = ph;
      g.shake(1); g.hitstop = 0.07;
      this.pat = null; this.pauseT = 0.9;   // clear mid-pattern = fair
      this.eventT = Math.min(this.eventT, 2.2);
      g.particles.burst(this.x, this.y, 36, ENTITY_DEF.color, 560, 0.8, 3.5);
      Snd.play('phase');
    }
    // ---- gravity distortion field: base sine + periodic inversion event ----
    this.distortT += dt;
    const base = 0.82 + 0.28 * Math.sin(this.distortT * (0.35 + this.phase * 0.12));
    if (this.event) {
      const E = this.event;
      E.t += dt;
      if (E.kind === 'invert') {
        if (E.t < E.warnT) { g.gravityDistort = base; }         // warning: field wobbles
        else if (E.t < E.warnT + E.dur) {
          g.gravityDistort = -base;                              // wrong-way pull
          if (!E.tick) { E.tick = true; g.shake(0.55); Snd.play('invert'); }
        } else { this.event = null; g.gravityDistort = base; }
      } else if (E.kind === 'burst') {
        if (E.t >= E.warnT && !E.fired) { E.fired = true; this._coreBurst(); g.shake(0.8); Snd.play('bossIn'); }
        if (E.t > E.warnT + 0.4) this.event = null;
        g.gravityDistort = base;
      }
    } else {
      g.gravityDistort = base;
      this.eventT -= dt;
      if (this.eventT <= 0) {
        this.eventT = this.phase === 3 ? 6.5 : (this.phase === 2 ? 8 : 10);
        const invert = Math.random() < 0.62;   // inversion is the signature mechanic
        this.event = invert
          ? { kind: 'invert', t: 0, warnT: 1.05, dur: 1.3 + this.phase * 0.25, tick: false }
          : { kind: 'burst',  t: 0, warnT: 1.0, fired: false };
      }
    }
  }
  _coreBurst() {
    // radial from the CORE of the corridor, not from the body
    const cx = CONFIG.WORLD_W * 0.62, cy = CONFIG.WORLD_H / 2;
    const n = 16 + this.phase * 6, sp = 190 * this.def.bulletSpeed;
    const off = Math.random() * Math.PI * 2;
    for (let k = 0; k < n; k++) this._shoot(cx, cy, off + k / n * Math.PI * 2, sp, { r: 6 });
  }
  render(ctx, t) {
    // horizon warp: concentric distorted arcs behind everything (also during
    // approach — the hole is what the corridor has been running toward)
    const cx = CONFIG.WORLD_W * 0.62, cy = CONFIG.WORLD_H / 2;
    ctx.save();
    const distorting = Math.abs((this.game.gravityDistort || 1)) < 0.95 || (this.game.gravityDistort || 1) < 0;
    for (let ring = 0; ring < 5; ring++) {
      const rr = 70 + ring * 46 + Math.sin(t * 1.3 + ring * 1.7) * (6 + ring * 3);
      ctx.globalAlpha = (0.16 - ring * 0.022) * (this.state === 'fight' ? 1 : 0.55);
      ctx.strokeStyle = ENTITY_DEF.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let a = 0; a <= 64; a++) {
        const ang = a / 64 * Math.PI * 2;
        const wob = Math.sin(ang * 3 + t * 2.2 + ring) * (5 + ring * 2) * (distorting ? 2.2 : 1);
        const x = cx + Math.cos(ang) * (rr + wob), y = cy + Math.sin(ang) * (rr + wob) * 0.9;
        a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#020208';
    ctx.shadowColor = ENTITY_DEF.color; ctx.shadowBlur = 46;
    ctx.beginPath(); ctx.arc(cx, cy, 42 + Math.sin(t * 2) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // event warning banner (invert = screen tint + text; burst = flash ring)
    if (this.event && this.state === 'fight') {
      const E = this.event;
      if (E.t < E.warnT) {
        const blink = Math.floor(t * 10) % 2 ? 0.85 : 0.3;
        ctx.save();
        ctx.globalAlpha = blink;
        ctx.textAlign = 'center';
        ctx.fillStyle = E.kind === 'invert' ? '#b47cff' : CONFIG.WARN;
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
        ctx.font = '700 40px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(E.kind === 'invert' ? '⟲ GRAVITY INVERSION' : '◉ CORE BURST',
                     CONFIG.WORLD_W / 2, 150);
        ctx.restore();
      }
    }
    // inversion field tint while gravity is wrong-way
    if ((this.game.gravityDistort || 1) < 0 && this.state === 'fight') {
      ctx.save();
      ctx.globalAlpha = 0.08 + 0.03 * Math.sin(t * 9);
      ctx.fillStyle = ENTITY_DEF.color;
      ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
      ctx.restore();
    }
    super.render(ctx, t);
  }
  _shape(ctx, s, t) {
    // event-horizon body: black disc + accretion ring + lensing arc
    const R = CONFIG.BOSS_R + 6;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.45, R * (0.5 + 0.14 * Math.sin(t * 1.8)),
                                t * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R * 0.55 + Math.sin(t * 5) * 2, t, t + Math.PI * 1.35); ctx.stroke();
  }
}

// ---------- Phase 8: AUDIO (pure Web Audio synth, zero assets) ----------
// Sfx: tiny one-shot oscillator/noise recipes. Music: an ambient drone whose
// intensity follows the game (menu calm -> patrol -> boss -> entity). Audio
// cannot start before a user gesture (Chrome autoplay policy): everything is
// lazy-created on the first pointerdown/keydown, and every call degrades to
// a silent no-op if Web Audio is unavailable.
const Snd = {
  ac: null, master: null, sfxGain: null, musGain: null,
  sfxVol: 0.8, musVol: 0.6, muted: false,
  last: {},                       // rate-limit map: name -> ac time
  mus: null,                      // { nodes..., mode, step, timer }
  ensure() {
    if (this.ac) return this.ac;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      const ac = new AC();
      this.master = ac.createGain();
      this.sfxGain = ac.createGain();
      this.musGain = ac.createGain();
      this.sfxGain.connect(this.master);
      this.musGain.connect(this.master);
      this.master.connect(ac.destination);
      this.ac = ac;
      this._applyGains();
      this._startMusic();
    } catch (e) { this.ac = null; }
    return this.ac;
  },
  // called from the first real user gesture
  unlock() {
    const ac = this.ensure();
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  },
  _applyGains() {
    if (!this.ac) return;
    const m = this.muted ? 0 : 1;
    this.master.gain.setTargetAtTime(0.9 * m, this.ac.currentTime, 0.05);
    this.sfxGain.gain.setTargetAtTime(this.sfxVol, this.ac.currentTime, 0.05);
    this.musGain.gain.setTargetAtTime(this.musVol * 0.5, this.ac.currentTime, 0.2);
  },
  setVolumes(sfx, mus) {
    this.sfxVol = clamp(sfx, 0, 1); this.musVol = clamp(mus, 0, 1);
    this._applyGains();
  },
  toggleMute() { this.muted = !this.muted; this._applyGains(); return this.muted; },
  // generic one-shot helper: freq sweep env, type, dur, gain, optional noise
  _blip(type, f0, f1, dur, gain, opts = {}) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
    if (opts.detune) {
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      o2.type = type; o2.detune.value = opts.detune;
      o2.frequency.setValueAtTime(f0 * 1.01, t);
      o2.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * 0.99), t + dur);
      g2.gain.setValueAtTime(gain * 0.6, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o2.connect(g2); g2.connect(this.sfxGain);
      o2.start(t); o2.stop(t + dur + 0.02);
    }
  },
  _noise(dur, gain, freq = 800, q = 0.8) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const flt = ac.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = freq; flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.start(t);
  },
  // rate-limits stop an autofire stream from machine-gunning the mixer
  _GATES: { pew: 0.06, boom: 0.05, dust: 0.07, hurt: 0.2, die: 0.5,
            flip: 0.04, beam: 0.1, ui: 0.05, bossIn: 0.4, bigBoom: 0.3,
            phase: 0.4, invert: 0.4, complete: 0.5, victory: 1, riser: 1, impact: 1, zap: 0.3 },
  play(name) {
    const ac = this.ac; if (!ac || this.muted) return;
    const gate = this._GATES[name] || 0.03;
    const now = ac.currentTime;
    if (this.last[name] && now - this.last[name] < gate) return;
    this.last[name] = now;
    this.lastPlayed = name;
    switch (name) {
      case 'flip':   this._blip('triangle', 640, 180, 0.12, 0.22); this._noise(0.09, 0.10, 2400); break;
      case 'pew':    this._blip('square', 880, 240, 0.08, 0.10); break;
      case 'beam':   this._blip('sawtooth', 220, 1400, 0.28, 0.22, { detune: 14 }); this._noise(0.2, 0.14, 3200); break;
      case 'boom':   this._blip('sine', 180, 40, 0.22, 0.35); this._noise(0.18, 0.22, 900); break;
      case 'bigBoom':this._blip('sine', 110, 26, 0.7, 0.5); this._noise(0.6, 0.35, 600); this._blip('triangle', 300, 30, 0.5, 0.2); break;
      case 'hurt':   this._blip('sawtooth', 320, 90, 0.25, 0.3, { detune: -30 }); break;
      case 'die':    this._blip('sawtooth', 420, 40, 0.9, 0.4, { detune: 40 }); this._noise(0.8, 0.4, 1200); break;
      case 'dust':   this._blip('sine', 1240, 1900, 0.07, 0.12); break;
      case 'ui':     this._blip('square', 520, 660, 0.05, 0.08); break;
      case 'bossIn': this._blip('sine', 70, 35, 1.1, 0.5); this._noise(0.9, 0.22, 300); this._blip('sawtooth', 140, 70, 0.8, 0.14); break;
      case 'phase':  this._blip('square', 150, 520, 0.35, 0.2); this._blip('sine', 60, 120, 0.5, 0.35); break;
      case 'invert': this._blip('sine', 900, 120, 0.6, 0.28, { detune: 60 }); this._blip('triangle', 120, 900, 0.6, 0.18); break;
      case 'complete': ['523', '659', '784'].forEach((f, i) => {
                         const ac2 = this.ac; const t = ac2.currentTime + i * 0.11;
                         const o = ac2.createOscillator(), g = ac2.createGain();
                         o.type = 'triangle'; o.frequency.value = +f;
                         g.gain.setValueAtTime(0.16, t);
                         g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
                         o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.32);
                       }); break;
      case 'victory': [392, 523, 659, 784, 1046].forEach((f, i) => {
                         const t = ac.currentTime + i * 0.16;
                         const o = ac.createOscillator(), g = ac.createGain();
                         o.type = 'triangle'; o.frequency.value = f;
                         g.gain.setValueAtTime(0.18, t);
                         g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
                         o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.62);
                       }); break;
      case 'riser': {   // intro: filtered-noise whoosh + climbing saw, peaks right at the impact
        const t = ac.currentTime, d = 1.85, n = Math.floor(ac.sampleRate * d);
        const buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(); src.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.5;
        f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(6500, t + d);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + d * 0.95); g.gain.linearRampToValueAtTime(0, t + d);
        src.connect(f); f.connect(g); g.connect(this.sfxGain); src.start(t);
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(640, t + d);
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(0.07, t + d * 0.95); og.gain.linearRampToValueAtTime(0, t + d);

        this._blip('sawtooth', 1200, 90, 0.3, 0.16, { detune: 30 });
        break;
      case 'impact':   // title lands: sub drop + noise blast + shimmering chord
        this._blip('sine', 95, 28, 1.3, 0.6);
        this._noise(1.1, 0.32, 700);
        this._blip('sawtooth', 220, 55, 0.9, 0.12, { detune: 25 });
        [587.3, 698.5, 880].forEach((f) => this._blip('triangle', f, f * 0.99, 1.6, 0.06));
