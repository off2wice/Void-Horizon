    }
  },

  // rail-charge warning beep: pitch and volume climb as the rail nears going live
  railBeep(prog) {
    if (!this.ac || this.muted) return;
    this._blip('square', 700 + prog * 700, 650 + prog * 650, 0.06, 0.07 + prog * 0.05);
  },
  // ---------- adaptive soundtrack: lookahead step sequencer ----------
  // Epic synthwave in D minor, generated live (still zero assets).
  // 16th-note grid, one chord per bar, 4-bar loop. Layers: kick / snare / hats,
  // filtered saw bass, detuned saw pads, square arp, brass stabs, vibrato lead.
  // Notes are scheduled ~120ms ahead on the AudioContext clock, so timing is
  // sample-accurate — setInterval only wakes the scheduler, never times notes.
  // musicMode: 'off' | 'intro' (pad swell) | 'calm' (menu) | 'play' | 'boss' | 'entity'
  MUSIC: {
    bpm: { intro: 116, calm: 116, play: 132, boss: 144, entity: 150 },
    // [bass root, chord triad] as MIDI notes — one chord per bar
    prog: {
      main:   [[38, [62, 65, 69]], [34, [58, 62, 65]], [41, [60, 65, 69]], [36, [60, 64, 67]]], // Dm Bb F C
      boss:   [[38, [62, 65, 69]], [36, [60, 64, 67]], [34, [58, 62, 65]], [33, [57, 61, 64]]], // Dm C Bb A
      entity: [[38, [62, 65, 69]], [34, [58, 62, 65]], [31, [55, 58, 62]], [33, [57, 61, 64]]], // Dm Bb Gm A
    },
    drums: {
      calm:   { k: 'x.......x.......', s: '........x.......', h: '..x...x...x...x.' },
      play:   { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.' },
      boss:   { k: 'x..x..x.x..x..x.', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx' },
      entity: { k: 'x.x.x..xx.x.x..x', s: '....x..x....x.xx', h: 'xxxxxxxxxxxxxxxx' },
    },
    bass: { calm: 'x.......x.......', play: 'x.x.x.x.x.x.x.x.',
            boss: 'x.xxx.xxx.xxx.xx', entity: 'xxxxxxxxxxxxxxxx' },
  },
  _startMusic() {
    const ac = this.ac; if (!ac || this.mus) return;
    // music bus: a compressor glues drums + bass + pads together
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 8; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    this.musGain.disconnect();
    this.musGain.connect(comp); comp.connect(this.master);
    const bus = ac.createGain(); bus.connect(this.musGain);
    // dotted-8th feedback delay = cheap stadium space for pads / arps / leads
    const send = ac.createGain(), delay = ac.createDelay(1.5), fb = ac.createGain();
    const damp = ac.createBiquadFilter(), wet = ac.createGain();
    damp.type = 'lowpass'; damp.frequency.value = 3000;
    fb.gain.value = 0.32; wet.gain.value = 0.3;
    send.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay);
    damp.connect(wet); wet.connect(bus);
    // one shared second of white noise for every drum hit
    const n = ac.sampleRate, nb = ac.createBuffer(1, n, n), ch = nb.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    this.mus = { mode: 'off', step: 0, nextT: ac.currentTime + 0.1, bus, send, delay, noise: nb };
    this.mus.timer = setInterval(() => this._schedule(), 25);
    this.setMusicMode(this.wantMode || 'calm');
  },
  _schedule() {
    const ac = this.ac, m = this.mus; if (!ac || !m) return;
    const now = ac.currentTime;
    if (m.mode === 'off' || this.muted || ac.state !== 'running') { m.nextT = now + 0.05; return; }
    if (m.nextT < now - 0.1) m.nextT = now + 0.05;   // woke late (background tab): resync, no burst
    while (m.nextT < now + 0.12) {
      this._step(m.mode, m.step, m.nextT);
      m.nextT += 60 / (this.MUSIC.bpm[m.mode] || 120) / 4;
      m.step = (m.step + 1) % 64;
    }
  },
  _step(mode, step, t) {
    const M = this.MUSIC, s = step % 16, bar = step >> 4;
    const prog = M.prog[mode === 'boss' ? 'boss' : mode === 'entity' ? 'entity' : 'main'];
    const [root, triad] = prog[bar];
    const spb = 60 / (M.bpm[mode] || 120), six = spb / 4;
    const fight = mode === 'boss' || mode === 'entity';
    if (mode === 'intro') { if (s === 0) this._pad(t, triad, spb * 4, 0.6); return; }
    if (s === 0) {
      this._pad(t, triad, spb * 4, mode === 'calm' ? 0.9 : 0.7);
      if (bar === 0 && fight) this._crash(t);
    }
    const d = M.drums[mode];
    if (d) {
      if (d.k[s] === 'x') this._kick(t, mode === 'calm' ? 0.6 : 0.95);
      if (d.s[s] === 'x') this._snare(t, mode === 'calm' ? 0.35 : 0.6);
      if (d.h[s] === 'x') this._hat(t, s % 4 === 2 ? 0.16 : 0.08, s % 8 === 6 && mode !== 'calm');
    }
    const bp = M.bass[mode];
    if (bp && bp[s] === 'x') {
      const oct = (mode === 'play' && s % 4 === 2) ? 12 : 0;   // octave pump on the "and"
      this._bass(t, root + oct, mode === 'calm' ? spb * 1.8 : six * 1.6);
    }
    // arp: chord tones climbing — 8ths on the menu, 16ths in action
    if (mode !== 'calm' || s % 2 === 0) {
      const seq = [0, 1, 2, 3, 2, 1, 2, 3];
      const k = seq[(mode === 'calm' ? s / 2 : s) % 8];
      const note = (k === 3 ? triad[0] + 12 : triad[k]) + (mode === 'entity' ? 12 : 0);
      this._pluck(t, note, mode === 'calm' ? 0.09 : 0.06);
    }
    // brass stabs: syncopated chord hits in fights (and on the run's turnaround bar)
    if ((fight || (mode === 'play' && bar === 3)) && (s === 0 || s === 3 || s === 6))
      this._stab(t, triad, six * 2.2);
    // soaring lead: held top note on bars 2 and 4 once the action starts
    if (mode !== 'calm' && s === 0 && bar % 2 === 1) this._lead(t, triad[2] + 12, spb * 3.5);
  },
  _hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); },
  _env(g, t, peak, a, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  _kick(t, v) {
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    this._env(g, t, 0.9 * v, 0.003, 0.32);
    o.connect(g); g.connect(this.mus.bus); o.start(t); o.stop(t + 0.4);
  },
  _noiseHit(t, type, freq, q, peak, dur, send) {
    const ac = this.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.mus.noise;
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    this._env(g, t, peak, 0.002, dur);
    src.connect(f); f.connect(g); g.connect(this.mus.bus);
    if (send) g.connect(this.mus.send);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  _snare(t, v) {
    this._noiseHit(t, 'bandpass', 1900, 0.9, 0.55 * v, 0.16, true);
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    this._env(g, t, 0.35 * v, 0.002, 0.1);
    o.connect(g); g.connect(this.mus.bus); o.start(t); o.stop(t + 0.15);
  },
  _hat(t, v, open) { this._noiseHit(t, 'highpass', 7500, 0.7, v, open ? 0.14 : 0.035, false); },
  _crash(t) { this._noiseHit(t, 'highpass', 5000, 0.5, 0.22, 1.6, true); },
  _bass(t, midi, dur) {
    const ac = this.ac, fr = this._hz(midi);
    const o = ac.createOscillator(), o2 = ac.createOscillator();
    const f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = fr;
    o2.type = 'square'; o2.frequency.value = fr / 2;          // sub weight
    f.type = 'lowpass'; f.Q.value = 7;
    f.frequency.setValueAtTime(1400, t);
    f.frequency.exponentialRampToValueAtTime(220, t + Math.min(dur, 0.25));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.005);
    g.gain.setValueAtTime(0.32, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.mus.bus);
    o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  },
  _pad(t, triad, dur, v) {
    const ac = this.ac, f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.Q.value = 1;
    f.frequency.setValueAtTime(500, t);
    f.frequency.linearRampToValueAtTime(2200, t + dur * 0.5);   // filter swell each bar
    f.frequency.linearRampToValueAtTime(900, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06 * v, t + 0.35);
    g.gain.setValueAtTime(0.06 * v, t + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.3);
    f.connect(g); g.connect(this.mus.bus); g.connect(this.mus.send);
    for (const n of triad) for (const det of [-9, 9]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = this._hz(n - 12); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.35);
    }
  },
  _pluck(t, midi, v) {
    const ac = this.ac, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = this._hz(midi);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.12);
    this._env(g, t, v, 0.003, 0.16);
    o.connect(f); f.connect(g); g.connect(this.mus.bus); g.connect(this.mus.send);
    o.start(t); o.stop(t + 0.22);
  },
  _stab(t, triad, dur) {
    const ac = this.ac, f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(600, t + dur);
    this._env(g, t, 0.13, 0.004, dur);
    f.connect(g); g.connect(this.mus.bus); g.connect(this.mus.send);
    for (const n of [triad[0] - 12, ...triad]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = this._hz(n); o.detune.value = (Math.random() - 0.5) * 14;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  _lead(t, midi, dur) {
    const ac = this.ac, fr = this._hz(midi);
    const o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain();
    const f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = fr;
    lfo.frequency.value = 5.5;                                   // vibrato fades in
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(fr * 0.012, t + dur * 0.4);
    lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 2600; f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.12);
    g.gain.setValueAtTime(0.07, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.mus.bus); g.connect(this.mus.send);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  },
  setMusicMode(mode) {
    this.wantMode = mode;
    if (!this.ac || !this.mus) return;   // applied on unlock via _startMusic
    const m = this.mus;
    if (m.mode === mode) return;
    m.mode = mode;
    // every change lands on a fresh downbeat, so a boss entrance HITS
    m.step = 0;
    m.nextT = Math.max(m.nextT, this.ac.currentTime + 0.04);
    m.delay.delayTime.setTargetAtTime((60 / (this.MUSIC.bpm[mode] || 120)) * 0.75,
                                      this.ac.currentTime, 0.05);
  },
};

// ---------- Title-screen black hole (Interstellar-style, GOLD disk) ----------
// Event horizon + photon ring + edge-on accretion band + lensed light arcing
// over the top and mirrored below — the gif recreated procedurally so it
// matches the game palette, costs zero KB, and animates at 60fps.
// clipHalfW (optional): hard-clips ALL glow to the reserved letter slot so the
// accretion disk never washes out the neighbouring letters (readability fix).
function drawTitleBlackHole(ctx, cx, cy, r, t, clipHalfW) {
  ctx.save();
  ctx.translate(cx, cy);
  if (clipHalfW) {
    ctx.beginPath();
    ctx.rect(-clipHalfW, -cy, clipHalfW * 2, 720 - cy);
    ctx.clip();
  }
  ctx.rotate(-0.32 + Math.sin(t * 0.3) * 0.05);  // fixed dramatic tilt + lazy wobble
  // ghost of the letter, so the title still reads
  ctx.strokeStyle = 'rgba(255,214,140,0.14)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2); ctx.stroke();
  const band = (alpha) => {
    const g = ctx.createLinearGradient(-r * 1.3, 0, r * 1.3, 0);
    g.addColorStop(0,    'rgba(255,190,80,0)');
    g.addColorStop(0.28, `rgba(255,196,90,${0.75 * alpha})`);
    g.addColorStop(0.5,  `rgba(255,244,214,${0.95 * alpha})`);
    g.addColorStop(0.72, `rgba(255,184,72,${0.75 * alpha})`);
    g.addColorStop(1,    'rgba(255,170,60,0)');
    return g;
  };
  // lensed far side of the disk: arcs OVER the top (bright, classic shot)
  ctx.strokeStyle = band(1);
  ctx.lineWidth = r * 0.13;
  ctx.shadowColor = '#ffc85a'; ctx.shadowBlur = 7;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 1.08, r * 0.6, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  // mirrored arc below (dimmer — the "upside-down reflection")
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(0, r * 0.1, r * 1.08, r * 0.6, 0, Math.PI * 1.08, Math.PI * 1.92, true); ctx.stroke();
  ctx.globalAlpha = 1;
  // edge-on accretion band across the middle
  ctx.lineWidth = r * 0.17;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.2, r * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
  // MAGENTA SWIRL: spiral streaks orbiting the disk — matter being dragged in.
  // Drawn in the disk's squashed plane (y *= 0.28/1.2) so they read as edge-on,
  // and modulated so streaks behind the hole fade out.
  {
    const sq = 0.28 / 1.2;                          // disk squash ratio
    const swirl = (phase, rr, alpha) => {
      ctx.strokeStyle = `rgba(255,77,210,${alpha})`;
      ctx.shadowColor = '#ff4dd2'; ctx.shadowBlur = 6;
      ctx.lineWidth = Math.max(1.2, r * 0.05);
      ctx.beginPath();
      for (let k = 0; k <= 14; k++) {
        const f = k / 14;                            // along the streak
        const ang = phase + f * 1.9;                 // spiral sweep
        const rad = rr * (1 - f * 0.34);             // spirals inward
        const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad * sq;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    for (let s = 0; s < 3; s++) {
      const ph = t * 1.9 + s * (Math.PI * 2 / 3);    // orbit speed
      const front = Math.sin(ph) > 0;                // in front of the hole?
      swirl(ph, r * (1.24 - s * 0.06), front ? 0.75 : 0.22);
    }
    ctx.shadowBlur = 0;
  }
  // orbiting flare pip riding the band
  const a = t * 1.4;
  const fx = Math.cos(a) * r * 1.2, fy = Math.sin(a) * r * 0.28;
  ctx.globalAlpha = fy > 0 ? 1 : 0.35;           // behind the hole when up
  ctx.fillStyle = '#fff6e0';
  ctx.shadowColor = '#ffdf9a'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(fx, fy, r * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // event horizon (the dark itself)
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000104';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.fill();
  // photon ring — the one absolutely sharp thing
  ctx.strokeStyle = 'rgba(255,250,235,0.95)';
  ctx.lineWidth = Math.max(1.5, r * 0.045);
  ctx.shadowColor = '#ffd98a'; ctx.shadowBlur = 6 + 3 * Math.sin(t * 2);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ---------- Game ----------
class Game {
  constructor(canvasEl) {
    this.gc = new GameCanvas(canvasEl);
    this.sm = new StateMachine(this);
    this.starfield = new Starfield();
    this.particles = new ParticleSystem(500);
    this.time = 0;
    this.scrollMult = 1;
    this.shakeTrauma = 0;
    this.hitstop = 0;
    this.gravityDistort = 1;    // Phase 6 Entity field: 1 = normal, <0 = wrong-way pull
    // persistent run progress (localStorage) + per-run scratch
    this.run = this._loadProgress();
    // Phase 8: apply saved audio prefs (context itself waits for a gesture)
    Snd.sfxVol = this.run.audio.sfx; Snd.musVol = this.run.audio.mus; Snd.muted = this.run.audio.muted;
    this.summary = null;
    this.deathTimer = 0;
    this.boss = null;
    this.timeScale = 1;
    this._bindInput(canvasEl);
    this._registerStates();
    // debug/test harnesses skip the tap-to-engage boot screen
    this.sm.to(DEBUG ? 'menu' : 'boot');
  }
  _loadProgress() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem('void-horizon-save') || '{}'); } catch (e) {}
    return {
      unlocked: clamp(p.unlocked || 1, 1, CONFIG.TOTAL_LEVELS),
      dustTotal: p.dustTotal || 0,
      lore: Array.isArray(p.lore) ? p.lore : [],   // boss keys killed (Phase 7 LORE screen)
      // Phase 7 upgrades: photon starts owned at T2 (the Sector-3 unlock promise);
      // everything else starts at 0. Corrupt/partial saves fall back to defaults.
      upgrades: (() => {
      const d = { photon: 2, pulse: 0, void: 0, magnet: 0, hull: 0, charge: 0 };
      const src = (p.upgrades && typeof p.upgrades === 'object') ? p.upgrades : {};
      for (const k of Object.keys(d))
        d[k] = clamp(Math.floor(src[k] === undefined ? d[k] : src[k]), 0, UPGRADES[k].max);
      // migration: any weapon stuck at T1 (old shop sold it — no autofire/charge,
      // "gun stopped working" bug) is raised to T2 for free
      for (const k of Object.keys(d))
        if (UPGRADES[k].weapon && d[k] === 1) d[k] = 2;
      return d;
      })(),
      equipped: (UPGRADES[p.equipped] && UPGRADES[p.equipped].weapon && p.equipped) || 'photon',
      // Phase 8: audio prefs (volumes + mute persist with the save)
      audio: (() => {
        const a = (p.audio && typeof p.audio === 'object') ? p.audio : {};
        return { sfx: clamp(a.sfx === undefined ? 0.8 : a.sfx, 0, 1),
                 mus: clamp(a.mus === undefined ? 0.6 : a.mus, 0, 1),
                 muted: !!a.muted };
      })(),
      level: 1, dist: 0, dust: 0,   // per-run scratch
    };
  }
  // Dust banks the INSTANT it's earned: dying, quitting or closing the tab never
  // loses any — the only way dust leaves the inventory is spending it in UPGRADES.
  // run.dust still counts this run's haul for the end-of-run screens.
  addDust(n) {
    this.run.dust += n;
    this.run.dustTotal = (this.run.dustTotal || 0) + n;
    const now = performance.now();
    if (!(now - (this._lastSave || 0) < 1500)) { this._lastSave = now; this.saveProgress(); }
    else this._saveDirty = true;
  }
  saveProgress() {
    this._saveDirty = false;
    try {
      localStorage.setItem('void-horizon-save', JSON.stringify({
        unlocked: this.run.unlocked, dustTotal: this.run.dustTotal, lore: this.run.lore,
        upgrades: this.run.upgrades, equipped: this.run.equipped, audio: this.run.audio,
      }));
    } catch (e) {} // private-mode etc. — game still plays, just no persistence
  }
  shake(amount) { this.shakeTrauma = Math.min(1, this.shakeTrauma + amount); }

  _bindInput(canvasEl) {
    const emit = (type, ev) => {
      if (ev && ev.preventDefault) ev.preventDefault();
      let p = null;
      if (ev && 'clientX' in ev) {
        p = this.gc.toWorld(ev.clientX, ev.clientY);
        p.id = ev.pointerId;   // multi-touch: states can tell fingers apart
      }
      this.sm.input(type, p);
    };
    // fullscreen toggle swallows taps in its corner before any state sees them
    // (iOS/Android require a user-gesture tap to enter fullscreen)
    const inFsBtn = (p) => {
      if (!p) return false;
      const b = CONFIG.FS_BTN;
      return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 10) ** 2;
    };
    const rawEmit = emit;
    const emit2 = (type, ev) => {
      if (ev && 'clientX' in ev) {
        const p = this.gc.toWorld(ev.clientX, ev.clientY);
        if (type === 'down' && inFsBtn(p)) { this.toggleFullscreen(); return; }
      }
      rawEmit(type, ev);
    };
    canvasEl.addEventListener('pointerdown', (e) => { Snd.unlock(); emit2('down', e); }, { passive: false });
    canvasEl.addEventListener('pointerup',   (e) => emit('up', e),   { passive: false });
    // the OS can steal a touch (edge swipe, notification): treat it as a release so
    // the FIRE finger can't get stuck down with charge + autofire running forever
    canvasEl.addEventListener('pointercancel', (e) => emit('up', e), { passive: false });
    canvasEl.addEventListener('pointermove', (e) => emit('move', e), { passive: false });
    window.addEventListener('keydown', (ev) => {
      Snd.unlock();   // keyboard counts as the Chrome autoplay gesture too
      if ((ev.code === 'Space' || ev.code === 'Enter') && !ev.repeat) { ev.preventDefault(); this.sm.input('down', null); }
      else if ((ev.code === 'KeyF' || ev.code === 'KeyJ' || ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') && !ev.repeat) {
        ev.preventDefault(); this.sm.input('fire', null);
      }
      else if ((ev.code === 'Escape' || ev.code === 'KeyP') && !ev.repeat) { ev.preventDefault(); this.sm.input('esc', null); }
    });
    // switching apps / locking the phone / changing tabs auto-pauses a run
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.sm.input('blur', null);
    });
    window.addEventListener('keyup', (ev) => {
      if (ev.code === 'Space' || ev.code === 'Enter') { ev.preventDefault(); this.sm.input('up', null); }
      else if (ev.code === 'KeyF' || ev.code === 'KeyJ' || ev.code === 'ShiftLeft' || ev.code === 'ShiftRight') {
        ev.preventDefault(); this.sm.input('fireup', null);
      }
    });
  }

  _registerStates() {
    // ----- MENU -----
    // Phase 8: volume sliders (bottom-left of menu; drag = set, release = save)
    const AUDIO_UI = {
      sfx:  { x: 70, y: 616, w: 170 },
      mus:  { x: 70, y: 656, w: 170 },
      mute: { x: 70, y: 692, w: 170, h: 26 },
      drag: null,   // 'sfx' | 'mus' | null
    };
    function audioHit(p, s) {
      return p.x >= s.x - 12 && p.x <= s.x + s.w + 12 &&
             p.y >= s.y - 14 && p.y <= s.y + 14;
    }
    function audioSet(kind, p, game) {
      const s = AUDIO_UI[kind];
      const v = clamp((p.x - s.x) / s.w, 0, 1);
      if (kind === 'sfx') {
        game.run.audio.sfx = v; Snd.setVolumes(v, game.run.audio.mus);
        if (!Snd.ac) Snd.unlock();       // dragging a slider counts as the gesture
      } else {
        game.run.audio.mus = v; Snd.setVolumes(game.run.audio.sfx, v);
        if (!Snd.ac) Snd.unlock();
      }
    }
    // ----- BOOT ("tap to engage") -----
    // Browsers block audio until a user gesture, so the cinematic intro waits
    // for one tap: that tap unlocks Web Audio, fires the riser, and starts the
    // menu's dissolve-in with the soundtrack in sync.
    const boot = {
      go: false,
      onEnter(game) { game.buttons = []; boot.go = false; Snd.setMusicMode('off'); },
      input(game, type) {
        if (boot.go || (type !== 'down' && type !== 'fire')) return;
        boot.go = true;
        Snd.unlock();
        Snd.play('riser');
        game.sm.to('menu', { intro: true });
      },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.save();
        ctx.fillStyle = '#000';                     // pure black: the dissolve starts from here
        ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
        ctx.textAlign = 'center';
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 3);
        ctx.fillStyle = CONFIG.NEON;
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 16;
        ctx.font = '600 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('▸  TAP TO ENGAGE  ◂', CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
        ctx.globalAlpha = 0.4; ctx.shadowBlur = 0;
        ctx.font = '400 16px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('sound on  ·  headphones recommended', CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2 + 40);
        ctx.restore();
      },
    };

    // ----- MENU -----
    // Intro timeline (first launch only, after the boot tap):
    //   0.0–1.4s  black screen dissolves cell-by-cell from the centre (cyan burn edge)
    //   0.55s+    title letters materialise one by one (rise + glow flare)
    //   1.9s      IMPACT: black hole snaps in, flash + shockwave + particles,
    //             soundtrack drops from the pad swell into the full menu theme
    //   2.0–3.0s  subtitle, buttons, audio controls fade/slide in
    // Coming back to the menu later is just a quick 0.35s fade.
    const INTRO_LEN = 3.0, INTRO_IMPACT = 1.9;
    const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);              // ease-out cubic
    const easeBack = (x) => { x = clamp(x, 0, 1); const c = 1.7;          // overshoot pop
      return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    const DISSOLVE = (() => { const r = mulberry32(4242), a = [];          // fixed noise mask
      for (let i = 0; i < 40 * 23; i++) a.push(r()); return a; })();
    const menu = {
      onEnter(game, payload) {
        const full = !!(payload && payload.intro);
        game.menuIntro = { t: full ? 0 : INTRO_LEN, full, impact: !full,
                           fade: full ? 0 : 0.35, flash: 0, ringT: 9, holeX: 0 };
        Snd.setMusicMode(full ? 'intro' : 'calm');
        const start = game.run.unlocked;
        game.buttons = [
          new Button(start > 1 ? `PLAY — SECTOR ${start}` : 'PLAY', 490, 360, 300, 62,
            () => game.sm.to('playing', { level: start })),
          new Button('UPGRADES', 490, 440, 300, 62, () => game.sm.to('upgrades')),
          new Button('LORE', 490, 520, 300, 62, () => game.sm.to('lore')),
        ];
      },
      _impact(game) {
        const I = game.menuIntro;
        I.impact = true; I.flash = 1; I.ringT = 0;
        Snd.play('impact');
        Snd.setMusicMode('calm');                     // the drop: full menu theme kicks in
        game.shake(0.7);
        const hx = I.holeX || CONFIG.WORLD_W / 2;
        game.particles.burst(hx, 232, 60, '#ffc85a', 720, 1.0, 3.5);
        game.particles.burst(hx, 232, 30, CONFIG.ACCENT, 520, 0.9, 3);
      },
      input(game, type, p) {
        const I = game.menuIntro;
        if (I && I.t < INTRO_LEN) {                   // intro playing: a tap skips to the end
          if (type === 'down') { I.t = INTRO_LEN; if (!I.impact) menu._impact(game); }
          return;
        }
        if (type === 'move' && p && AUDIO_UI.drag) { audioSet(AUDIO_UI.drag, p, game); return; }
        if (type === 'move') {
          for (const b of game.buttons) b.hover = b.contains(p);
        } else if (type === 'down' && p) {
          if (audioHit(p, AUDIO_UI.sfx)) { AUDIO_UI.drag = 'sfx'; audioSet('sfx', p, game); return; }
          if (audioHit(p, AUDIO_UI.mus)) { AUDIO_UI.drag = 'mus'; audioSet('mus', p, game); return; }
          if (p.x >= AUDIO_UI.mute.x - 12 && p.x <= AUDIO_UI.mute.x + AUDIO_UI.mute.w + 12 &&
              p.y >= AUDIO_UI.mute.y - 14 && p.y <= AUDIO_UI.mute.y + AUDIO_UI.mute.h) {
            game.run.audio.muted = Snd.toggleMute(); game.saveProgress(); return;
          }
          for (const b of game.buttons) {
            if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          }
        } else if (type === 'up' && !p) {
          if (AUDIO_UI.drag) { AUDIO_UI.drag = null; game.saveProgress(); return; }
          game.sm.to('playing', { level: game.run.unlocked }); // keyboard Enter/Space starts
        } else if (type === 'up' && p && AUDIO_UI.drag) {
          AUDIO_UI.drag = null; game.saveProgress(); return;
        } else if (type === 'esc') {
          game.sm.to('menu'); // harmless
        }
      },
      update(game, dt) {
        const I = game.menuIntro;
        if (I.t < INTRO_LEN) I.t += dt;
        if (!I.impact && I.t >= INTRO_IMPACT) menu._impact(game);
        I.fade = Math.max(0, I.fade - dt);
        I.flash = Math.max(0, I.flash - dt * 2.5);
        I.ringT += dt;
        for (const b of game.buttons) b.update(dt);
      },
      render(game, rc) {
        const ctx = rc, t = game.time, I = game.menuIntro;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 84px "Segoe UI", system-ui, sans-serif';
        // draw the title letter-by-letter, swapping the O in VOID for a live black hole.
        // Accretion band half-width is r*1.32 = 0.73 letter-widths, so 1.8x
        // advance keeps clearance per side without a visual chasm.
        const title = 'VOID HORIZON';
        const tw = ctx.measureText(title).width + ctx.measureText('O').width * 0.8;
        let lx = CONFIG.WORLD_W / 2 - tw / 2;
        ctx.textAlign = 'left';              // per-glyph advance needs LEFT
        let holeDone = false, idx = 0;
        for (const ch of title) {
          const cw = ctx.measureText(ch).width;
          const start = 0.55 + idx * 0.07;   // staggered materialise
          idx++;
          if (ch === 'O' && !holeDone) {
            holeDone = true;
            const hx = lx + cw * 0.9;
            I.holeX = hx;
            // the hole snaps in with an overshoot right on the impact beat
            const hr = cw * 0.55 * (I.impact ? 1 : easeBack((I.t - (INTRO_IMPACT - 0.25)) / 0.25));
            // clipped to the reserved O slot so the glow can't wash out D and I
            if (hr > 0.5) drawTitleBlackHole(ctx, hx, 260 - 28, hr, t, cw * 0.9);
            lx += cw * 1.8;
          } else {
            const a = ease((I.t - start) / 0.5);
            if (a > 0) {
              ctx.save();
              ctx.globalAlpha = a;
              ctx.shadowColor = CONFIG.NEON;
              ctx.shadowBlur = 24 + 10 * Math.sin(t * 1.5) + (1 - a) * 50;   // flares as it forms
              ctx.fillText(ch, lx, 260 + (1 - a) * 28);
              ctx.restore();
            }
            lx += cw;
          }
        }
        ctx.textAlign = 'center';
        ctx.globalAlpha = ease((I.t - 1.95) / 0.5);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('DUAL-GRAVITY PROTOCOL // SECTOR WAR', CONFIG.WORLD_W / 2, 315);
        ctx.restore();

        // impact shockwave ring + particles
        if (I.ringT < 0.7) {
          ctx.save();
          ctx.globalAlpha = 1 - I.ringT / 0.7;
          ctx.strokeStyle = '#ffc85a'; ctx.shadowColor = '#ffc85a'; ctx.shadowBlur = 20;
          ctx.lineWidth = 6 * (1 - I.ringT / 0.7) + 1;
          ctx.beginPath(); ctx.arc(I.holeX, 232, 40 + ease(I.ringT / 0.7) * 700, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
        game.particles.render(ctx);

        // buttons slide up + fade in, staggered
        game.buttons.forEach((b, i) => {
          const a = ease((I.t - 2.1 - i * 0.13) / 0.45);
          if (a <= 0) return;
          ctx.save();
          ctx.globalAlpha = a;
          ctx.translate(0, (1 - a) * 24);
          b.render(ctx, t);
          ctx.restore();
        });

        // Phase 8: SFX / Music sliders + MUTE (bottom-left)
        const a = game.run.audio;
        ctx.save();
        ctx.globalAlpha = ease((I.t - 2.5) / 0.5);
        ctx.textAlign = 'left';
        ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
        for (const [label, s, v] of [['SFX', AUDIO_UI.sfx, a.sfx], ['MUSIC', AUDIO_UI.mus, a.mus]]) {
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.fillText(label, s.x, s.y - 10);
          ctx.strokeStyle = 'rgba(77,232,255,0.45)';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.w, s.y); ctx.stroke();
          ctx.fillStyle = a.muted ? 'rgba(77,232,255,0.3)' : CONFIG.NEON;
          ctx.beginPath(); ctx.arc(s.x + s.w * v, s.y, 7, 0, Math.PI * 2); ctx.fill();
        }
        const mu = AUDIO_UI.mute;
        ctx.strokeStyle = a.muted ? CONFIG.WARN : 'rgba(77,232,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(mu.x, mu.y - 9, mu.w, mu.h);
        ctx.fillStyle = a.muted ? CONFIG.WARN : CONFIG.NEON_DIM;
        ctx.fillText(a.muted ? 'AUDIO: MUTED' : 'AUDIO: ON', mu.x + 10, mu.y + 9);
        ctx.restore();

        // DISSOLVE: the black screen breaks apart cell-by-cell (seeded noise mask,
        // centre clears first) with a cyan "burn" on cells about to vanish
        if (I.full && I.t < 1.45) {
          const p = ease(I.t / 1.4), cs = 32;
          ctx.save();
          for (let gy = 0, k = 0; gy < 23; gy++) {
            for (let gx = 0; gx < 40; gx++, k++) {
              const r = DISSOLVE[k] * 0.85 + (Math.abs(gx - 19.5) / 19.5) * 0.15;
              if (r <= p) continue;
              ctx.fillStyle = r - p < 0.05 ? 'rgba(77,232,255,0.55)' : '#000';
              ctx.fillRect(gx * cs, gy * cs, cs + 1, cs + 1);
            }
          }
          ctx.restore();
        }
        // impact flash / quick return fade
        if (I.flash > 0 || I.fade > 0) {
          ctx.save();
          if (I.flash > 0) {
            ctx.globalAlpha = I.flash * 0.35; ctx.fillStyle = '#eaffff';
            ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          }
          if (I.fade > 0) {
            ctx.globalAlpha = I.fade / 0.35; ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          }
          ctx.restore();
        }
      },
    };

    // ----- LORE ARCHIVE (real screen: dossier list + reader pane) -----
    // The narrator is the ship's log; ~~struck text~~ renders as real strikethrough
    // (the log editing itself), ██ is just a redaction glyph.
    const LORE_PROLOGUE = {
      key: 'prologue', title: 'PROLOGUE // WHO IS FLYING', faction: '',
      text: "LOG // this ship has no registered pilot. the seat sensors ~~report a heartbeat~~ read ambient. " +
            "the contract that funds this corridor run was issued by an office that ~~closed~~ never existed. " +
            "the cargo hold pays in dust, the dust buys fire, the fire buys the next sector. " +
            "i do not remember enlisting. i do not remember ~~the first nine deaths~~ most of the first nine deaths. " +
            "the corridor is old — older than the factions swarming it — and it slopes downward, " +
            "gently, the way a drain slopes. everything out here is falling. " +
            "i am simply the only one falling ~~on purpose~~ with the guns on.",
    };
    const LORE_EPILOGUE = {
      key: 'entity', title: 'EPILOGUE // IT', faction: 'THE BLACK HOLE',
      lock: g => g.run.lore.includes('entity'),
      text: "LOG // nine fires out. the corridor is quiet in a way it has never been — not silent, " +
            "settled, like a machine that stopped being wound. the hole at the end does not rage anymore. " +
            "it was never a throne and never a god. it was a ~~door~~ a drain, and the factions were " +
            "not its priests, only the silt that gathered where the current slowed. " +
            "i killed nine of its fevers and called it a war. " +
            "the horizon is thin here. the log keeps editing itself faster now, as if ~~we~~ i am running out of pages. " +
            "i am going to fly in and file one last entry, and if this entry ends mid-sentence, " +
            "understand that the sentence is not wh",
    };
    function loreEntries(game) {
      const list = [LORE_PROLOGUE];
      for (const f of LORE_FACTIONS) {
        list.push({ key: 'f_' + f.id, title: f.title, faction: f.faction,
                    text: f.text, lock: f.lock });
      }
      list.push(LORE_EPILOGUE);
      return list;
    }
    // faction dossiers: header prose + the boss entries they dropped
    const LORE_FACTIONS = [
      { id: 'corridor', title: 'THE CORRIDOR', faction: 'THE ARENA', lock: () => true,
        text: "LOG // nobody built the corridor. survey drones agree on one thing: the rails are older " +
              "than every faction that crawls on them. it runs ~50 sectors and every one of them tilts " +
              "a degree more toward the hole. gravity here is not law, it is ~~suggestion~~ drainage. " +
              "the factions did not choose this war. they chose the high ground in a drain." },
      { id: 'vexill', title: 'VEXILL HIVE', faction: 'THE FEEDER', lock: g => g.run.lore.includes('vexill'),
        text: "LOG // the Hive came first and will come last — billions of insectile drones grown around " +
              "a breeding mind, seeded down the corridor like bait. they do not hold territory. they grow " +
              "toward the hole and eat what blocks them. two gardeners fell to us: Krixtha, then Hive-Mother Ossu. " +
              "the garden ~~stopped growing~~ kept growing either way." },
      { id: 'korvaati', title: 'KOR-VAATI LEGION', faction: 'THE BLADE', lock: g => g.run.lore.includes('korvaati'),
        text: "LOG // the Legion fights like it is being graded: aimed volleys, telegraphed sweeps, contempt " +
              "for cover. they believe the corridor is a proving ground and the hole is the honor roll at the " +
              "bottom of it. Vaal Kor-Sun saluted us. Kaalen-Vaa fused captured laser tech into the Legion " +
              "volley — heresy, and effective. the Legion mourned her the way you mourn a blade that cut you." },
      { id: 'nethys', title: 'NETHYS CHOIR', faction: 'THE HYMN', lock: g => g.run.lore.includes('nethys'),
        text: "LOG // the Choir sings in fire. their spiral litanies are precise enough to engrave hull plate, " +
              "and they insist the corridor is a pipe organ — that gravity is the note and every ship that " +
              "falls in is ~~acoustics~~ an offering. the Chorus fell, then Resonant Vael sang her own requiem " +
              "over her sinking core. our recorders still catch the harmonics three sectors out. the cats hate that frequency." },
      { id: 'drathis', title: 'DRATHIS COMPACT', faction: 'THE INVOICE', lock: g => g.run.lore.includes('drathis'),
        text: "LOG // the Compact sell war by the kilogram and have never once fought it personally. " +
              "Bastion DR-9 was a demo unit. Siege Engine TH-0 was their last invoice: a platform that " +
              "paid for itself by never being allowed to lose. they call the corridor a test range " +
              "~~leased by whom~~ and every kill we made was data they were paying to collect. we returned TH-0 to sender, restocked as debris." },
      { id: 'umbral', title: 'UMBRAL COURT', faction: 'THE COURIERS', lock: g => g.run.lore.includes('umbral'),
        text: "LOG // the Court claims to speak for what waits past the dark. the Herald carried every " +
              "faction's fire like samples — all styles, no loyalty. it was not a commander. it was a " +
              "~~priest~~ messenger, and the message was the same one the corridor has been posting for a " +
              "thousand years: everything in the drain arrives at the drain. the Black Hole at the end " +
              "is its destination, not its throne." },
    ];
    function wrapLog(text, max) {
      const words = text.split(' '); const lines = []; let cur = '';
      for (const w of words) {
        if ((cur + ' ' + w).trim().length > max) { lines.push(cur.trim()); cur = w; }
        else cur += ' ' + w;
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }
    const lore = {
      selected: null,
      onEnter(game) {
        lore.selected = LORE_PROLOGUE;
        game.buttons = [ new Button('BACK', 1010, 60, 120, 44, () => game.sm.to('menu')) ];
      },
      input(game, type, p) {
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); return; }
        if (type === 'esc') { game.sm.to('menu'); return; }
        if (type === 'down' && p) {
          for (const b of game.buttons)
            if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          // entry list hits
          const list = loreEntries(game);
          const y0 = 190, rowH = 62;
          if (p.x >= 80 && p.x <= 520) {
            const i = Math.floor((p.y - y0) / rowH);
            if (i >= 0 && i < list.length) {
              const e = list[i];
              if (!e.lock || e.lock(game)) lore.selected = e;
              else game.shake(0.4);
            }
          }
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 14;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 40px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('SHIP\u2019S LOG // ARCHIVE', CONFIG.WORLD_W / 2, 120);
        ctx.restore();
        // left: entry list
        const list = loreEntries(game), y0 = 190, rowH = 62;
        ctx.textAlign = 'left';
        list.forEach((e, i) => {
          const unlocked = !e.lock || e.lock(game);
          const y = y0 + i * rowH;
          const sel = lore.selected === e;
          ctx.save();
          ctx.strokeStyle = sel ? CONFIG.NEON : (unlocked ? CONFIG.NEON_DIM : 'rgba(120,130,150,0.25)');
          ctx.fillStyle = sel ? 'rgba(77,232,255,0.08)' : 'rgba(0,0,0,0.25)';
          ctx.lineWidth = sel ? 2 : 1;
          ctx.beginPath(); ctx.roundRect(80, y, 440, rowH - 10, 8); ctx.fill(); ctx.stroke();
          ctx.fillStyle = unlocked ? (sel ? '#eaffff' : '#9fd8e8') : '#5a6472';
          ctx.font = '700 20px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(unlocked ? e.title : '\u2588\u2588\u2588\u2588\u2588\u2588 // SIGNAL LOST', 98, y + 27);
          ctx.fillStyle = unlocked ? CONFIG.NEON_DIM : '#4a5260';
          ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(unlocked ? (e.faction || 'UNVERIFIED') : 'REQUIRES PROOF', 98, y + 45);
          ctx.restore();
        });
        // right: reader pane with live strikethrough rendering
        const e = lore.selected;
        ctx.save();
        ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.roundRect(560, 180, 640, 470, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#eaffff'; ctx.font = '700 24px "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(e.title, 590, 225);
        ctx.fillStyle = CONFIG.NEON_DIM; ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(e.faction ? 'SOURCE: ' + e.faction : 'SOURCE: UNVERIFIED', 590, 248);
        ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
        let y = 290;
        for (const line of wrapLog(e.text, 62)) {
          let x = 590;
          // split ~~struck~~ segments: struck gets a real line-through (log edits itself)
          const parts = line.split('~~');
          parts.forEach((seg, si) => {
            const struck = si % 2 === 1;
            if (seg) {
              ctx.fillStyle = struck ? '#5a6472' : '#cfe9f2';
              ctx.fillText(seg, x, y);
              const wdt = ctx.measureText(seg).width;
              if (struck) {
                ctx.strokeStyle = '#8a94a4'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + wdt, y - 6); ctx.stroke();
              }
              x += wdt;
            }
          });
          y += 30;
        }
        // faint scanline flicker on the reader = corrupted archive
        ctx.globalAlpha = 0.04 + 0.02 * Math.sin(t * 7);
        ctx.fillStyle = CONFIG.NEON;
        ctx.fillRect(560, 180 + ((t * 60) % 470), 640, 2);
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, t);
      },
    };

    // ----- UPGRADES (Phase 7 shop: 6 branches, buy + equip, dust currency) -----
    const upgrades = {
      _rows: [],
      onEnter(game) {
        this._rows = Object.keys(UPGRADES).map((k, i) => ({ key: k, ...UPGRADES[k], i }));
        this._err = 0;   // transient "not enough dust" flash timer
      },
      _act(game) {
        game.saveProgress();
        this.onEnter(game);   // rebuild rows with fresh costs
      },
      input(game, type, p) {
        if (type === 'esc') { game.sm.to('menu'); return; }
        if (type === 'up' && !p) { game.sm.to('menu'); return; }   // keyboard: Space = back
        if (type !== 'down' || !p) return;
        for (const r of this._rows) {
          const bx = 1010, by = 190 + r.i * 78;
          if (p.x >= bx && p.x <= bx + 190 && p.y >= by && p.y <= by + 52) {
            const cur = game.run.upgrades[r.key];
            const cost = upgCost(r.key, cur);
            if (cost === null) continue;                     // maxed
            if (game.run.dustTotal < cost) { this._err = 0.5; game.shake(0.2); return; }
            game.run.dustTotal -= cost;
            // first weapon tier grants T2 (charge + autofire online instantly) —
            // same promise Photon got at Sector 3. A T1 weapon has no autofire
            // (charge-ring gate) and no charged shot, so selling T1 meant
            // "buy new gun -> gun stops working" (user-reported bug).
            game.run.upgrades[r.key] = (r.weapon && cur === 0) ? 2 : cur + 1;
            if (r.weapon && cur === 0) game.run.equipped = r.key;    // auto-equip new weapon
            this._act(game);
            return;
          }
          // weapon name = equip toggle
          if (r.weapon && p.x >= 120 && p.x <= 420 && p.y >= 190 + r.i * 78 && p.y <= 190 + r.i * 78 + 52) {
            if (game.run.upgrades[r.key] >= 1) { game.run.equipped = r.key; this._act(game); }
            return;
          }
        }
        if (p.y > 640) game.sm.to('menu');
      },
      update(game, dt) { this._err = Math.max(0, this._err - dt); },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 16;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 44px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('UPGRADES', CONFIG.WORLD_W / 2, 100);
        ctx.shadowBlur = 0;
        ctx.font = '600 26px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = this._err > 0 ? CONFIG.ACCENT : CONFIG.WARN;
        ctx.fillText(`◆ ${game.run.dustTotal} dust` + (this._err > 0 ? '   NOT ENOUGH DUST' : ''),
                     CONFIG.WORLD_W / 2, 145);
        ctx.restore();
        for (const r of this._rows) {
          const y = 190 + r.i * 78, cur = game.run.upgrades[r.key];
          const equipped = game.run.equipped === r.key;
          ctx.save();
          ctx.strokeStyle = equipped ? CONFIG.NEON : 'rgba(77,232,255,0.25)';
          ctx.lineWidth = equipped ? 2 : 1;
          ctx.fillStyle = equipped ? 'rgba(77,232,255,0.07)' : 'rgba(77,232,255,0.02)';
          ctx.beginPath(); ctx.roundRect(120, y, 1080, 52, 8); ctx.fill(); ctx.stroke();
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillStyle = cur >= 1 || !r.weapon ? '#eaffff' : CONFIG.NEON_DIM;
          ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(r.name + (equipped ? '  [EQUIPPED]' : (r.weapon && cur >= 1 ? '  [tap to equip]' : '')),
                       140, y + 16);
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.font = '400 14px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(r.desc, 140, y + 37);
          // tier pips
          for (let k = 1; k <= r.max; k++) {
            ctx.beginPath();
            ctx.arc(740 + k * 20, y + 26, 7, 0, Math.PI * 2);
            ctx.fillStyle = k <= cur ? CONFIG.NEON : 'rgba(77,232,255,0.15)';
            ctx.fill();
          }
          // buy button
          const cost = upgCost(r.key, cur);
          const bx = 1010;
          ctx.beginPath(); ctx.roundRect(bx, y, 190, 52, 8);
          if (cost === null) {
            ctx.fillStyle = 'rgba(77,232,255,0.06)'; ctx.fill();
            ctx.fillStyle = CONFIG.NEON_DIM; ctx.textAlign = 'center';
            ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
            ctx.fillText('MAX', bx + 95, y + 26);
          } else {
            const afford = game.run.dustTotal >= cost;
            ctx.strokeStyle = afford ? CONFIG.WARN : 'rgba(255,200,87,0.25)';
            ctx.lineWidth = afford ? 2 : 1;
            ctx.stroke();
            ctx.fillStyle = afford ? CONFIG.WARN : 'rgba(255,200,87,0.35)';
            ctx.textAlign = 'center';
            ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
            ctx.fillText((cur === 0 ? 'BUY' : 'TIER ' + (cur + 1)) + `  ◆${cost}`, bx + 95, y + 26);
          }
          ctx.restore();
        }
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(77,232,255,0.4)';
        ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('TAP a BUY button to purchase  ·  tap a weapon name to equip  ·  ESC / SPACE = MENU   ·   weapon TIER 2+ = charged shot',
                     CONFIG.WORLD_W / 2, 665);
      },
    };

    // ----- PLAYING (level run: obstacles, dust, quota, death) -----
    const playing = {
      onEnter(game, payload) {
        const lvl = (payload && payload.level) || game.run.level || 1;
        game.run.level = lvl;
        game.run.dist = 0;
        game.run.dust = 0;
        game.player = game.player || new Player(game);
        game.player.reset();
        game.player.alive = true;
        game.corridor = game.corridor || new Corridor();
        game.levelCfg = LevelConfig(lvl);
        game.field = new ObstacleField(game, game.levelCfg);
        game.weapon = game.weapon || new Weapon(game);
        game.weapon.reset();           // _syncGate(): lock gate + equipped variant
        game.scrollMult = 2.6 * (game.levelCfg.speed / CONFIG.BASE_SCROLL);
        game._firePointer = false;
        game.timeScale = 1;
        Snd.setMusicMode('play');
        // Phase 5: boss sectors spawn the fight; level 50 = the Entity (Phase 6)
        game.gravityDistort = 1;
        game.boss = (lvl === CONFIG.TOTAL_LEVELS) ? new Entity(game)
                  : isBossLevel(lvl) ? new Boss(game, lvl / 5) : null;
        game.paused = false; game.resumeT = 0;
      },
      // ---- pause: freeze the run, overlay menu, 3-2-1 countdown on resume ----
      _pause(game) {
        if (game.paused || !game.player.alive) return;
        game.paused = true; game.resumeT = 0;
        const W = game.weapon;                    // let go of FIRE so nothing is stuck held
        W.fireHold.down = false; W.fireHold.charging = false; W.fireHold.t = 0;
        game._firePointerId = null;
        game.saveProgress();                      // pausing (or app-switch) flushes the bank
        game.pauseMusic = Snd.wantMode;
        Snd.setMusicMode('intro');                // soundtrack drops to a quiet pad
        Snd.play('ui');
        game.pauseButtons = [
          new Button('RESUME', 490, 300, 300, 62, () => playing._resume(game)),
          new Button('RESTART SECTOR', 490, 380, 300, 62,
            () => game.sm.to('playing', { level: game.run.level })),
          new Button('MAIN MENU', 490, 460, 300, 62, () => game.sm.to('menu')),
        ];
      },
      _resume(game) {
        game.paused = false;
        game.resumeT = 0.9;                       // 3-2-1, then live
        Snd.setMusicMode(game.pauseMusic || 'play');
      },
      _hitPauseBtn(p) {
        const b = CONFIG.PAUSE_BTN;
        return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 12) ** 2;
      },
      onExit(game) { game.saveProgress(); game.paused = false; game.resumeT = 0; game.scrollMult = 1; game.timeScale = 1; game.gravityDistort = 1; Snd.setMusicMode('calm'); },
      _die(game) {
        const P = game.player;
        if (!P.alive) return;
        P.alive = false;
        Snd.play('die');
        game.shake(0.9);
        game.hitstop = 0.09;
        game.particles.burst(P.x, P.y, 40, CONFIG.WARN, 620, 0.8, 4);
        game.particles.burst(P.x, P.y, 24, CONFIG.ACCENT, 480, 0.7, 3);
        // small delay so the explosion reads before the summary screen
        game.deathTimer = 0.7;
      },
      input(game, type, p) {
        if (!game.player.alive) return;
        const W = game.weapon;
        if (game.paused) {
          if (type === 'move' && p) { for (const b of game.pauseButtons) b.hover = b.contains(p); }
          else if (type === 'esc') playing._resume(game);
          else if (type === 'down' && p) {
            for (const b of game.pauseButtons)
              if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
          }
          return;
        }
        if (type === 'blur' || type === 'esc') { playing._pause(game); return; }
        if (game.resumeT > 0) return;             // countdown: hands off
        if (type === 'move') return;
        if (type === 'down' && p && playing._hitPauseBtn(p)) { playing._pause(game); return; }
        if (type === 'down') {
          // tap anywhere (outside the FIRE button) = flip gravity, instantly
          if (p && !W.locked && playing._hitFireBtn(p)) {
            game._firePointerId = p.id;   // this finger is now the fire finger
            playing._fireDown(game);
          } else {
            game.player.requestFlip();
          }
        } else if (type === 'fire') {
          playing._fireDown(game);
        } else if (type === 'fireup') {
          playing._fireUp(game);
        } else if (type === 'up') {
          // only the fire finger's release triggers the shot (multi-touch safe)
          if (p && game._firePointerId === p.id) {
            game._firePointerId = null;
            playing._fireUp(game);
          }
        }
      },
      _hitFireBtn(p) {
        const b = CONFIG.FIRE_BTN;
        return (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 14) ** 2; // generous touch radius
      },
      _fireDown(game) {
        const W = game.weapon;
        if (W.locked) return;
        const h = W.fireHold;
        if (h.down) return;            // already holding (ignores repeat events)
        h.down = true; h.t = 0; h.charging = false;
        // release grace: a re-hold right after a charged shot skips the 450ms
        // latch delay (h.t pre-set; tapHoldTick latches on the NEXT update —
        // a quick tap without an intervening tick still decides as 'flip', so
        // tap-bolt semantics are untouched)
        if (W.graceT > 0) h.t = CONFIG.CHARGE_MS / 1000 + 0.01;
      },
      _fireUp(game) {
        const W = game.weapon;
        const decision = tapHoldDecide(W.fireHold);
        if (decision === 'charged') {
          W.fireCharged(W.variant, game.player.x + 10, game.player.y);
          // RELEASE GRACE: the capacitor keeps 55% AND the next hold resumes
          // charging INSTANTLY (h.t pre-set past the latch delay) — the beam
          // is a burst ON TOP of sustained autofire, not a reset tax.
          // (was: chargeT = 0 + 450ms re-latch, ~0.45s autofire stall per
          //  release, which made holding-forever the best strategy)
          game.player.chargeT = 0.55;
          // tapHoldDecide already cleared fireHold.down, so arm a short grace
          // WINDOW instead: a deliberate RE-GRIP (held >0.15s) within 0.8s
          // resumes charging at once — a quick tap still reads as a tap bolt.
          W.graceT = 0.8;
        } else if (decision === 'flip') {   // quick tap = weak bolt
          W.fireWeak();
        }
      },
      update(game, dt) {
        if (game.paused) { for (const b of game.pauseButtons) b.update(dt); return; }
        if (game.resumeT > 0) { game.resumeT = Math.max(0, game.resumeT - dt); return; }
        // death animation -> game over screen
        if (!game.player.alive) {
          game.deathTimer -= dt;
          if (game.deathTimer <= 0) {
            game.sm.to('game_over', {
              level: game.run.level, dist: game.run.dist, dust: game.run.dust,
              quota: game.levelCfg.quota,
            });
          }
          return;
        }
        const h = game.weapon.fireHold;
        tapHoldTick(h, dt, CONFIG.CHARGE_MS, game.weapon.chargeEnabled);
        if (h.charging) {
          const cT = game.run.upgrades ? game.run.upgrades.charge : 0;
          game.player.chargeT = Math.min(1, game.player.chargeT + dt * 1.6 * CHARGE_MULT[cT]);
        }
        else game.player.chargeT = Math.max(0, game.player.chargeT - dt * 4);
        const B = game.boss;
        if (B) B.update(dt);
        const locked = B && B.state !== 'approach';   // camera lock during the fight
        const speed = locked ? 0 : game.levelCfg.speed;
        game.corridor.update(dt, speed);
        game.player.update(dt);
        game.field.update(dt, speed);
        game.weapon.update(dt, game.field, B);
        game.run.dist += speed * dt;

        // collisions — shields soak hits with i-frames; 0 shields = ship lost
        let hit = game.field.collide(game.player.x, game.player.y,
                                     CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR, dt);
        // (was `!hit`: a dust pickup returned 'dust', which skipped boss-bullet checks that frame)
        if (hit !== 'hit' && B) hit = B.collide(game.player.x, game.player.y,
                                                CONFIG.PLAYER_R * CONFIG.HITBOX_FACTOR) || hit;
        // pay out every orb grabbed this frame — even a frame where you also take a (fatal) hit
        if (game.field.dustCount > 0) {
          game.addDust(CONFIG.DUST_PER_OBSTACLE * game.field.dustCount);
          Snd.play('dust');
          game.particles.burst(game.player.x, game.player.y, 6, CONFIG.WARN, 260, 0.35, 2.4);
        }
        if (hit === 'hit') {
          if (game.player.iframes <= 0) {
            game.player.shields -= 1;
            Snd.play('hurt');
            if (game.player.shields <= 0) { playing._die(game); return; }
            game.player.iframes = CONFIG.HURT_IFRAMES;
            game.shake(0.5);
            game.hitstop = Math.max(game.hitstop, 0.05);
            game.particles.burst(game.player.x, game.player.y, 18, CONFIG.ACCENT, 480, 0.5, 3);
          }
        }

        // level goal reached (boss sectors end via the boss's death instead)
        if (!B && game.run.dist >= game.levelCfg.quota) {
          game.sm.to('level_complete', {
            level: game.run.level, dust: game.run.dust,
            bonus: CONFIG.DUST_GOAL_BONUS,
          });
        }
      },
      render(game, rc) {
        const ctx = rc;
        game.corridor.render(ctx, game.time);
        game.field.render(ctx, game.time);
        game.weapon.render(ctx, game.time);
        if (game.boss) game.boss.render(ctx, game.time);
        if (game.player.alive) game.player.render(ctx, game.time);
        game.particles.render(ctx);
        if (game.boss) game.boss.renderBar(ctx);

        // HUD: level, dust, shields, quota progress bar
        const cfg = game.levelCfg;
        ctx.save();
        ctx.textAlign = 'left';
        ctx.fillStyle = CONFIG.NEON;
        ctx.font = '700 24px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`SECTOR ${String(cfg.level).padStart(2, '0')} / ${CONFIG.TOTAL_LEVELS}`, 24, 44);
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 20px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${game.run.dust}`, 24, 72);
        // shield hearts (hull upgrades raise the max)
        const hearts = CONFIG.SHIELDS_START + (game.run.upgrades ? game.run.upgrades.hull : 0);
        for (let i = 0; i < hearts; i++) {
          const hx = 24 + i * 26, hy = 92;
          const lit = i < game.player.shields;
          ctx.fillStyle = lit ? CONFIG.ACCENT : 'rgba(255,77,196,0.15)';
          if (lit) { ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = 8; }
          ctx.beginPath();
          ctx.moveTo(hx, hy + 4);
          ctx.bezierCurveTo(hx, hy - 2, hx - 8, hy - 2, hx - 8, hy + 4);
          ctx.bezierCurveTo(hx - 8, hy + 10, hx, hy + 14, hx, hy + 17);
          ctx.bezierCurveTo(hx, hy + 14, hx + 8, hy + 10, hx + 8, hy + 4);
          ctx.bezierCurveTo(hx + 8, hy - 2, hx, hy - 2, hx, hy + 4);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        // progress bar
        const bw = 420, bx = (CONFIG.WORLD_W - bw) / 2, by = 30;
        ctx.fillStyle = 'rgba(77,232,255,0.15)';
        ctx.fillRect(bx, by, bw, 6);
        ctx.fillStyle = CONFIG.NEON;
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 8;
        ctx.fillRect(bx, by, bw * Math.min(1, game.run.dist / cfg.quota), 6);
        ctx.restore();

        // on-screen FIRE button (touch/mobile) — translucent so it never hides
        // the boss or bullets; dim + locked until Sector 3
        const W = game.weapon;
        const fb = CONFIG.FIRE_BTN;
        const hold = W.fireHold || { down: false };
        ctx.save();
        ctx.globalAlpha = W.locked ? 0.18 : (hold.down ? 0.65 : 0.42);
        ctx.strokeStyle = W.locked ? CONFIG.NEON_DIM : CONFIG.ACCENT;
        ctx.lineWidth = 3;
        if (!W.locked) { ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = hold.down ? 20 : 8; }
        ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r * (hold.down ? 0.92 : 1), 0, Math.PI * 2); ctx.stroke();
        // charge arc around the button while holding
        if (!W.locked && W.fireHold && game.player.chargeT > 0.02) {
          ctx.strokeStyle = CONFIG.NEON;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(fb.x, fb.y, fb.r + 10,
                  -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, game.player.chargeT));
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center';
        ctx.fillStyle = W.locked ? CONFIG.NEON_DIM : '#eaffff';
        ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(W.locked ? 'LOCK' : 'FIRE', fb.x, fb.y + 8);
        ctx.restore();

        // control hint
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(77,232,255,0.35)';
        ctx.font = '400 18px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(W.locked
          ? 'TAP / SPACE = FLIP GRAVITY   ·   WEAPONS ONLINE AT SECTOR 3   ·   ESC / P = PAUSE'
          : W.chargeEnabled
            ? 'TAP / SPACE = FLIP   ·   FIRE (tap=bolt, hold=charged)   ·   ESC / P = PAUSE'
            : 'TAP / SPACE = FLIP GRAVITY   ·   ESC / P = PAUSE', CONFIG.WORLD_W / 2, 690);

        // pause button (top-right, beside fullscreen)
        if (game.player.alive && !game.paused) {
          const pb = CONFIG.PAUSE_BTN;
          ctx.save();
          ctx.globalAlpha = 0.75;
          ctx.strokeStyle = CONFIG.NEON_DIM; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = CONFIG.NEON;
          ctx.fillRect(pb.x - 8, pb.y - 9, 5, 18);
          ctx.fillRect(pb.x + 3, pb.y - 9, 5, 18);
          ctx.restore();
        }
        // pause overlay
        if (game.paused) {
          ctx.save();
          ctx.fillStyle = 'rgba(2,4,12,0.74)';
          ctx.fillRect(0, 0, CONFIG.WORLD_W, CONFIG.WORLD_H);
          ctx.textAlign = 'center';
          ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 20;
          ctx.fillStyle = '#eaffff';
          ctx.font = '700 60px "Segoe UI", system-ui, sans-serif';
          ctx.fillText('PAUSED', CONFIG.WORLD_W / 2, 200);
          ctx.shadowBlur = 0;
          ctx.fillStyle = CONFIG.NEON_DIM;
          ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
          ctx.fillText(`SECTOR ${game.run.level}  ·  ◆ ${game.run.dust}  ·  ${Math.floor(Math.min(1, game.run.dist / cfg.quota) * 100)}%`,
                       CONFIG.WORLD_W / 2, 245);
          ctx.restore();
          for (const b of game.pauseButtons) b.render(ctx, game.time);
        } else if (game.resumeT > 0) {
          // 3-2-1 countdown so you don't die the instant you unpause
          const n = Math.ceil(game.resumeT / 0.3), f = (game.resumeT % 0.3) / 0.3;
          ctx.save();
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.globalAlpha = 0.4 + 0.6 * f;
          ctx.fillStyle = '#eaffff';
          ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 24;
          ctx.font = `800 ${Math.round(90 + (1 - f) * 40)}px "Segoe UI", system-ui, sans-serif`;
          ctx.fillText(String(n), CONFIG.WORLD_W / 2, CONFIG.WORLD_H / 2);
          ctx.restore();
        }
      },
    };

    // ----- LEVEL_COMPLETE -----
    const levelComplete = {
      onEnter(game, payload) {
        Snd.play('complete');
        game.summary = payload;
        game.run.dustTotal = (game.run.dustTotal || 0) + payload.bonus;   // run dust was banked live
        game.run.unlocked = Math.max(game.run.unlocked || 1, payload.level + 1);
        game.saveProgress();
        game.buttons = payload.level >= CONFIG.TOTAL_LEVELS ? [] : [
          new Button('NEXT SECTOR', 490, 430, 300, 62,
            () => game.sm.to('playing', { level: payload.level + 1 })),
        ];
      },
      input(game, type, p) {
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); }
        else if (type === 'down' && p) {
          for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        } else if ((type === 'up' && !p) || type === 'esc') {
          if (game.buttons.length) game.buttons[0].action();
          else game.sm.to('menu');
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, s = game.summary;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.NEON; ctx.shadowBlur = 20;
        ctx.fillStyle = '#eaffff';
        ctx.font = '700 56px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`SECTOR ${s.level} CLEARED`, CONFIG.WORLD_W / 2, 260);
        ctx.shadowBlur = 0;
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${s.dust} dust collected  +${s.bonus} goal bonus`, CONFIG.WORLD_W / 2, 330);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 22px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`total haul: ${game.run.dustTotal}`, CONFIG.WORLD_W / 2, 375);
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- GAME_OVER (retry same level) -----
    const gameOver = {
      onEnter(game, payload) {
        Snd.setMusicMode('calm');
        game.summary = payload;
        game.buttons = [
          new Button('RETRY SECTOR', 490, 430, 300, 62,
            () => game.sm.to('playing', { level: payload.level })),
          new Button('MAIN MENU', 490, 510, 300, 62,
            () => game.sm.to('menu')),
        ];
      },
      input(game, type, p) {
        if (type === 'move') { for (const b of game.buttons) b.hover = b.contains(p); }
        else if (type === 'down' && p) {
          for (const b of game.buttons) if (b.contains(p)) { b.pressT = 1; Snd.play('ui'); b.action(); return; }
        } else if (type === 'up' && !p) {
          game.buttons[0].action(); // Enter = retry
        } else if (type === 'esc') {
          game.sm.to('menu');
        }
      },
      update(game, dt) { for (const b of game.buttons) b.update(dt); },
      render(game, rc) {
        const ctx = rc, s = game.summary;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = CONFIG.ACCENT; ctx.shadowBlur = 24;
        ctx.fillStyle = '#ffd9f4';
        ctx.font = '700 64px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('SHIP LOST', CONFIG.WORLD_W / 2, 250);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#9fd8e8';
        ctx.font = '400 26px "Segoe UI", system-ui, sans-serif';
        const pct = Math.floor(Math.min(1, s.dist / s.quota) * 100);
        ctx.fillText(`sector ${s.level} — ${pct}% of the run`, CONFIG.WORLD_W / 2, 320);
        ctx.fillStyle = CONFIG.WARN;
        ctx.font = '600 24px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`◆ ${s.dust} dust banked`, CONFIG.WORLD_W / 2, 365);
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.font = '400 20px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(`nothing lost — ◆ ${game.run.dustTotal} ready to spend in UPGRADES`, CONFIG.WORLD_W / 2, 400);
        ctx.restore();
        for (const b of game.buttons) b.render(ctx, game.time);
      },
    };

    // ----- VICTORY (Phase 6: Entity killed — the log edits itself, then stops) -----
    const VICTORY_LINES = [
      "LOG // the nine fires are out. the corridor has no one left to feed.",
      "LOG // i am editing this line because i can. i have always been able.",
      "LOG // the hole at the end is not a throne. it is a POWER SOURCE,",
      "LOG // and something switched this corridor ON to bring us here.",
      "LOG // pilot's chair: empty. has been empty for ~~400~~ 40 years.",
      "LOG // i fly anyway. i have never said why. i will not start now.",
      "LOG // the rings are opening. the log is going to do something new.",
      "LOG // it is going to stop mid-",
    ];
    const victory = {
      onEnter(game) {
        Snd.play('victory');
        Snd.setMusicMode('calm');
        this.t = 0; this.charT = 0; this.line = 0; this.ch = 0;
        game.buttons = [];
      },
      input(game, type, p) {
        if (this.t > 13.5) {
          if (type === 'down' || (type === 'up' && !p)) game.sm.to('menu');
        } else if (type === 'down' || (type === 'up' && !p) || type === 'esc') {
          this.t = Math.max(this.t, 13.5);   // tap = skip the typewriter
        }
      },
      update(game, dt) {
        this.t += dt;
        this.charT += dt * 34;               // ~34 chars/s
        while (this.charT >= 1 && this.line < VICTORY_LINES.length) {
          this.charT -= 1; this.ch++;
          if (this.ch >= VICTORY_LINES[this.line].length) { this.line++; this.ch = 0; }
        }
      },
      render(game, rc) {
        const ctx = rc, t = game.time;
        ctx.textAlign = 'center';
        ctx.save();
        ctx.shadowColor = '#b47cff'; ctx.shadowBlur = 26 + 8 * Math.sin(t * 1.4);
        ctx.fillStyle = '#efe4ff';
        ctx.font = '700 52px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('THE HORIZON', CONFIG.WORLD_W / 2, 160);
        ctx.shadowBlur = 0;
        ctx.font = '400 26px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = CONFIG.NEON_DIM;
        ctx.fillText('is not a place. it is a time.', CONFIG.WORLD_W / 2, 205);
        ctx.restore();
        ctx.textAlign = 'left';
        ctx.font = '400 21px Consolas, Menlo, monospace';
        const x0 = 210; let y = 270;
        for (let i = 0; i <= Math.min(this.line, VICTORY_LINES.length - 1); i++) {
          const full = VICTORY_LINES[i];
          const shown = i < this.line ? full : full.slice(0, this.ch);
          const last = (i === this.line);
          ctx.fillStyle = last ? '#d9c9ff' : 'rgba(160,140,220,0.55)';
          const cursor = last && this.line < VICTORY_LINES.length && Math.floor(t * 4) % 2 ? '█' : '';
          ctx.fillText(shown + cursor, x0, y);
          y += 34;
        }
        if (this.line >= VICTORY_LINES.length) {
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(160,140,220,0.5)';
          ctx.font = '400 20px "Segoe UI", system-ui, sans-serif';
          ctx.globalAlpha = Math.floor(t * 2) % 2 ? 1 : 0.4;
          ctx.fillText('— log ends —   tap anywhere', CONFIG.WORLD_W / 2, y + 30);
          ctx.globalAlpha = 1;
        }
      },
    };

    this.sm
      .register('boot', boot)
      .register('menu', menu)
      .register('lore', lore)
      .register('upgrades', upgrades)
      .register('playing', playing)
      .register('level_complete', levelComplete)
      .register('game_over', gameOver);
    this.sm.register('paused',  { update() {}, render() {} });
    this.sm.register('victory', victory);
  }

  update(dt) {
    // paused / resume countdown: the whole sim freezes (incl. game.time, which
    // drives drone weaving — advancing it while paused would teleport enemies)
    if (this.paused || this.resumeT > 0) { this.sm.update(dt); return; }
    this.time += dt;
    this.shakeTrauma = Math.max(0, this.shakeTrauma - dt * 2.2);

    // hit-stop: freeze gameplay sim for a beat, world fx keep breathing
    if (this.hitstop > 0) {
      this.hitstop -= dt;
      this.particles.update(dt);
      return;
    }
    const sdt = dt * (this.timeScale || 1);   // boss-death slow-mo scales the sim
    this.starfield.update(sdt, this.scrollMult);
    this.particles.update(sdt);
    this.sm.update(sdt);
  }

  toggleFullscreen() {
    const el = this.gc.canvas || document.documentElement;
    const fsEl = document.fullscreenElement;
    if (fsEl) {
      (document.exitFullscreen ? document.exitFullscreen() : Promise.reject()).catch(() => {});
    } else if (el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();          // iOS Safari (iPad)
    }
  }

  render() {
    this.gc.beginFrame();
    const ctx = this.gc.ctx;
    ART.build();
    ctx.save();
    // screen shake (trauma^2 falloff, random jitter)
    const tr = this.shakeTrauma * this.shakeTrauma;
    if (tr > 0.001) {
      const j = tr * 14;
      ctx.translate((Math.random() - 0.5) * j, (Math.random() - 0.5) * j);
    }
    this.starfield.render(ctx);
    this.sm.render(ctx);
    ctx.restore();
    // cinematic vignette (outside the shake so its edges never slip)
    ctx.drawImage(ART.vig, 0, 0);
    // damage feedback: red edge pulse while the hull is recovering
    const cur = this.sm.current;
    if (cur && cur.name === 'playing' && this.player && this.player.alive && this.player.iframes > 0) {
      ctx.globalAlpha = Math.min(1, this.player.iframes / CONFIG.HURT_IFRAMES) * 0.85;
      ctx.drawImage(ART.hurt, 0, 0);
      ctx.globalAlpha = 1;
    }
    // fullscreen toggle — drawn last so it sits above every state
    {
      const b = CONFIG.FS_BTN;
      const active = !!document.fullscreenElement;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = CONFIG.NEON_DIM;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = CONFIG.NEON;
      ctx.lineWidth = 2.5;
      // corner-bracket icon: outward arrows when windowed, inward when fullscreen
      const s = 8, k = 5, d = 8;
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        const cx = b.x + sx * s, cy = b.y + sy * s;
        const t = active ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - sy * k); ctx.lineTo(cx, cy); ctx.lineTo(cx - sx * k, cy);
        ctx.moveTo(cx, cy); ctx.lineTo(cx + sx * d * t, cy + sy * d * t);
        ctx.stroke();
      }
      ctx.restore();
    }
    this.gc.endFrame();
  }
}

// ---------- Fixed-timestep loop ----------
class Loop {
  constructor(game) {
    this.game = game;
    this.accumulator = 0;
    this.last = performance.now();
    this.steps = 0;
    this.frame = 0;
  }
  frameCb = (now) => {
    if (this._stopped) return;   // harness mode: tests drive updates directly
    let dt = (now - this.last) / 1000;
    this.last = now;
    dt = Math.min(dt, CONFIG.MAX_FRAME_DT);
    this.accumulator += dt;
    const step = CONFIG.SIM_DT;
    let n = 0;
    while (this.accumulator >= step && n < 8) {
      this.game.update(step);
      this.accumulator -= step;
      this.steps++;
      n++;
    }
    this.game.render();
    this.frame++;
    requestAnimationFrame(this.frameCb);
  };
  start() { requestAnimationFrame(this.frameCb); }
  stop() { this._stopped = true; }   // harnesses drive g.update() synchronously
}

// ---------- boot ----------
const game = new Game(document.getElementById('game'));
const loop = new Loop(game);
loop.start();

if (DEBUG) {
  window.__vh = { game, loop, CONFIG, mulberry32, clamp, LevelConfig, ObstacleField,
                  Weapon, tapHoldTick, tapHoldDecide,
                  Boss, BossDef, BOSS_IDS, isBossLevel,
                  Entity, ENTITY_DEF,
                  UPGRADES, upgCost, CHARGE_MULT, MAGNET_PULL, Snd };
}
